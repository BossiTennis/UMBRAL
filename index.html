<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#2E1016">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Umbral">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<title>Umbral — Seguimiento de atletas</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap');
  :root{ --navh:64px; }
  body.theme-dark{
    --bg:#121210; --panel:#1C1B17; --panel2:#232019; --panel3:#2A2116; --border:#2A2822;
    --ink:#F2EEE4; --muted:#8C8578; --accent:#C98A3E; --accent-dim:#3A2A14; --on-accent:#14100A;
    --warn:#E0A050; --danger:#E2685C;
  }
  body.theme-light{
    --bg:#EDE4D3; --panel:#FAF6EE; --panel2:#F3E9DA; --panel3:#F3E4E1; --border:#DED0BC;
    --ink:#3A2A22; --muted:#8C8073; --accent:#6E1F2A; --accent-dim:#F3E4E1; --on-accent:#FAF6EE;
    --warn:#A6741F; --danger:#A83A2E;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{background:var(--bg);color:var(--ink);font-family:'Manrope',sans-serif;min-height:100vh;transition:background .25s,color .25s;}
  .app{max-width:720px;margin:0 auto;padding:18px 16px calc(var(--navh) + 34px);}
  header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:16px;}
  .brand{display:flex;align-items:baseline;gap:9px;}
  .brand h1{font-family:'Fraunces',serif;font-weight:700;font-size:21px;letter-spacing:-0.01em;}
  .brand span{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.1em;}
  .role-switch{display:flex;background:var(--panel);border:1px solid var(--border);border-radius:100px;padding:3px;}
  .role-switch button{border:none;background:transparent;color:var(--muted);font-weight:700;font-size:12.5px;padding:7px 15px;border-radius:100px;cursor:pointer;font-family:'Manrope',sans-serif;}
  .role-switch button.active{background:var(--accent);color:var(--on-accent);}
  .theme-toggle{background:var(--panel);border:1px solid var(--border);color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;padding:8px 14px;border-radius:100px;cursor:pointer;}
  .theme-toggle:hover{color:var(--accent);border-color:var(--accent);}
  .notice{background:var(--panel2);border:1px solid var(--border);border-left:3px solid var(--warn);border-radius:4px;padding:10px 14px;font-size:12px;color:var(--muted);margin-bottom:18px;line-height:1.5;}
  .notice b{color:var(--ink);}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:16px;}
  .card h2{font-family:'Fraunces',serif;font-size:18px;font-weight:600;margin-bottom:14px;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  select, input[type=text], input[type=date], input[type=number], textarea{
    background:var(--panel2); border:1px solid var(--border); color:var(--ink);
    border-radius:6px; padding:9px 11px; font-family:'Manrope',sans-serif; font-size:14px;
  }
  select:focus, input:focus, textarea:focus{outline:2px solid var(--accent); outline-offset:1px;}
  textarea{width:100%; resize:vertical; line-height:1.55;}
  label.field-label{display:block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:5px;}
  button.btn{background:var(--accent); color:var(--on-accent); border:none; font-weight:700; font-size:14px; padding:10px 18px; border-radius:7px; cursor:pointer; font-family:'Manrope',sans-serif; transition:filter .12s, transform .08s;}
  button.btn:hover{filter:brightness(1.08);}
  button.btn:active{transform:scale(0.97);}
  button.btn.ghost{background:transparent; border:1px solid var(--border); color:var(--ink); font-weight:600;}
  button.btn.danger{background:var(--danger);color:#FAF6EE;}
  button.btn.small{padding:6px 12px;font-size:12.5px;}
  button.btn:disabled{opacity:0.4;cursor:not-allowed;}

  #tabContent, #main > .card:first-child{animation:fadeSlide .28s ease both;}
  @keyframes fadeSlide{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  @media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important;} }

  .bottomnav{position:fixed;left:0;right:0;bottom:0;height:var(--navh);background:var(--panel);border-top:1px solid var(--border);display:flex;z-index:40;}
  .bottomnav button{flex:1;background:transparent;border:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;font-family:'Manrope',sans-serif;font-size:10.5px;font-weight:600;}
  .bottomnav button .ic{width:20px;height:20px;}
  .bottomnav button.active{color:var(--accent);}
  .bottomnav button.active svg{stroke:var(--accent);}
  .bottomnav button svg{stroke:var(--muted);}

  .acc{border:1px solid var(--border);border-radius:8px;margin-bottom:10px;overflow:hidden;}
  .acc-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:var(--panel2);cursor:pointer;}
  .acc-head b{font-family:'Fraunces',serif;text-transform:capitalize;font-size:15px;font-weight:600;}
  .acc-head .chev-arrow{display:inline-block;color:var(--accent);font-family:'IBM Plex Mono',monospace;font-size:11.5px;transition:transform .25s ease;}
  .acc-head .chev-count{color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:11.5px;margin-left:6px;}
  .acc.open .acc-head .chev-arrow{transform:rotate(180deg);}
  /* Sin límite de altura al abrir: con 3000px el contenido se recortaba a
     partir del sexto ejercicio y no se podía seguir bajando. La apertura se
     acompaña con un fundido para que no resulte brusca. */
  .acc-body{max-height:0;overflow:hidden;padding:0 16px;transition:padding .22s ease;}
  .acc.open .acc-body{max-height:none;overflow:visible;padding:16px;animation:accOpen .26s ease both;}
  @keyframes accOpen{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:translateY(0);}}
  .block-title{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:0.08em;margin:14px 0 8px;padding-top:10px;border-top:1px dashed var(--border);}
  .block-title:first-child{border-top:none;padding-top:0;margin-top:0;}

  .ex-card{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:10px;position:relative;}
  .ex-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}
  .ex-grid .full{grid-column:1/-1;}
  .ex-grid > div{min-width:0;}
  .ex-grid input, .ex-grid select, .ex-grid textarea{width:100%;min-width:0;}
  .timer-fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0;}
  .timer-fields > div{display:flex;flex-direction:column;gap:5px;min-width:0;}
  .timer-fields input{width:100%;min-width:0;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:16px;padding:10px 4px;}
  .timer-fields .field-label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  @media (max-width:400px){
    .ex-grid{grid-template-columns:1fr;}
    .timer-fields{grid-template-columns:repeat(2,minmax(0,1fr));}
  }
  .ex-view-card{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:14px 16px;margin-bottom:10px;}
  .ex-view-card h4{font-family:'Fraunces',serif;font-size:15.5px;font-weight:600;margin-bottom:4px;}
  .ex-view-card p.desc{font-size:12.5px;color:var(--muted);margin-bottom:8px;}
  .ex-meta{display:flex;gap:14px;flex-wrap:wrap;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--muted);}
  .ex-meta b{color:var(--ink);}
  .save-flag{position:absolute;top:10px;right:12px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--accent);opacity:0;transition:opacity .3s;}
  .save-flag.show{opacity:1;}

  .ai-import{background:var(--panel3);border:1px dashed var(--border);border-radius:8px;padding:12px;margin-bottom:12px;}
  .ai-import textarea{min-height:70px;margin-bottom:8px;}

  .entry{border-bottom:1px dashed var(--border);padding:12px 0;}
  .entry:last-child{border-bottom:none;}
  .entry-top{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-family:'IBM Plex Mono',monospace;}
  .pill{display:inline-block;min-width:26px;text-align:center;border-radius:100px;padding:2px 8px;font-weight:700;font-size:12px;font-family:'IBM Plex Mono',monospace;}
  .empty{color:var(--muted);font-size:13px;font-style:italic;padding:14px 0;}

  .scale{display:flex;gap:7px;flex-wrap:wrap;}
  .scale button{min-width:38px;height:38px;padding:0 8px;border-radius:7px;border:1px solid var(--border);background:var(--panel2);color:var(--muted);font-family:'IBM Plex Mono',monospace;font-weight:600;cursor:pointer;}
  .scale button.sel{background:var(--accent);border-color:var(--accent);color:var(--on-accent);}
  .scale-labels{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-top:4px;}
  .q-item{margin-bottom:26px;}
  .q-item p{font-size:14px;margin-bottom:9px;}
  .q-note{margin-top:8px;}
  .q-note textarea{min-height:36px;font-size:12.5px;}

  .session-overlay{position:fixed;inset:0;background:var(--bg);z-index:100;overflow-y:auto;padding:16px 16px calc(env(safe-area-inset-bottom) + 24px);}
  .session-topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .session-topbar h2{font-family:'Fraunces',serif;font-size:19px;}
  .stopwatch{font-family:'IBM Plex Mono',monospace;font-size:52px;font-weight:600;text-align:center;color:var(--accent);letter-spacing:0.02em;margin:6px 0 16px;}
  .set-box{display:inline-flex;gap:5px;flex-wrap:wrap;margin-top:6px;}
  .set-chip{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:var(--panel);color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:11.5px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .set-chip.done{background:var(--accent);border-color:var(--accent);color:var(--on-accent);}
  .ex-view-card.done h4{text-decoration:line-through;color:var(--muted);}
  .rpe-applied{display:flex;align-items:center;gap:8px;margin-top:8px;}
  .rpe-applied input{width:60px;}

  .modal-back{position:fixed;inset:0;background:rgba(3,8,6,0.7);z-index:120;display:flex;align-items:flex-end;justify-content:center;}
  .modal{background:var(--panel);border-top-left-radius:14px;border-top-right-radius:14px;width:100%;max-width:720px;padding:20px;max-height:85vh;overflow-y:auto;}
  .mode-tabs{display:flex;gap:6px;margin-bottom:14px;}
  .mode-tabs button{flex:1;background:var(--panel2);border:1px solid var(--border);color:var(--muted);padding:8px;border-radius:6px;font-weight:700;font-size:12.5px;cursor:pointer;}
  .mode-tabs button.active{background:var(--accent-dim);color:var(--accent);border-color:var(--accent);}
  .preset-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0;}
  .preset-grid button{background:var(--panel2);border:1px solid var(--border);color:var(--ink);padding:9px 4px;border-radius:6px;font-family:'IBM Plex Mono',monospace;font-size:12px;cursor:pointer;}
  .interval-display{font-family:'IBM Plex Mono',monospace;font-size:36px;text-align:center;margin:14px 0;padding:20px;border-radius:10px;letter-spacing:0.01em;}
  .interval-display .phase{display:block;font-size:14px;font-weight:700;letter-spacing:0.08em;margin-bottom:6px;}
  .interval-display .round{display:block;font-size:12px;font-family:'Manrope',sans-serif;font-weight:600;margin-top:6px;color:var(--muted);}
  .interval-display.work{background:var(--accent-dim);color:var(--accent);}
  .interval-display.rest{background:#3A2A12;color:var(--warn);}
  .interval-display.idle{background:var(--panel2);color:var(--muted);}
  .amrap-count{font-family:'IBM Plex Mono',monospace;font-size:40px;text-align:center;color:var(--accent);margin:10px 0;}

  .cal-banner{background:var(--accent);color:var(--on-accent);border-radius:8px;padding:12px 14px;margin-bottom:14px;font-size:13.5px;}
  .cal-banner.muted{background:var(--panel2);color:var(--muted);}
  .cal-banner b{color:inherit;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cal-grid .dow{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);text-align:center;padding:4px 0;}
  .cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:6px;font-size:12.5px;background:var(--panel2);color:var(--muted);}
  .cal-day.today{border:1px solid var(--accent);color:var(--ink);}
  .cal-day.call{background:var(--accent);color:var(--on-accent);font-weight:700;}
  .cal-day.empty{background:transparent;}
  .pending-task{background:var(--panel3);border:1px dashed var(--accent);border-radius:8px;padding:14px;margin-bottom:14px;}
  .pending-task .tag{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--accent);text-transform:uppercase;letter-spacing:0.06em;display:block;margin-bottom:6px;}

  .tut-back{position:fixed;inset:0;background:rgba(8,10,9,0.78);z-index:150;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeSlide .22s ease both;}
  .tut-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:26px 22px 20px;max-width:420px;width:100%;max-height:88vh;overflow-y:auto;text-align:center;}
  .tut-ic{width:52px;height:52px;border-radius:13px;background:var(--accent-dim);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;}
  .tut-ic svg{width:26px;height:26px;stroke:var(--accent);}
  .tut-card h2{font-family:'Fraunces',serif;font-size:20px;font-weight:600;margin-bottom:10px;}
  .tut-card p{font-size:14px;color:var(--muted);line-height:1.6;text-align:left;margin-bottom:18px;}
  .tut-dots{display:flex;justify-content:center;gap:6px;margin-bottom:18px;}
  .tut-dots i{width:6px;height:6px;border-radius:50%;background:var(--border);transition:background .2s,width .2s;}
  .tut-dots i.on{background:var(--accent);width:18px;border-radius:3px;}
  .tut-actions{display:flex;gap:10px;justify-content:center;}
  .tut-actions .btn{flex:1;}
  .tut-skip-link{display:block;margin:12px auto 0;background:none;border:none;color:var(--muted);font-family:'Manrope',sans-serif;font-size:12.5px;cursor:pointer;text-decoration:underline;}
  .week-head{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:13px 15px;margin-bottom:14px;}
  .week-main b{display:block;font-family:'Fraunces',serif;font-size:14.5px;font-weight:600;}
  .week-main span{display:block;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);margin-top:3px;}
  .week-pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .wpill{font-family:'IBM Plex Mono',monospace;font-size:11px;background:var(--accent-dim);color:var(--accent);border-radius:6px;padding:5px 10px;}
  .wpill i{display:block;font-style:normal;font-size:9px;opacity:0.75;text-transform:uppercase;letter-spacing:0.06em;}
  .week-note{font-size:12.5px;color:var(--muted);margin-top:9px;font-style:italic;}
  .week-comp{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--danger);margin-top:8px;}
  .kv-list > div{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:8px 0;border-bottom:1px dashed var(--border);}
  .kv-list > div:last-child{border-bottom:none;}
  .kv-list span{font-size:13px;color:var(--muted);}
  .kv-list b{font-size:14px;text-align:right;}
  .task-banner{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--accent);border-radius:10px;padding:15px;cursor:pointer;font-family:'Manrope',sans-serif;color:var(--ink);}
  .task-banner.done{border-color:var(--border);}
  .task-ic{flex-shrink:0;width:34px;height:34px;border-radius:8px;background:var(--accent-dim);display:flex;align-items:center;justify-content:center;}
  .task-ic svg{width:18px;height:18px;stroke:var(--accent);}
  .task-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .task-txt b{font-family:'Fraunces',serif;font-size:15px;font-weight:600;}
  .task-txt span{font-size:12px;color:var(--muted);}
  .task-arrow{font-family:'IBM Plex Mono',monospace;color:var(--accent);font-size:16px;}
  .habit-row{border:1px solid var(--border);border-radius:8px;padding:13px 15px;margin-bottom:10px;background:var(--panel2);}
  .habit-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:9px;}
  .habit-head b{font-family:'Fraunces',serif;font-size:14.5px;font-weight:600;}
  .habit-tag{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--accent);background:var(--accent-dim);border-radius:100px;padding:2px 8px;}
  .habit-check{background:var(--panel);border:1px solid var(--border);color:var(--muted);font-family:'Manrope',sans-serif;font-weight:700;font-size:13.5px;padding:9px 18px;border-radius:7px;cursor:pointer;}
  .habit-check.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);}
  .hstat{margin-bottom:14px;}
  .hstat-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13.5px;margin-bottom:5px;}
  .hstat-top b{font-family:'IBM Plex Mono',monospace;color:var(--accent);}
  .hstat-bar{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;}
  .hstat-bar i{display:block;height:100%;background:var(--accent);border-radius:3px;}
  .hstat-sub{font-size:11px;color:var(--muted);margin-top:4px;}
  .hstat-days{display:flex;gap:5px;margin-top:14px;}
  .hstat-days span{flex:1;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:6px 0;border-radius:5px;background:var(--panel2);color:var(--muted);}
  .hstat-days span.on{background:var(--accent-dim);color:var(--accent);font-weight:600;}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .cal-head b{font-family:'Fraunces',serif;font-size:15.5px;font-weight:600;}
  .cal-day{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-radius:6px;font-size:12.5px;background:var(--panel2);color:var(--muted);overflow:hidden;}
  .cal-day .cd-num{line-height:1;}
  .cal-day .cd-tag{font-family:'IBM Plex Mono',monospace;font-size:7px;letter-spacing:0.02em;color:var(--accent);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px;}
  .cal-day.trained{background:var(--accent-dim);color:var(--ink);}
  .cal-summary{margin-top:16px;border-top:1px dashed var(--border);padding-top:14px;}
  .cal-sum-kpis{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:12px;}
  .cal-sum-kpis b{display:block;font-family:'IBM Plex Mono',monospace;font-size:19px;color:var(--accent);}
  .cal-sum-kpis span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;}
  .cal-sum-types{display:flex;gap:7px;flex-wrap:wrap;}
  .ctype{font-size:11.5px;background:var(--panel2);border:1px solid var(--border);border-radius:100px;padding:4px 11px;color:var(--ink);}
  .ctype i{font-style:normal;font-family:'IBM Plex Mono',monospace;color:var(--accent);font-weight:600;margin-right:5px;}
  .day-tools{display:flex;align-items:center;gap:7px;flex-wrap:wrap;background:var(--panel3);border:1px dashed var(--border);border-radius:8px;padding:10px 12px;margin-bottom:12px;}
  .day-tools-label{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;}
  .day-tools select{padding:6px 9px;font-size:13px;}
  .chart-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  /* ---------- PANTALLA DE ENTRADA ---------- */
  .splash{position:fixed;inset:0;z-index:400;background:#2E1016;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:0;transition:opacity .45s ease, visibility .45s;}
  .splash.hide{opacity:0;visibility:hidden;pointer-events:none;}
  .splash-mark{width:min(42vw,180px);height:auto;overflow:visible;}
  .sp-outline{stroke:#5F343C;stroke-width:2.5;fill:none;}

// ---------- ALMACENAMIENTO EN SUPABASE ----------
// Los datos compartidos (atletas, rutinas, diarios…) viven en tu base de datos,
// así que cualquier dispositivo que abra la app ve lo mismo. Lo personal de cada
// móvil (la sesión iniciada) se queda en el propio navegador.
const SUPA_URL  = 'https://ubkqtagzorfcrwjhojlt.supabase.co';
const SUPA_KEY  = 'sb_publishable_3W7Jj-pYpzm6LhuXlmDouA_hk0QLypd';
const WORKSPACE = 'mario';
const SUPA_HEAD = {
  'apikey': SUPA_KEY,
  'Authorization': 'Bearer ' + SUPA_KEY,
  'Content-Type': 'application/json'
};
const SUPA_TABLE = SUPA_URL + '/rest/v1/umbral_kv';

let storageBroken = false;
let lastStorageError = '';
let storageMode = 'probando';   // 'nube' | 'local' | 'memoria'
const memStore = new Map();

function lsKey(key, shared){ return 'umbral::' + (shared?'s':'p') + '::' + key; }
function lsAvailable(){
  try{
    if(typeof localStorage === 'undefined') return false;
    localStorage.setItem('__umbral_probe__','1');
    localStorage.removeItem('__umbral_probe__');
    return true;
  }catch(e){ return false; }
}
function cacheLocal(key, shared, value){
  try{ if(lsAvailable()) localStorage.setItem(lsKey(key,shared), value); }catch(e){}
  memStore.set(lsKey(key,shared), value);
}
function readLocal(key, shared){
  const mk = lsKey(key, shared);
  try{ if(lsAvailable()){ const v = localStorage.getItem(mk); if(v !== null) return v; } }catch(e){}
  return memStore.has(mk) ? memStore.get(mk) : null;
}

async function supaGet(key){
  const url = SUPA_TABLE + '?select=value&workspace=eq.' + encodeURIComponent(WORKSPACE)
            + '&key=eq.' + encodeURIComponent(key);
  const r = await fetch(url, { headers: SUPA_HEAD });
  if(!r.ok) throw new Error('HTTP ' + r.status);
  const rows = await r.json();
  return (Array.isArray(rows) && rows.length) ? rows[0].value : null;
}
async function supaSet(key, value){
  const url = SUPA_TABLE + '?on_conflict=workspace,key';
  const r = await fetch(url, {
    method: 'POST',
    headers: { ...SUPA_HEAD, 'Prefer': 'resolution=merge-duplicates,return=minimal' },
    body: JSON.stringify({ workspace: WORKSPACE, key, value, updated_at: new Date().toISOString() })
  });
  if(!r.ok){
    let detalle = 'HTTP ' + r.status;
    try{ const j = await r.json(); if(j && j.message) detalle = j.message; }catch(e){}
    throw new Error(detalle);
  }
  return true;
}
async function supaList(){
  const url = SUPA_TABLE + '?select=key&workspace=eq.' + encodeURIComponent(WORKSPACE);
  const r = await fetch(url, { headers: SUPA_HEAD });
  if(!r.ok) throw new Error('HTTP ' + r.status);
  const rows = await r.json();
  return Array.isArray(rows) ? rows.map(x=>x.key) : [];
}

async function safeGet(key, shared){
  // Lo no compartido es de este dispositivo: nunca sale a la nube.
  if(!shared) return readLocal(key, false);
  try{
    const v = await supaGet(key);
    storageMode = 'nube'; storageBroken = false;
    if(v !== null && v !== undefined){ cacheLocal(key, true, v); return v; }
    return null;
  }catch(e){
    // Sin conexión o error: tiramos de la última copia guardada en el móvil.
    lastStorageError = (e && e.message) ? e.message : String(e);
    if(storageMode === 'nube') storageMode = 'local';
    return readLocal(key, true);
  }
}

async function safeSet(key, value, shared){
  if(!shared){ cacheLocal(key, false, value); return true; }
  cacheLocal(key, true, value);   // guardamos siempre en local primero
  try{
    await supaSet(key, value);
    storageMode = 'nube'; storageBroken = false;
    return true;
  }catch(e){
    lastStorageError = (e && e.message) ? e.message : String(e);
    storageBroken = true;
    storageMode = lsAvailable() ? 'local' : 'memoria';
    return true; // no se ha perdido: está en el móvil
  }
}

async function storageSelfTest(){
  const key = '__umbral_test__';
  const val = 'ok-' + Date.now();
  try{
    await supaSet(key, val);
    const back = await supaGet(key);
    if(back === val){
      storageMode = 'nube'; storageBroken = false;
      return { ok:true, mode:'nube', detail:'sincronizado entre dispositivos' };
    }
    lastStorageError = 'la escritura no se pudo releer';
  }catch(e){ lastStorageError = (e && e.message) ? e.message : String(e); }
  storageBroken = true;
  storageMode = lsAvailable() ? 'local' : 'memoria';
  return { ok:false, mode:storageMode, detail:lastStorageError };
}

// ---------- SONIDO Y VIBRACIÓN ----------
// Sin avisos audibles un temporizador de intervalos es inservible: obliga a
// mirar la pantalla justo cuando no puedes.
let audioCtx = null;
function ensureAudio(){
  try{
    if(!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      audioCtx = new AC();
    }
    if(audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }catch(e){ return null; }
}
function beep(freq, ms, vol){
  const ctx = ensureAudio();
  if(!ctx) return;
  try{
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = 'sine'; osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol || 0.25, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + ms/1000);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + ms/1000);
  }catch(e){}
}
function buzz(pattern){ try{ if(navigator.vibrate) navigator.vibrate(pattern); }catch(e){} }
const CUE = {
  tick:   ()=>{ beep(660, 90, 0.18); },                                  // 3-2-1
  work:   ()=>{ beep(980,180,0.3); buzz(120); },                         // empieza trabajo
  rest:   ()=>{ beep(520,220,0.26); buzz([70,60,70]); },                 // empieza descanso
  setEnd: ()=>{ beep(760,160,0.3); setTimeout(()=>beep(1040,240,0.3),170); buzz([90,70,90]); },
  done:   ()=>{ [0,190,380].forEach((d,i)=>setTimeout(()=>beep(720+i*230,300,0.3), d)); buzz([120,90,120,90,200]); }
};
// Cuenta atrás de los últimos 3 segundos de cualquier fase
function cueCountdown(rem){ if(rem===3||rem===2||rem===1) CUE.tick(); }

let wakeLock = null;
async function keepAwake(on){
  try{
    if(on){
      if('wakeLock' in navigator && !wakeLock){
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', ()=>{ wakeLock = null; });
      }
    } else if(wakeLock){ await wakeLock.release(); wakeLock = null; }
  }catch(e){ /* no soportado: no es crítico */ }
}

// ---------- SESIÓN EN CURSO, A PRUEBA DE CIERRES ----------
// La sesión vivía sólo en memoria: cerrar la app a mitad de entreno perdía
// todo el registro. Ahora se guarda continuamente y se puede retomar.
let sessionSaveTimer = null;
function sessionKey(athleteId){ return 'session-activa-'+athleteId; }
async function persistSession(){
  const id = state.athleteAsId || state.selectedId;
  if(!id || !session) return;
  const snapshot = {
    day: session.day, startedAt: session.startedAt || Date.now(),
    elapsedSec: session.elapsedSec, exercises: session.exercises,
    showSurvey: session.showSurvey, avgExerciseRPE: session.avgExerciseRPE,
    fatigueScore: session.fatigueScore, savedAt: Date.now()
  };
  await safeSet(sessionKey(id), JSON.stringify(snapshot), true);
}
function queueSessionSave(){
  clearTimeout(sessionSaveTimer);
  sessionSaveTimer = setTimeout(persistSession, 800);
}
async function clearPersistedSession(){
  const id = state.athleteAsId || state.selectedId;
  if(id) await safeSet(sessionKey(id), '', true);
}
async function findPausedSession(athleteId){
  const raw = await safeGet(sessionKey(athleteId), true);
  if(!raw) return null;
  try{
    const s = JSON.parse(raw);
    if(!s || !s.exercises) return null;
    // Descartamos restos de más de 12 horas
    if(Date.now() - (s.savedAt||0) > 12*3600*1000) return null;
    return s;
  }catch(e){ return null; }
}

// Terminar una sesión sin dejar cronómetros vivos: si el intervalo seguía
// corriendo tras poner session=null, reventaba al leer session.elapsedSec.
function stopSession(){
  clearInterval(stopwatchInterval); stopwatchInterval = null;
  clearInterval(engineInterval); engineInterval = null;
  clearTimeout(sessionSaveTimer);
  session = null;
  keepAwake(false);
  const ov = document.getElementById('sessionOverlay'); if(ov) ov.remove();
  const tb = document.getElementById('timerModalBack'); if(tb) tb.remove();
  timerModal = null;
}

function saturdayOfWeek(){ const d=new Date(); const day=d.getDay()||7; d.setDate(d.getDate()-day+6); return d.toISOString().slice(0,10); }
function fmtTime(sec){ const m=Math.floor(sec/60), s=Math.abs(sec%60); return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`; }

async function bindGateEvents(){
  document.querySelectorAll('[data-gate]').forEach(b=>b.addEventListener('click', ()=>{
    state.gateMode = b.dataset.gate; render();
  }));
  const backBtn = document.getElementById('gateBackBtn');
  if(backBtn) backBtn.addEventListener('click', ()=>{ state.gateMode = null; render(); });

  const coachEnter = document.getElementById('coachEnterBtn');
  const coachInput = document.getElementById('coachCodeInput');
  const tryCoach = async ()=>{
    const code = (coachInput.value||'').trim();
    if(!code){ toast('Introduce el código', true); return; }
    const real = await getCoachCode();
    if(code.toUpperCase() !== real.toUpperCase()){ toast('Código incorrecto', true); return; }
    state.authRole = 'coach'; state.role = 'coach'; state.tab = 'atletas'; state.gateMode = null;
    await safeSet('umbral-session', JSON.stringify({role:'coach'}), false);
    render();
  };
  if(coachEnter) coachEnter.addEventListener('click', tryCoach);
  if(coachInput) coachInput.addEventListener('keydown', e=>{ if(e.key==='Enter') tryCoach(); });

  const loginBtn = document.getElementById('loginBtn');
  const pinInput = document.getElementById('pinInput');
  const tryAthlete = async ()=>{
    try{
      const pin = (pinInput.value||'').trim();
      if(!pin){ toast('Introduce el PIN', true); return; }
      // Buscamos a quién corresponde el PIN: así ningún atleta ve la lista
      // de nombres de los demás.
      const a = state.athletes.find(x=>String(x.pin) === pin);
      if(a){
        state.authRole = 'atleta'; state.role = 'atleta'; state.athleteAsId = a.id; state.gateMode = null;
        await safeSet('umbral-session', JSON.stringify({role:'atleta', athleteAsId:a.id}), false);
        const intakeRaw = await safeGet('intake-'+a.id, true);
        state.tab = intakeRaw ? 'rutina' : 'intake';
        render();
      } else toast('PIN incorrecto', true);
    }catch(e){ toast('Error al entrar: '+e.message, true); }
  };
  if(loginBtn) loginBtn.addEventListener('click', tryAthlete);
  if(pinInput) pinInput.addEventListener('keydown', e=>{ if(e.key==='Enter') tryAthlete(); });
}

function toast(msg, isError){
  let t = document.getElementById('umbralToast');
  if(!t){ t=document.createElement('div'); t.id='umbralToast'; t.style.cssText='position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:200;padding:10px 18px;border-radius:8px;font-family:Manrope,sans-serif;font-weight:700;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,0.25);'; document.body.appendChild(t); }
  t.style.background = isError ? '#A83A2E' : 'var(--accent)';
  t.style.color = isError ? '#FAF6EE' : 'var(--on-accent)';
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>{ t.style.transition='opacity .4s'; t.style.opacity='0'; }, 1800);
}

function renderNav(){
  const nav = document.getElementById('bottomNav');
  if(state.role==='atleta'){
    if(!state.athleteAsId){ nav.innerHTML=''; return; }
    const items = [
      {key:'rutina', ic:icClipboard(), label:'Rutina'},
      {key:'diario', ic:icDumbbell(), label:'Sesión'},
      {key:'calendario', ic:icCalendar(), label:'Calendario'},
      {key:'progreso', ic:icChartUp(), label:'Progreso'},
      {key:'perfil', ic:icPerson(), label:'Perfil'}
    ];
    nav.innerHTML = items.map(it=>`<button data-navtab="${it.key}" class="${state.tab===it.key?'active':''}">${it.ic}${it.label}</button>`).join('');
  } else {
    const items = [
      {key:'atletas', ic:icPeople(), label:'Atletas'},

      {key:'tareas', ic:icTasks(), label:'Tareas'},

async function bindShellEvents(){
  const backupSlot = document.getElementById('backupSlot');
  if(backupSlot){
    backupSlot.innerHTML = await tplBackup();
    paintStorageHealth();
    const saveCode = document.getElementById('saveCoachCodeBtn');
    if(saveCode) saveCode.addEventListener('click', async ()=>{
      const v = (document.getElementById('newCoachCode').value||'').trim();
      if(v.length < 4){ toast('Usa al menos 4 caracteres', true); return; }
      const ok = await safeSet('coach-code', v, true);
      toast(ok ? 'Código actualizado — apúntalo' : 'No se pudo guardar', !ok);
      if(ok) document.getElementById('newCoachCode').value = '';
    });
    const testBtn = document.getElementById('testStorageBtn');
    if(testBtn) testBtn.addEventListener('click', async ()=>{
      const r = await storageSelfTest();
      toast(r.ok ? 'Almacenamiento OK: ' + r.detail : 'Fallo: ' + r.detail, !r.ok);
      paintStorageHealth();
    });
    const box = document.getElementById('backupBox');
    const exportBtn = document.getElementById('exportBtn');
    if(exportBtn) exportBtn.addEventListener('click', async ()=>{
      exportBtn.textContent = 'Exportando…'; exportBtn.disabled = true;
      try{
        box.value = await exportAll();
        toast('Copia generada — cópiala y guárdala');
      }catch(e){ toast('No se pudo exportar: '+e.message, true); }
      exportBtn.textContent = 'Exportar datos'; exportBtn.disabled = false;
    });
    const copyBtn = document.getElementById('copyBackupBtn');
    if(copyBtn) copyBtn.addEventListener('click', async ()=>{
      if(!box.value.trim()){ toast('Genera la copia primero', true); return; }
      try{
        if(navigator.clipboard && navigator.clipboard.writeText) await navigator.clipboard.writeText(box.value);
        else { box.select(); document.execCommand('copy'); }
        toast('Copiado al portapapeles');
      }catch(e){ box.select(); toast('Selecciona y copia manualmente', true); }
    });
    const importBtn = document.getElementById('importBtn');
    if(importBtn) importBtn.addEventListener('click', async ()=>{
      if(!box.value.trim()){ toast('Pega primero una copia', true); return; }
      importBtn.textContent = 'Restaurando…'; importBtn.disabled = true;
      try{
        const n = await importAll(box.value);
        await loadAthletes();
        state.selectedId = state.athletes.length ? state.athletes[0].id : null;
        toast(`Restaurado: ${n} registros, ${state.athletes.length} atletas`);
        render();
      }catch(e){ toast('No se pudo restaurar: '+e.message, true); }
      importBtn.textContent = 'Restaurar desde la copia pegada'; importBtn.disabled = false;
    });
  }
  const addBtn = document.getElementById('addAthleteBtn');
  if(addBtn) addBtn.addEventListener('click', async ()=>{
    const nameInput = document.getElementById('newAthleteName');
    const name = nameInput.value.trim(); if(!name) return;
    // Con acceso sólo por PIN, dos PINs iguales dejarían a un atleta entrar en
    // el perfil de otro. Generamos uno que no exista ya.
    const usados = new Set(state.athletes.map(a=>String(a.pin)));
    let pin = null;
    for(let i=0;i<9000;i++){
      const c = String(Math.floor(1000+Math.random()*9000));
      if(!usados.has(c)){ pin = c; break; }
    }
    if(!pin){ toast('No quedan PINs libres de 4 dígitos', true); return; }
    const newAthlete = { id: uid(), name, pin };
    state.athletes.push(newAthlete);
    const ok = await safeSet('athletes-list', JSON.stringify(state.athletes), true);
    toast(ok ? `${name} añadido · PIN ${pin}` : 'No se pudo guardar', !ok);
    render();
  });
  const previewBtn = document.getElementById('previewAsAthleteBtn');
  if(previewBtn) previewBtn.addEventListener('click', ()=>{
    const id = document.getElementById('previewAthleteSel').value;
    state.previewing = true;             // seguimos siendo entrenador por debajo
    state.role = 'atleta'; state.athleteAsId = id; state.tab = 'rutina';
    stopSession();
    renderScrollTop();
  });

  document.querySelectorAll('[data-openathlete]').forEach(b=>b.addEventListener('click', ()=>{
    state.selectedId = b.dataset.openathlete; state._inAthleteDetail = true; state.athleteSubTab='planificacion'; renderScrollTop();
  }));
  await renderTabContent();
}

async function renderTabContent(){
  const el = document.getElementById('tabContent'); if(!el) return;
  const mode = el.dataset.mode;
  el.innerHTML = '<div class="empty">Cargando…</div>';
  if(mode==='resumen') el.innerHTML = await tplResumen();
  else if(mode==='calendario-coach') el.innerHTML = await tplCalendarioCoach();
  else if(mode==='tareas') el.innerHTML = await tplTareas();
  else if(mode==='athlete-detail') el.innerHTML = await tplAthleteDetail(el.dataset.athlete);
  else if(mode==='intake') el.innerHTML = await tplIntake(el.dataset.athlete);
  else {
    const athleteId = el.dataset.athlete;
    if(state.tab==='rutina') el.innerHTML = await tplRutinaAtleta(athleteId);
    else if(state.tab==='diario') el.innerHTML = await tplSesionEntry(athleteId);
    else if(state.tab==='calendario') el.innerHTML = await tplCalendarioAtleta(athleteId);
    else if(state.tab==='progreso') el.innerHTML = await tplProgreso(athleteId);
    else if(state.tab==='perfil') el.innerHTML = await tplPerfilAtleta(athleteId);
  }
  bindDynamicEvents();
  renderNav();
  if(session && session.fullscreen) mountSessionOverlay(state.athleteAsId || state.selectedId);
}

// ---------- ROUTINE HELPERS ----------
async function getRoutine(athleteId, draft){
  const key = draft ? 'routine-draft-'+athleteId : 'routine-'+athleteId;
  const raw = await safeGet(key, true);
  const r = raw ? JSON.parse(raw) : {};
  if(!r.days) r.days = {};
  DAYS.forEach(d=>{ if(!r.days[d]) r.days[d]={}; BLOCKS.forEach(b=>{ if(!r.days[d][b.key]) r.days[d][b.key]=[]; }); });
  return r;
}
function blankExercise(){ return {id:uid(), name:'', desc:'', section:'', load:'', series:3, reps:'', rest:'', rir:'', rpeTarget:'', timer:{type:'none', work:30, rest:15, rounds:8, sets:1, setRest:60, emomLen:60, emomRounds:10, amrapMin:12, seriesRestSec:180, seriesCount:5}}; }
function exTimer(ex){
  const t = (ex && ex.timer) ? ex.timer : {};
  return { type:t.type||'none', work:+t.work||30, rest:+t.rest||15, rounds:+t.rounds||8,

const TIMER_TYPE_LABELS = { none:'Sin temporizador', intervalos:'Intervalos / Tabata', emom:'EMOM', amrap:'AMRAP', series:'Descanso por series' };

// ---------- PERIODIZACIÓN ----------
// Intensidad 1-4 por microciclo (semana). El nombre de cada nivel sigue la
// terminología habitual de planificación para que el gráfico se lea solo.
const INTENSITY_LABELS = { 1:'Descarga', 2:'Acumulación', 3:'Intensificación', 4:'Pico' };
const VOLUME_LABELS = { 1:'Bajo', 2:'Medio', 3:'Alto', 4:'Muy alto' };
const MICRO_TYPES = ['Acumulación','Intensificación','Realización','Descarga','Competición','Transición'];

async function getPlan(athleteId){
  const raw = await safeGet('plan-'+athleteId, true);
  const p = raw ? JSON.parse(raw) : null;
  if(p && Array.isArray(p.macros)) return p;
  return { macros: [] };
}
async function savePlan(athleteId, plan){
  return safeSet('plan-'+athleteId, JSON.stringify(plan), true);
}
function blankMacro(){
  return { id:uid(), name:'Nuevo macrociclo', startDate: todayISO(), competitions:[],
    micros: Array.from({length:8}, (_,i)=>({ id:uid(), intensity:2, volume:3, type:'Acumulación', note:'' })) };
}
function microDate(macro, index){
  const d = new Date(macro.startDate + 'T00:00:00');
  if(isNaN(d)) return null;
  d.setDate(d.getDate() + index*7);
  return d;
}
function fmtShortDate(d){
  if(!d) return '';
  return String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0');
}

// Localiza en qué microciclo del plan cae una fecha dada.
async function currentMicro(athleteId, refDate){
  const plan = await getPlan(athleteId);
  const ref = refDate ? new Date(refDate+'T00:00:00') : new Date();
  let upcoming = null;
  for(const macro of plan.macros){
    if(!macro.startDate) continue;
    const start = new Date(macro.startDate+'T00:00:00');
    const diffWeeks = Math.floor((ref - start)/(7*86400000));
    if(diffWeeks >= 0 && diffWeeks < macro.micros.length){
      const m = macro.micros[diffWeeks];
      const wStart = new Date(start); wStart.setDate(wStart.getDate()+diffWeeks*7);
      const wEnd = new Date(wStart); wEnd.setDate(wEnd.getDate()+6);
      let comp = null, dias = null;
      (macro.competitions||[]).forEach(c=>{
        if(!c.date) return;
        const d = Math.ceil((new Date(c.date+'T00:00:00') - ref)/86400000);
        if(d >= 0 && (dias===null || d < dias)){ dias = d; comp = c; }
      });
      return { macro, micro:m, index:diffWeeks, total:macro.micros.length, wStart, wEnd, comp, dias };
    }
    if(start > ref){
      const d = Math.ceil((start - ref)/86400000);
      if(!upcoming || d < upcoming.dias) upcoming = { macro, start, dias:d };
    }
  }
  return upcoming ? { upcoming } : null;
}
function weekHeaderHtml(info){
  const d = new Date(); const day = d.getDay()||7;
  const mon = new Date(d); mon.setDate(d.getDate()-day+1);
  const sun = new Date(mon); sun.setDate(mon.getDate()+6);
  if(!info || info.upcoming){
    const extra = (info && info.upcoming)
      ? `<span style="color:var(--accent);">Empieza ${escapeHtml(info.upcoming.macro.name)} en ${info.upcoming.dias} día${info.upcoming.dias===1?'':'s'} (${info.upcoming.macro.startDate})</span>`
      : `<span>Sin macrociclo abierto</span>`;
    return `<div class="week-head"><div class="week-main"><b>Semana del ${fmtShortDate(mon)} al ${fmtShortDate(sun)}</b>${extra}</div></div>`;
  }
  const { macro, micro, index, total, wStart, wEnd, comp, dias } = info;
  return `<div class="week-head">
    <div class="week-main">
      <b>Semana ${index+1} de ${total} · ${escapeHtml(macro.name)}</b>
      <span>${fmtShortDate(wStart)} – ${fmtShortDate(wEnd)}${micro.type?' · '+escapeHtml(micro.type):''}</span>
    </div>
    <div class="week-pills">
      <span class="wpill"><i>Intensidad</i>${micro.intensity} · ${INTENSITY_LABELS[micro.intensity]||''}</span>
      <span class="wpill"><i>Volumen</i>${micro.volume} · ${VOLUME_LABELS[micro.volume]||''}</span>
    </div>
    ${micro.note?`<div class="week-note">${escapeHtml(micro.note)}</div>`:''}
    ${comp?`<div class="week-comp">${escapeHtml(comp.name||'Competición')} · faltan ${dias} día${dias===1?'':'s'}</div>`:''}
  </div>`;
}

async function tplRutinaAtleta(athleteId){
  await autoArchiveWeek(athleteId);
  const routine = await getRoutine(athleteId, false);
  const info = await currentMicro(athleteId);
  let html = `<div class="card"><h2>Rutina semanal</h2>${weekHeaderHtml(info)}`;
  DAYS.forEach(d=>{
    const open = state.openDays[d] ? 'open':'';
    const totalEx = BLOCKS.reduce((a,b)=>a+routine.days[d][b.key].length,0);
    html += `<div class="acc ${open}" data-day="${d}"><div class="acc-head" data-toggle="${d}"><b>${d}</b><span class="chev"><span class="chev-arrow">▾</span></span><span class="chev-count">${totalEx} ejerc.</span></div><div class="acc-body">`;
    BLOCKS.forEach(b=>{
      html += `<div class="block-title">${b.label}</div>`;
      if(!routine.days[d][b.key].length) html += `<div class="empty">Sin ejercicios en este bloque.</div>`;
      let lastSection = null;
      routine.days[d][b.key].forEach(ex=>{
        if((ex.section||'') !== lastSection){
          lastSection = ex.section||'';
          if(lastSection) html += `<div class="section-tag">${escapeHtml(lastSection)}</div>`;
        }
        const t = exTimer(ex);
        html += `<div class="ex-view-card"><h4>${escapeHtml(ex.name)}</h4>${ex.desc?`<p class="desc">${escapeHtml(ex.desc)}</p>`:''}
          <div class="ex-meta"><span>Series x reps: <b>${ex.series||'—'} x ${escapeHtml(ex.reps||'—')}</b></span>${ex.load?`<span>Carga: <b>${escapeHtml(ex.load)}</b></span>`:''}<span>Descanso: <b>${escapeHtml(ex.rest||'—')}</b></span><span>RIR: <b>${escapeHtml(ex.rir||'—')}</b></span><span>RPE objetivo: <b>${escapeHtml(ex.rpeTarget||'—')}</b></span></div>
          ${t.type!=='none'?`<div class="timer-badge">${TIMER_TYPE_LABELS[t.type]}</div>`:''}
        </div>`;
      });
    });
    html += `</div></div>`;
  });
  html += `</div>`;
  return html;
}

// ---------- SESIÓN (athlete) ----------
async function tplSesionEntry(athleteId){
  const routine = await getRoutine(athleteId, false);
  const histRaw = await safeGet('routine-history-'+athleteId, true);
  const hist = histRaw ? JSON.parse(histRaw) : [];
  const info = await currentMicro(athleteId);
  const todayDay = DAY_INDEX[new Date().getDay()];
  const selWeek = state.sessionWeek || 'actual';
  const selDay = state.sessionDay || todayDay;

  const source = selWeek === 'actual'
    ? routine
    : (()=>{ const h = hist.find(w=>String(w.weekNumber)===String(selWeek)); return h ? {days:h.days} : routine; })();

  const paused = await findPausedSession(athleteId);
  let html = '';
  if(paused){
    const hechos = paused.exercises.filter(e=>e.done).length;
    const hace = Math.round((Date.now()-(paused.savedAt||Date.now()))/60000);
    html += `<div class="card" style="border-color:var(--accent);">
      <h2>Tienes una sesión sin terminar</h2>
      <p style="font-size:13px;color:var(--muted);margin-bottom:12px;">${paused.day.charAt(0).toUpperCase()+paused.day.slice(1)} · ${fmtTime(paused.elapsedSec)} registrados · ${hechos} de ${paused.exercises.length} ejercicios hechos${hace>0?` · guardada hace ${hace} min`:''}</p>
      <div class="row"><button class="btn" id="resumeSessionBtn">Retomar</button>
      <button class="btn ghost" id="discardSessionBtn">Descartar</button></div>
    </div>`;
  }
  html += `<div class="card"><h2>Sesión</h2>${weekHeaderHtml(info)}
    <div class="ex-grid" style="margin-top:12px;">
      <div><label class="field-label">Semana</label>
        <select id="sessionWeek">
          <option value="actual" ${selWeek==='actual'?'selected':''}>Semana actual</option>
          ${hist.slice().reverse().map(w=>`<option value="${w.weekNumber}" ${String(selWeek)===String(w.weekNumber)?'selected':''}>Semana ${w.weekNumber} · ${w.weekOf}</option>`).join('')}
        </select></div>
      <div><label class="field-label">Día</label>
        <select id="sessionDay">
          ${DAYS.map(d=>`<option value="${d}" ${d===selDay?'selected':''}>${d.charAt(0).toUpperCase()+d.slice(1)}${d===todayDay?' (hoy)':''}</option>`).join('')}
        </select></div>
    </div>
    <div id="sessionPreview" style="margin-top:14px;">${sessionPreviewHtml(source, selDay)}</div>
    <div class="row" style="margin-top:14px;"><button class="btn" id="startSession">Iniciar sesión — pantalla completa</button>
    <button class="btn ghost" id="manualSessionBtn">Registrar una ya hecha</button></div>
  </div>`;
  if(state.manualSession) html += await tplRegistroManual(athleteId, source, selDay);
  return html;
}

// Registro de una sesión ya entrenada: sin cronómetro, rellenando a mano.
async function tplRegistroManual(athleteId, source, selDay){
  const lista = flattenExercises(source, selDay);
  const m = state.manual || {};
  let html = `<div class="card" id="manualCard" style="border-color:var(--accent);">
    <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:6px;">

      <button class="btn ghost small" id="cancelManualBtn">Cancelar</button>
    </div>
    <p style="font-size:12.5px;color:var(--muted);margin-bottom:14px;">Se toman los ejercicios del día seleccionado arriba. Rellena lo que recuerdes: lo que dejes vacío no se guarda.</p>
    <div class="ex-grid">
      <div><label class="field-label">Fecha</label><input type="date" id="mnDate" value="${m.date||todayISO()}" max="${todayISO()}"></div>
      <div><label class="field-label">Duración (min)</label><input type="number" id="mnMin" min="1" max="600" value="${m.min||60}"></div>
    </div>`;

  if(!lista.length){
    html += `<div class="empty">Ese día no tiene ejercicios planificados. Elige otro arriba o registra sólo la valoración general.</div>`;
  } else {
    html += `<div class="block-title">Ejercicios</div>`;
    let ultimoBloque = '';
    lista.forEach((ex,i)=>{
      if(ex.blockLabel !== ultimoBloque){ html += `<div class="block-title">${ex.blockLabel}</div>`; ultimoBloque = ex.blockLabel; }

function bindSessionOverlayEvents(){
  const exitBtn = document.getElementById('exitFullscreen');
  if(exitBtn) exitBtn.addEventListener('click', ()=>{ session.fullscreen=false; persistSession(); const ov=document.getElementById('sessionOverlay'); if(ov) ov.remove(); });
  document.querySelectorAll('[data-strike]').forEach(h=>h.addEventListener('click', ()=>{ const i=parseInt(h.dataset.strike,10); session.exercises[i].done=!session.exercises[i].done; queueSessionSave(); renderSessionOverlay(); }));
  document.querySelectorAll('.set-chip').forEach(c=>c.addEventListener('click', ()=>{
    const i=parseInt(c.dataset.exi,10), si=parseInt(c.dataset.si,10);
    session.exercises[i].setsDone[si]=!session.exercises[i].setsDone[si];
    if(session.exercises[i].setsDone.every(Boolean)) session.exercises[i].done=true;
    buzz(35); queueSessionSave();
    renderSessionOverlay();
  }));
  document.querySelectorAll('.rpe-applied-input').forEach(inp=>inp.addEventListener('change', ()=>{ const i=parseInt(inp.dataset.exi,10); const v=parseInt(inp.value,10); session.exercises[i].rpeApplied=(v>=1&&v<=10)?v:null; queueSessionSave(); }));
  document.querySelectorAll('.load-applied-input').forEach(inp=>inp.addEventListener('change', ()=>{ const i=parseInt(inp.dataset.exi,10); session.exercises[i].loadApplied=inp.value.trim(); queueSessionSave(); }));
  const openTimerModal = document.getElementById('openTimerModal');
  if(openTimerModal) openTimerModal.addEventListener('click', ()=>openTimer());
  document.querySelectorAll('[data-extimer]').forEach(b=>b.addEventListener('click', ()=>{
    const i = parseInt(b.dataset.extimer,10);
    openTimer(exTimer(session.exercises[i]));
  }));
  const cancelSessionBtn = document.getElementById('cancelSessionBtn');
  if(cancelSessionBtn) cancelSessionBtn.addEventListener('click', async ()=>{
    const algoHecho = session.exercises.some(e=>e.done || (e.setsDone||[]).some(Boolean) || e.rpeApplied);
    if(algoHecho && !confirm('Vas a descartar esta sesión y todo lo que has marcado. ¿Seguro?')) return;
    await clearPersistedSession();
    stopSession();
    state.tab='diario'; render();
  });
  const completeSessionBtn = document.getElementById('completeSessionBtn');
  if(completeSessionBtn) completeSessionBtn.addEventListener('click', ()=>{
    clearInterval(stopwatchInterval); clearInterval(engineInterval);
    const rpes = session.exercises.map(e=>e.rpeApplied).filter(r=>r!==null && r!==undefined);
    session.avgExerciseRPE = rpes.length ? +(rpes.reduce((a,b)=>a+b,0)/rpes.length).toFixed(1) : 0;
    session.fatigueScore = +(session.avgExerciseRPE * (session.elapsedSec/60)).toFixed(1);
    session.showSurvey = true;
    renderSessionOverlay();
  });
  bindSurveyEvents();
}

function bindSurveyEvents(){
  document.querySelectorAll('#surveyCard .scale').forEach(scale=>{
    scale.querySelectorAll('button').forEach(btn=>btn.addEventListener('click', ()=>{ scale.querySelectorAll('button').forEach(b=>b.classList.remove('sel')); btn.classList.add('sel'); }));
  });
  const saveSurvey = document.getElementById('saveSurvey');
  if(saveSurvey) saveSurvey.addEventListener('click', async ()=>{
    const athleteId = state.athleteAsId || state.selectedId;
    const getVal = (key)=>{ const sc=document.querySelector(`#surveyCard [data-survey="${key}"]`); const sel=sc&&sc.querySelector('button.sel'); return sel?parseInt(sel.dataset.val,10):null; };
    const overallRPE=getVal('overallRPE'), fatiga=getVal('fatiga'), calidad=getVal('calidad'), hidratacion=getVal('hidratacion'), satisfaccion=getVal('satisfaccion');
    if([overallRPE,fatiga,calidad,hidratacion,satisfaccion].some(v=>v===null)){ alert('Completa todas las escalas antes de guardar.'); return; }
    const notes = document.getElementById('surveyNotes').value.trim();
    // Sin RPE por ejercicio la carga salía 0 pese a haber entrenado. El RPE
    // general sí es obligatorio, así que sirve de base cuando falta el otro.
    const rpeBase = (session.avgExerciseRPE && session.avgExerciseRPE > 0) ? session.avgExerciseRPE : overallRPE;
    const cargaFinal = +(rpeBase * (session.elapsedSec/60)).toFixed(1);
    const record = { date: todayISO(), day: session.day, durationSeconds: session.elapsedSec,
      exercises: session.exercises.map(e=>({name:e.name, section:e.section||'', rpeApplied:e.rpeApplied, loadPlanned:e.load||'', loadApplied:e.loadApplied||'', done:e.done})),
      avgExerciseRPE: session.avgExerciseRPE, fatigueScore: cargaFinal,
      cargaDesdeRPEGeneral: !(session.avgExerciseRPE > 0),
      overallRPE, fatiga, calidad, hidratacion, satisfaccion, notes };
    const raw = await safeGet('journal-'+athleteId, true);
    const entries = raw ? JSON.parse(raw) : [];
    entries.push(record);
    await safeSet('journal-'+athleteId, JSON.stringify(entries), true);
    await safeSet(sessionKey(athleteId), '', true);
    toast('Sesión guardada en el diario');
    // Antes de salir, la orientación de recuperación de esta sesión.
    clearInterval(stopwatchInterval); stopwatchInterval = null;
    clearInterval(engineInterval); engineInterval = null;
    releaseScreen();
    const ov = document.getElementById('sessionOverlay');
    if(ov){
      ov.innerHTML = `<div class="session-topbar"><h2>Sesión guardada</h2></div>`
        + tplRecuperacion(cargaFinal, overallRPE, Math.round(session.elapsedSec/60))
        + `<div class="row" style="margin-top:16px;"><button class="btn" id="closeRecovery">Ver mi progreso</button></div>`;
      const cerrar = document.getElementById('closeRecovery');
      if(cerrar) cerrar.addEventListener('click', ()=>{
        stopSession();
        state.tab='progreso'; render();
      });
    } else {
      stopSession();
      state.tab='progreso'; render();
    }
  });
}

function bindTimerModalEvents(){
  document.getElementById('closeTimerBtn').addEventListener('click', closeTimer);
  const backBtn = document.getElementById('backTimerBtn');
  if(backBtn) backBtn.addEventListener('click', ()=>{ clearInterval(engineInterval); timerModal.running=false; timerModal.running2=false; timerModal.mode=null; renderTimerModal(); });
  if(timerModal.mode==='intervalos'){
    document.querySelectorAll('[data-preset]').forEach(b=>b.addEventListener('click', ()=>{
      const [w,r]=b.dataset.preset.split('|').map(Number);
      timerModal.work=w; timerModal.rest=r; timerModal.phase='work'; timerModal.remaining=w; timerModal.round=1; timerModal.setNum=1; timerModal.running=false;
      clearInterval(engineInterval); renderTimerModal();
    }));
    document.getElementById('ivStartBtn').addEventListener('click', ()=>{
      const T = timerModal;
      T.work=Math.max(1, parseInt(document.getElementById('ivWork').value,10)||30);
      T.rest=Math.max(0, parseInt(document.getElementById('ivRest').value,10)||15);
      T.rounds=Math.max(1, parseInt(document.getElementById('ivRounds').value,10)||8);
      T.sets=Math.max(1, parseInt(document.getElementById('ivSets').value,10)||1);
      T.setRest=Math.max(0, parseInt(document.getElementById('ivSetRest').value,10)||60);
      if(!T.running){
        T.running=true;
        if(T.phase==='idle'){ T.phase='work'; T.remaining=T.work; T.round=1; T.setNum=1; }
        ensureAudio(); CUE.work();
        clearInterval(engineInterval);
        engineInterval=setInterval(()=>{
          T.remaining--;
          cueCountdown(T.remaining);
          if(T.remaining<=0){
            if(T.phase==='work'){
              // ¿queda algún ciclo más en este set?
              if(T.round < T.rounds){ T.phase='rest'; T.remaining=T.rest; CUE.rest(); }
              else if(T.setNum < T.sets){ T.phase='setrest'; T.remaining=T.setRest; CUE.setEnd(); }
              else { clearInterval(engineInterval); T.running=false; T.phase='idle'; T.remaining=0; CUE.done(); }
            } else if(T.phase==='rest'){
              T.round++; T.phase='work'; T.remaining=T.work; CUE.work();
            } else { // setrest
              T.setNum++; T.round=1; T.phase='work'; T.remaining=T.work; CUE.work();
            }
          }
          const disp=document.getElementById('ivDisplay');
          if(disp){
            const lbl = !T.running ? 'COMPLETADO' : (T.phase==='work'?'TRABAJO':(T.phase==='setrest'?'DESCANSO ENTRE SETS':'DESCANSO'));
            disp.className='interval-display '+(T.running ? (T.phase==='work'?'work':'rest') : 'idle');
            disp.innerHTML=`<span class="phase">${lbl}</span>${fmtTime(Math.max(0,T.remaining))}<span class="round">Set ${T.setNum} de ${T.sets} · ciclo ${T.round} de ${T.rounds}</span>`;
          }
        },1000);
      } else { T.running=false; clearInterval(engineInterval); }
      renderTimerModal();
    });
    document.getElementById('ivResetBtn').addEventListener('click', ()=>{
      clearInterval(engineInterval);
      timerModal.phase='idle'; timerModal.round=1; timerModal.setNum=1; timerModal.running=false;
      timerModal.remaining=parseInt(document.getElementById('ivWork').value,10)||30;
      renderTimerModal();
    });
  } else if(timerModal.mode==='emom'){
    document.getElementById('emomStartBtn').addEventListener('click', ()=>{
      timerModal.emomLen=Math.max(1, parseInt(document.getElementById('emomLen').value,10)||60);
      timerModal.emomRounds=Math.max(1, parseInt(document.getElementById('emomRounds').value,10)||10);
      if(!timerModal.running){
        timerModal.running=true; if(!timerModal.remaining||timerModal.remaining<=0) timerModal.remaining=timerModal.emomLen;
        clearInterval(engineInterval);
        engineInterval=setInterval(()=>{
          timerModal.remaining--;
          cueCountdown(timerModal.remaining);
          if(timerModal.remaining<=0){ timerModal.round++; if(timerModal.round>timerModal.emomRounds){ clearInterval(engineInterval); timerModal.running=false; timerModal.round=timerModal.emomRounds; CUE.done(); } else { timerModal.remaining=timerModal.emomLen; CUE.work(); } }
          const disp=document.getElementById('emomDisplay');
          if(disp) disp.innerHTML=`<span class="phase">${timerModal.running?'EN CURSO':'LISTO'}</span>${fmtTime(Math.max(0,timerModal.remaining))}<span class="round">Ronda ${timerModal.round} de ${timerModal.emomRounds}</span>`;
        },1000);
      } else { timerModal.running=false; clearInterval(engineInterval); }
      renderTimerModal();
    });
    document.getElementById('emomResetBtn').addEventListener('click', ()=>{
      clearInterval(engineInterval); timerModal.round=1; timerModal.running=false;
      timerModal.remaining=parseInt(document.getElementById('emomLen').value,10)||60; renderTimerModal();
    });
  } else if(timerModal.mode==='amrap'){
    document.getElementById('amrapStartBtn').addEventListener('click', ()=>{
      timerModal.amrapMin=Math.max(1, parseInt(document.getElementById('amrapMin').value,10)||12);
      if(!timerModal.running2){
        timerModal.running2=true; if(!timerModal.amrapRemaining||timerModal.amrapRemaining<=0) timerModal.amrapRemaining=timerModal.amrapMin*60;
        clearInterval(engineInterval);
        engineInterval=setInterval(()=>{
          timerModal.amrapRemaining--;
          cueCountdown(timerModal.amrapRemaining);
          if(timerModal.amrapRemaining<=0){ clearInterval(engineInterval); timerModal.running2=false; CUE.done(); }
          const disp=document.querySelector('.interval-display');
          if(disp) disp.innerHTML=`<span class="phase">${timerModal.running2?'EN CURSO':'LISTO'}</span>${fmtTime(Math.max(0,timerModal.amrapRemaining))}`;
        },1000);
      } else { timerModal.running2=false; clearInterval(engineInterval); }
      renderTimerModal();
    });
    document.getElementById('amrapLapBtn').addEventListener('click', ()=>{ timerModal.amrapLaps++; beep(880,110,0.25); buzz(45); renderTimerModal(); });
    document.getElementById('amrapResetBtn').addEventListener('click', ()=>{
      clearInterval(engineInterval); timerModal.running2=false; timerModal.amrapLaps=0;
      timerModal.amrapRemaining=(parseInt(document.getElementById('amrapMin').value,10)||12)*60; renderTimerModal();
    });
  } else {
    document.getElementById('serStartBtn').addEventListener('click', ()=>{
      timerModal.seriesRestSec=Math.max(1, parseInt(document.getElementById('serRest').value,10)||180);
      timerModal.seriesCount=Math.max(1, parseInt(document.getElementById('serCount').value,10)||5);
      if(!timerModal.seriesRunning){
        timerModal.seriesRunning=true; ensureAudio();
        if(!timerModal.seriesRemaining||timerModal.seriesRemaining<=0) timerModal.seriesRemaining=timerModal.seriesRestSec;
        clearInterval(engineInterval);
        engineInterval=setInterval(()=>{
          timerModal.seriesRemaining--;
          cueCountdown(timerModal.seriesRemaining);
          if(timerModal.seriesRemaining<=0){
            clearInterval(engineInterval); timerModal.seriesRunning=false;
            timerModal.seriesRemaining=0;
            CUE.work();               // descanso terminado: toca la siguiente serie
            renderTimerModal();
            return;
          }
          const disp=document.getElementById('serDisplay');
          if(disp) disp.innerHTML=`<span class="phase">DESCANSO</span>${fmtTime(Math.max(0,timerModal.seriesRemaining))}<span class="round">Serie ${timerModal.seriesRound} de ${timerModal.seriesCount}</span>`;
        },1000);
      } else { timerModal.seriesRunning=false; clearInterval(engineInterval); }
      renderTimerModal();
    });
    document.getElementById('serNextBtn').addEventListener('click', ()=>{
      clearInterval(engineInterval); timerModal.seriesRunning=false;
      if(timerModal.seriesRound < timerModal.seriesCount) timerModal.seriesRound++;
      timerModal.seriesRemaining = timerModal.seriesRestSec;
      renderTimerModal();
    });
    document.getElementById('serResetBtn').addEventListener('click', ()=>{
      clearInterval(engineInterval); timerModal.seriesRunning=false; timerModal.seriesRound=1;
      timerModal.seriesRemaining=parseInt(document.getElementById('serRest').value,10)||180; renderTimerModal();
    });
  }
}

// ---------- CALENDARIO (atleta) ----------
// Etiqueta corta del tipo de sesión, sacada de las secciones de sus ejercicios.
function tipoDeSesion(entry){
  if(!entry) return '';
  const secs = (entry.exercises||[]).map(x=>(x.section||'').trim()).filter(Boolean);
  if(secs.length){
    const cuenta = {};
    secs.forEach(x=>{ cuenta[x] = (cuenta[x]||0)+1; });
    const top = Object.keys(cuenta).sort((a,b)=>cuenta[b]-cuenta[a])[0];
    return top;
  }
  return 'Sesión';
}
function abreviaTipo(t){
  const map = {'Fuerza':'FZA','Fuerza submáxima':'FZA','Hipertrofia':'HT','Potencia':'POT',
    'Pliometría':'PLIO','Resistencia':'RES','Movilidad':'MOV','Activación':'ACT','Core':'CORE',
    'Técnica':'TEC','Recuperación':'REC','Específico Hyrox':'HYROX','Sesión':'✓'};
  if(map[t]) return map[t];
  return t.slice(0,4).toUpperCase();
}
function monthGridHtml(callDateStr, journal, offset){
  const base = new Date();
  base.setDate(1);
  base.setMonth(base.getMonth() + (offset||0));
  const year=base.getFullYear(), month=base.getMonth();
  const hoy = new Date();
  const first = new Date(year, month, 1);
  const startOffset = (first.getDay()+6)%7;
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const callDate = callDateStr ? new Date(callDateStr+'T00:00:00') : null;
  // Sesiones registradas de ese mes, indexadas por día
  const porDia = {};
  (journal||[]).forEach(e=>{
    if(!e || !e.date) return;
    const d = new Date(e.date+'T00:00:00');
    if(d.getFullYear()===year && d.getMonth()===month) porDia[d.getDate()] = e;
  });
  const nombreMes = base.toLocaleDateString('es-ES',{month:'long', year:'numeric'});
  let html = `<div class="cal-head">
    <button class="btn ghost small" data-calmove="-1">←</button>
    <b>${nombreMes.charAt(0).toUpperCase()+nombreMes.slice(1)}</b>
    <button class="btn ghost small" data-calmove="1" ${(offset||0)>=0?'disabled':''}>→</button>
  </div>`;
  html += `<div class="cal-grid">`;
  ['Lu','Ma','Mi','Ju','Vi','Sa','Do'].forEach(d=>html+=`<div class="dow">${d}</div>`);
  for(let i=0;i<startOffset;i++) html += `<div class="cal-day empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const isToday = d===hoy.getDate() && month===hoy.getMonth() && year===hoy.getFullYear();
    const isCall = callDate && callDate.getDate()===d && callDate.getMonth()===month && callDate.getFullYear()===year;
    const e = porDia[d];
    const tipo = e ? abreviaTipo(tipoDeSesion(e)) : '';
    html += `<div class="cal-day ${isToday?'today':''} ${isCall?'call':''} ${e?'trained':''}" ${e?`title="${escapeHtml(e.date)} · carga ${e.fatigueScore}"`:''}>
      <span class="cd-num">${d}</span>${tipo?`<span class="cd-tag">${tipo}</span>`:''}
    </div>`;
  }
  html += `</div>`;
  // Resumen del mes por tipo (punto 2)
  const sesiones = Object.values(porDia);
  if(sesiones.length){
    const cuenta = {};
    sesiones.forEach(e=>{ const t = tipoDeSesion(e); cuenta[t] = (cuenta[t]||0)+1; });
    const cargaTotal = sesiones.reduce((a,e)=>a+(e.fatigueScore||0),0);
    const minutos = Math.round(sesiones.reduce((a,e)=>a+(e.durationSeconds||0),0)/60);
    html += `<div class="cal-summary">
      <div class="cal-sum-kpis">
        <div><b>${sesiones.length}</b><span>Sesiones</span></div>
        <div><b>${minutos}</b><span>Minutos</span></div>
        <div><b>${cargaTotal.toFixed(0)}</b><span>Carga total</span></div>
      </div>
      <div class="cal-sum-types">${Object.keys(cuenta).sort((a,b)=>cuenta[b]-cuenta[a])
        .map(t=>`<span class="ctype"><i>${cuenta[t]}</i>${escapeHtml(t)}</span>`).join('')}</div>
    </div>`;
  } else {
    html += `<div class="empty" style="padding:10px 0;">Sin sesiones registradas este mes.</div>`;
  }
  return html;
}
function icsFor(call, athleteName){
  if(!call || !call.nextDate) return null;
  const start = new Date(call.nextDate + 'T18:00:00');
  const mins = (()=>{ const m = String(call.duration||'').match(/(\d+)/); return m ? parseInt(m[1],10) : 20; })();
  const end = new Date(start.getTime() + mins*60000);
  const fmt = d => d.toISOString().replace(/[-:]/g,'').split('.')[0] + 'Z';
  const esc = s => String(s||'').replace(/([,;\\])/g,'\\$1').replace(/\n/g,'\\n');
  const lines = [
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Umbral//ES','CALSCALE:GREGORIAN','BEGIN:VEVENT',
    'UID:umbral-'+Date.now()+'@umbral',
    'DTSTAMP:'+fmt(new Date()),
    'DTSTART:'+fmt(start),
    'DTEND:'+fmt(end),
    'SUMMARY:'+esc('Revisión de entrenamiento · Umbral'),
    'DESCRIPTION:'+esc((call.notes||'') + (athleteName?('\nAtleta: '+athleteName):'')),
    'BEGIN:VALARM','TRIGGER:-PT30M','ACTION:DISPLAY','DESCRIPTION:'+esc('Revisión en 30 minutos'),'END:VALARM',
    'END:VEVENT','END:VCALENDAR'
  ];
  return lines.join('\r\n');
}

async function tplCalendarioAtleta(athleteId){

    const dias = Math.ceil((new Date(call.nextDate+'T00:00:00') - new Date())/86400000);

      if(url) html += `<a class="btn" href="${url[0]}" target="_blank" rel="noopener" style="display:inline-block;text-decoration:none;margin-right:8px;">Abrir videollamada</a>`;
    }
    html += `<button class="btn ghost" id="addToCalendarBtn">Añadir a mi calendario</button>
      <p style="font-size:11.5px;color:var(--muted);margin-top:10px;">Descarga un evento que puedes abrir con la app de calendario de tu móvil. Incluye aviso 30 minutos antes.</p>`;
  } else {
    html += `<div class="cal-banner muted">Tu entrenador aún no ha programado la próxima revisión.</div>`;
  }

  // Estado del check diario para el banner

function weekHistoryHtml(hist, athleteId){
  let out = '';
  hist.slice().reverse().forEach(w=>{
    const key = `hist-${athleteId}-${w.weekNumber}`;
    const open = state.openDays[key] ? 'open':'';
    out += `<div class="acc ${open}" data-day="${key}"><div class="acc-head" data-toggle="${key}"><b style="text-transform:none;">Semana ${w.weekNumber}</b><span class="chev"><span class="chev-arrow">▾</span></span><span class="chev-count">${w.weekOf}</span></div>
      <div class="acc-body">${DAYS.map(d=>{
        const dayHasContent = BLOCKS.some(b=>(w.days[d]&&w.days[d][b.key]||[]).length>0);
        if(!dayHasContent) return '';
        let inner = `<div class="block-title" style="border-top:none;margin-top:0;">${d}</div>`;
        BLOCKS.forEach(b=>{ (w.days[d][b.key]||[]).forEach(ex=>{ inner += `<div class="ex-view-card"><h4>${escapeHtml(ex.name)}</h4><div class="ex-meta"><span>${ex.series||'—'} x ${escapeHtml(ex.reps||'—')}</span></div></div>`; }); });
        return inner;
      }).join('') || '<div class="empty">Sin ejercicios registrados.</div>'}</div></div>`;
  });
  return out;
}

async function getQuestConfig(athleteId){

  if(athleteId){
    const own = await safeGet('quest-config-'+athleteId, true);

  const routine = await getRoutine(athleteId, false);
  const n = DAYS.filter(d => BLOCKS.some(b => routine.days[d][b.key].length > 0)).length;

    return `<div class="empty" style="padding:18px 0;">Tu entrenador no ha activado ninguna pregunta para este cuestionario todavía. Cuando lo haga, aparecerá aquí.</div>`;
  }
