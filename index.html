<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1B2A49">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Umbral">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=marca2">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=marca2">
<title>Umbral — Seguimiento de atletas</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap');
  :root{ --navh:64px; }
  /* Modo oscuro con la misma marca: marino profundo de fondo y mostaza como
     acento. Sobre oscuro la mostaza sí puede llevar el peso del acento (tiene
     contraste de sobra), al revés que en claro, donde manda el marino. */
  body.theme-dark{
    --bg:#0E1622; --panel:#15202F; --panel2:#1C2838; --panel3:#233043; --border:#2B3648;
    --ink:#F4F2EA; --muted:#9AA5B8; --accent:#C9A227; --accent-dim:#2B2716; --on-accent:#0E1622;
    --gold:#C9A227; --gold-dim:#2B2716;
    --warn:#D9A93C; --danger:#E2685C;
  }
  /* Modo claro con la paleta de marca: azul marino, mostaza y blanco roto.
     El azul lleva la estructura (texto, botones) porque es lo más legible sobre
     claro; la mostaza queda para los acentos que deben destacar. */
  body.theme-light{
    --bg:#F4F2EA; --panel:#FFFFFF; --panel2:#F2EFE6; --panel3:#EDEADF; --border:#D9D4C4;
    --ink:#1B2A49; --muted:#5F6678; --accent:#1B2A49; --accent-dim:#E6E9F1; --on-accent:#FFFFFF;
    --gold:#856210; --gold-dim:#F6EDD6;
    --warn:#B8891F; --danger:#A83A2E;
  }

  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{background:var(--bg);color:var(--ink);font-family:'Manrope',sans-serif;min-height:100vh;transition:background .25s,color .25s;}
  .app{max-width:720px;margin:0 auto;padding:18px 16px calc(var(--navh) + 34px);}
  header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:16px;}
  .brand{display:flex;align-items:baseline;gap:9px;}
  .brand h1{font-family:'Fraunces',serif;font-weight:700;font-size:21px;letter-spacing:-0.01em;}
  .brand span{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--gold);text-transform:uppercase;letter-spacing:0.1em;}
  .role-switch{display:flex;background:var(--panel);border:1px solid var(--border);border-radius:100px;padding:3px;}
  .role-switch button{border:none;background:transparent;color:var(--muted);font-weight:700;font-size:12.5px;padding:7px 15px;border-radius:100px;cursor:pointer;font-family:'Manrope',sans-serif;}
  .role-switch button.active{background:var(--accent);color:var(--on-accent);}
  .theme-toggle{background:var(--panel);border:1px solid var(--border);color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;padding:8px 14px;border-radius:100px;cursor:pointer;}
  .theme-toggle:hover{color:var(--accent);border-color:var(--accent);}
  .notice{background:var(--panel2);border:1px solid var(--border);border-left:3px solid var(--warn);border-radius:4px;padding:10px 14px;font-size:12px;color:var(--muted);margin-bottom:18px;line-height:1.5;}
  .notice b{color:var(--ink);}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:16px;}
  .card h2{font-family:'Fraunces',serif;font-size:18px;font-weight:600;margin-bottom:14px;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  select, input[type=text], input[type=date], input[type=number], textarea{
    background:var(--panel2); border:1px solid var(--border); color:var(--ink);
    border-radius:6px; padding:9px 11px; font-family:'Manrope',sans-serif; font-size:14px;
  }
  select:focus, input:focus, textarea:focus{outline:2px solid var(--accent); outline-offset:1px;}
  textarea{width:100%; resize:vertical; line-height:1.55;}
  label.field-label{display:block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:5px;}
  button.btn{background:var(--accent); color:var(--on-accent); border:none; font-weight:700; font-size:14px; padding:10px 18px; border-radius:7px; cursor:pointer; font-family:'Manrope',sans-serif; transition:filter .12s, transform .08s;}
  button.btn:hover{filter:brightness(1.08);}
  button.btn:active{transform:scale(0.97);}
  button.btn.ghost{background:transparent; border:1px solid var(--border); color:var(--ink); font-weight:600;}
  button.btn.danger{background:var(--danger);color:#FFFFFF;}
  button.btn.small{padding:6px 12px;font-size:12.5px;}
  button.btn:disabled{opacity:0.4;cursor:not-allowed;}

  #tabContent.cargando{opacity:0.45;transition:opacity .18s ease;pointer-events:none;}
  #tabContent.anim-in, #main.anim-in > .card:first-child{animation:fadeSlide .28s ease both;}
  @keyframes fadeSlide{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  @media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important;} }

  .bottomnav{position:fixed;left:0;right:0;bottom:0;height:var(--navh);background:var(--panel);border-top:1px solid var(--border);display:flex;z-index:40;}
  .bottomnav button{flex:1;background:transparent;border:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;font-family:'Manrope',sans-serif;font-size:10.5px;font-weight:600;}
  .bottomnav button .ic{width:20px;height:20px;}
  .bottomnav button.active{color:var(--accent);}
  .bottomnav button.active svg{stroke:var(--accent);}
  .bottomnav button svg{stroke:var(--muted);}

  .acc{border:1px solid var(--border);border-radius:8px;margin-bottom:10px;overflow:hidden;}
  .acc-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:var(--panel2);cursor:pointer;}
  .acc-head b{font-family:'Fraunces',serif;text-transform:capitalize;font-size:15px;font-weight:600;}
  .acc-head .chev-arrow{display:inline-block;color:var(--accent);font-family:'IBM Plex Mono',monospace;font-size:11.5px;transition:transform .25s ease;}
  .acc-head .chev-count{color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:11.5px;margin-left:6px;}
  .acc.open .acc-head .chev-arrow{transform:rotate(180deg);}
  /* Sin límite de altura al abrir: con 3000px el contenido se recortaba a
     partir del sexto ejercicio y no se podía seguir bajando. La apertura se
     acompaña con un fundido para que no resulte brusca. */
  .acc-body{max-height:0;overflow:hidden;padding:0 16px;transition:padding .22s ease;}
  .acc.open .acc-body{max-height:none;overflow:visible;padding:16px;}
  .acc.just-opened .acc-body{animation:accOpen .26s ease both;}
  @keyframes accOpen{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:translateY(0);}}
  .block-title{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--gold);text-transform:uppercase;letter-spacing:0.08em;margin:14px 0 8px;padding-top:10px;border-top:1px dashed var(--border);}
  .block-title:first-child{border-top:none;padding-top:0;margin-top:0;}

  .diario-detalle{margin-top:10px;overflow-x:auto;}
  .tabla-comp{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:10px;}
  .tabla-comp th{text-align:left;font-family:'IBM Plex Mono',monospace;font-size:9.5px;text-transform:uppercase;letter-spacing:0.05em;color:var(--muted);padding:5px 7px;border-bottom:1px solid var(--border);font-weight:600;}
  .tabla-comp td{padding:6px 7px;border-bottom:1px dashed var(--border);}
  .tabla-comp .cmp-mejor{color:var(--accent);font-weight:700;}
  .tabla-comp .cmp-peor{color:var(--danger);font-weight:700;}
  .tabla-comp .cmp-igual{color:var(--muted);}
  .tabla-comp .col-prev{color:var(--muted);}
  .tabla-comp .col-dif{color:var(--accent);font-weight:700;}
  .tabla-comp .col-bien{color:var(--accent);font-weight:700;}
  .tabla-comp .fila-nota td{font-size:11.5px;color:var(--muted);font-style:italic;padding-top:0;border-bottom:1px dashed var(--border);}
  .ex-note{display:flex;flex-direction:column;gap:2px;background:var(--panel2);border-left:2px solid var(--accent);border-radius:0 6px 6px 0;padding:7px 11px;margin-bottom:6px;}
  .ex-note b{font-size:12px;color:var(--accent);font-weight:600;}
  .ex-note span{font-size:12.5px;color:var(--ink);line-height:1.45;}
  .video-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px dashed var(--border);margin-top:10px;padding-top:10px;}
  .video-tag{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--accent);background:var(--accent-dim);border-radius:100px;padding:4px 11px;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .vid-item{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:11px 13px;margin-bottom:8px;}
  .vid-item .vi-name{flex:1;min-width:0;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .vid-item .vi-size{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);white-space:nowrap;}
  .video-player{width:100%;border-radius:10px;background:#000;max-height:60vh;}
  .ex-move{min-width:38px;padding:6px 10px;font-family:'IBM Plex Mono',monospace;}
  .ex-card{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:10px;position:relative;}
  .ex-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}
  .ex-grid .full{grid-column:1/-1;}
  .ex-grid > div{min-width:0;}
  .ex-grid input, .ex-grid select, .ex-grid textarea{width:100%;min-width:0;}
  .timer-fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0;}
  .timer-fields > div{display:flex;flex-direction:column;gap:5px;min-width:0;}
  .timer-fields input{width:100%;min-width:0;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:16px;padding:10px 4px;}
  .timer-fields .field-label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  @media (max-width:400px){
    .ex-grid{grid-template-columns:1fr;}
    .timer-fields{grid-template-columns:repeat(2,minmax(0,1fr));}
  }
  .ex-view-card{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:14px 16px;margin-bottom:10px;}
  .ex-view-card h4{font-family:'Fraunces',serif;font-size:15.5px;font-weight:600;margin-bottom:4px;}
  /* pre-wrap conserva los saltos de línea que escribe el entrenador, para que
     una descripción numerada se lea como una lista y no como un párrafo. */
  .ex-view-card p.desc{font-size:12.5px;color:var(--muted);margin-bottom:8px;white-space:pre-wrap;line-height:1.6;}
  .ex-meta{display:flex;gap:14px;flex-wrap:wrap;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--muted);}
  .ex-meta b{color:var(--ink);}
  .save-flag{position:absolute;top:10px;right:12px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--accent);opacity:0;transition:opacity .3s;}
  .save-flag.show{opacity:1;}

  .ai-import{background:var(--panel3);border:1px dashed var(--border);border-radius:8px;padding:12px;margin-bottom:12px;}
  .ai-import textarea{min-height:70px;margin-bottom:8px;}

  .entry{border-bottom:1px dashed var(--border);padding:12px 0;}
  .entry:last-child{border-bottom:none;}
  .entry-top{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-family:'IBM Plex Mono',monospace;}
  .pill{display:inline-block;min-width:26px;text-align:center;border-radius:100px;padding:2px 8px;font-weight:700;font-size:12px;font-family:'IBM Plex Mono',monospace;}
  .empty{color:var(--muted);font-size:13px;font-style:italic;padding:14px 0;}

  .scale{display:flex;gap:7px;flex-wrap:wrap;}
  .scale button{min-width:38px;height:38px;padding:0 8px;border-radius:7px;border:1px solid var(--border);background:var(--panel2);color:var(--muted);font-family:'IBM Plex Mono',monospace;font-weight:600;cursor:pointer;}
  .scale button.sel{background:var(--accent);border-color:var(--accent);color:var(--on-accent);}
  .scale-labels{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-top:4px;}
  .q-item{margin-bottom:26px;}
  .q-item p{font-size:14px;margin-bottom:9px;}
  .q-note{margin-top:8px;}
  .q-note textarea{min-height:36px;font-size:12.5px;}

  .session-overlay{position:fixed;inset:0;background:var(--bg);z-index:100;overflow-y:auto;padding:16px 16px calc(env(safe-area-inset-bottom) + 24px);}
  .session-topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .session-topbar h2{font-family:'Fraunces',serif;font-size:19px;}
  .stopwatch{font-family:'IBM Plex Mono',monospace;font-size:52px;font-weight:600;text-align:center;color:var(--accent);letter-spacing:0.02em;margin:6px 0 16px;}
  .set-box{display:inline-flex;gap:5px;flex-wrap:wrap;margin-top:6px;}
  .set-chip{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:var(--panel);color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:11.5px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .set-chip.done{background:var(--accent);border-color:var(--accent);color:var(--on-accent);}
  .ex-view-card.done h4{text-decoration:line-through;color:var(--muted);}
  .rpe-applied{display:flex;align-items:center;gap:8px;margin-top:8px;}
  .rpe-applied input{width:60px;}

  .modal-back{position:fixed;inset:0;background:rgba(3,8,6,0.7);z-index:120;display:flex;align-items:flex-end;justify-content:center;}
  .modal{background:var(--panel);border-top-left-radius:14px;border-top-right-radius:14px;width:100%;max-width:720px;padding:20px;max-height:85vh;overflow-y:auto;}
  .mode-tabs{display:flex;gap:6px;margin-bottom:14px;}
  .mode-tabs button{flex:1;background:var(--panel2);border:1px solid var(--border);color:var(--muted);padding:8px;border-radius:6px;font-weight:700;font-size:12.5px;cursor:pointer;}
  .mode-tabs button.active{background:var(--accent-dim);color:var(--accent);border-color:var(--accent);}
  .preset-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0;}
  .preset-grid button{background:var(--panel2);border:1px solid var(--border);color:var(--ink);padding:9px 4px;border-radius:6px;font-family:'IBM Plex Mono',monospace;font-size:12px;cursor:pointer;}
  .interval-display{font-family:'IBM Plex Mono',monospace;font-size:36px;text-align:center;margin:14px 0;padding:20px;border-radius:10px;letter-spacing:0.01em;}
  .interval-display .phase{display:block;font-size:14px;font-weight:700;letter-spacing:0.08em;margin-bottom:6px;}
  .interval-display .round{display:block;font-size:12px;font-family:'Manrope',sans-serif;font-weight:600;margin-top:6px;color:var(--muted);}
  .interval-display.work{background:var(--accent-dim);color:var(--accent);}
  .interval-display.rest{background:var(--gold-dim);color:var(--gold);}
  .interval-display.prep{background:var(--panel3);color:var(--danger);}
  .interval-display.idle{background:var(--panel2);color:var(--muted);}
  .amrap-count{font-family:'IBM Plex Mono',monospace;font-size:40px;text-align:center;color:var(--accent);margin:10px 0;}

  .cal-banner{background:var(--accent);color:var(--on-accent);border-radius:8px;padding:12px 14px;margin-bottom:14px;font-size:13.5px;}
  .cal-banner.muted{background:var(--panel2);color:var(--muted);}
  .cal-banner b{color:inherit;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cal-grid .dow{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);text-align:center;padding:4px 0;}
  .cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:6px;font-size:12.5px;background:var(--panel2);color:var(--muted);}
  .cal-day.today{border:1px solid var(--accent);color:var(--ink);}
  .cal-day.call{background:var(--accent);color:var(--on-accent);font-weight:700;}
  .cal-day.empty{background:transparent;}
  .pending-task{background:var(--panel3);border:1px dashed var(--accent);border-radius:8px;padding:14px;margin-bottom:14px;}
  .pending-task .tag{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--accent);text-transform:uppercase;letter-spacing:0.06em;display:block;margin-bottom:6px;}

  .tut-back{position:fixed;inset:0;background:rgba(8,10,9,0.78);z-index:150;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeSlide .22s ease both;}
  .tut-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:26px 22px 20px;max-width:420px;width:100%;max-height:88vh;overflow-y:auto;text-align:center;}
  .tut-ic{width:52px;height:52px;border-radius:13px;background:var(--accent-dim);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;}
  .tut-ic svg{width:26px;height:26px;stroke:var(--accent);}
  .tut-card h2{font-family:'Fraunces',serif;font-size:20px;font-weight:600;margin-bottom:10px;}
  .tut-card p{font-size:14px;color:var(--muted);line-height:1.6;text-align:left;margin-bottom:18px;}
  .tut-dots{display:flex;justify-content:center;gap:6px;margin-bottom:18px;}
  .tut-dots i{width:6px;height:6px;border-radius:50%;background:var(--border);transition:background .2s,width .2s;}
  .tut-dots i.on{background:var(--accent);width:18px;border-radius:3px;}
  .tut-actions{display:flex;gap:10px;justify-content:center;}
  .tut-actions .btn{flex:1;}
  .tut-skip-link{display:block;margin:12px auto 0;background:none;border:none;color:var(--muted);font-family:'Manrope',sans-serif;font-size:12.5px;cursor:pointer;text-decoration:underline;}
  .week-head{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:13px 15px;margin-bottom:14px;}
  .week-main b{display:block;font-family:'Fraunces',serif;font-size:14.5px;font-weight:600;}
  .week-main span{display:block;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);margin-top:3px;}
  .week-pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .wpill{font-family:'IBM Plex Mono',monospace;font-size:11px;background:var(--accent-dim);color:var(--accent);border-radius:6px;padding:5px 10px;}
  .wpill i{display:block;font-style:normal;font-size:9px;opacity:0.75;text-transform:uppercase;letter-spacing:0.06em;}
  .week-note{font-size:12.5px;color:var(--muted);margin-top:9px;font-style:italic;}
  .week-comp{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--danger);margin-top:8px;}
  .kv-list > div{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:8px 0;border-bottom:1px dashed var(--border);}
  .kv-list > div:last-child{border-bottom:none;}
  .kv-list span{font-size:13px;color:var(--muted);}
  .kv-list b{font-size:14px;text-align:right;}
  .task-banner{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--accent);border-radius:10px;padding:15px;cursor:pointer;font-family:'Manrope',sans-serif;color:var(--ink);}
  .task-banner.done{border-color:var(--border);}
  .task-ic{flex-shrink:0;width:34px;height:34px;border-radius:8px;background:var(--accent-dim);display:flex;align-items:center;justify-content:center;}
  .task-ic svg{width:18px;height:18px;stroke:var(--accent);}
  .task-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .task-txt b{font-family:'Fraunces',serif;font-size:15px;font-weight:600;}
  .task-txt span{font-size:12px;color:var(--muted);}
  .task-arrow{font-family:'IBM Plex Mono',monospace;color:var(--accent);font-size:16px;}
  .habit-row{border:1px solid var(--border);border-radius:8px;padding:13px 15px;margin-bottom:10px;background:var(--panel2);}
  .habit-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:9px;}
  .habit-head b{font-family:'Fraunces',serif;font-size:14.5px;font-weight:600;}
  .habit-tag{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--accent);background:var(--accent-dim);border-radius:100px;padding:2px 8px;}
  .habit-check{background:var(--panel);border:1px solid var(--border);color:var(--muted);font-family:'Manrope',sans-serif;font-weight:700;font-size:13.5px;padding:9px 18px;border-radius:7px;cursor:pointer;}

  .splash{position:fixed;inset:0;z-index:400;background:#1B2A49;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:0;transition:opacity .45s ease, visibility .45s;}
  .splash.hide{opacity:0;visibility:hidden;pointer-events:none;}
  .splash-mark{width:min(42vw,180px);height:auto;overflow:visible;}
  .sp-outline{stroke:#3A4A6B;stroke-width:2.5;fill:none;}
  .sp-ring{fill:none;stroke:#C9A227;stroke-width:2;opacity:0;transform-origin:50px 52px;
    animation:spRipple 1.1s ease 1.35s forwards;}
  .sp-floor{opacity:0;transform-origin:50px 90px;animation:spFloor .5s cubic-bezier(.2,.8,.3,1) .1s forwards;}
  .sp-fill{transform:translateY(96px);animation:spFill 1.05s cubic-bezier(.32,.72,.24,1) .5s forwards;}
  .splash-word{margin-top:26px;font-family:'Fraunces',serif;font-size:25px;font-weight:600;
    color:#F4F2EA;letter-spacing:0.2em;opacity:0;animation:spWord .55s ease 1.55s forwards;}
  .splash-sub{margin-top:9px;font-family:'Fraunces',serif;font-style:italic;font-weight:400;
    font-size:14.5px;color:#C9A227;letter-spacing:0.02em;opacity:0;animation:spWord .55s ease 1.85s forwards;}
  @keyframes spFill{to{transform:translateY(0);}}
  @keyframes spFloor{from{opacity:0;transform:scaleX(0);}to{opacity:1;transform:scaleX(1);}}
  @keyframes spRipple{0%{opacity:.55;transform:scale(.55);}100%{opacity:0;transform:scale(2.2);}}
  @keyframes spWord{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  @media (prefers-reduced-motion: reduce){

<script>
// ---------- ALMACENAMIENTO EN SUPABASE ----------
// Los datos compartidos (atletas, rutinas, diarios…) viven en tu base de datos,
// así que cualquier dispositivo que abra la app ve lo mismo. Lo personal de cada
// móvil (la sesión iniciada) se queda en el propio navegador.
const SUPA_URL  = 'https://ubkqtagzorfcrwjhojlt.supabase.co';
const SUPA_KEY  = 'sb_publishable_3W7Jj-pYpzm6LhuXlmDouA_hk0QLypd';
const WORKSPACE = 'mario';
const SUPA_HEAD = {
  'apikey': SUPA_KEY,
  'Authorization': 'Bearer ' + SUPA_KEY,
  'Content-Type': 'application/json'
};
const SUPA_TABLE = SUPA_URL + '/rest/v1/umbral_kv';

let storageBroken = false;
let lastStorageError = '';
let storageMode = 'probando';   // 'nube' | 'local' | 'memoria'
const memStore = new Map();

function lsKey(key, shared){ return 'umbral::' + (shared?'s':'p') + '::' + key; }
function lsAvailable(){
  try{
    if(typeof localStorage === 'undefined') return false;
    localStorage.setItem('__umbral_probe__','1');
    localStorage.removeItem('__umbral_probe__');
    return true;
  }catch(e){ return false; }
}
function cacheLocal(key, shared, value){
  try{ if(lsAvailable()) localStorage.setItem(lsKey(key,shared), value); }catch(e){}
  memStore.set(lsKey(key,shared), value);
}
function readLocal(key, shared){
  const mk = lsKey(key, shared);
  try{ if(lsAvailable()){ const v = localStorage.getItem(mk); if(v !== null) return v; } }catch(e){}
  return memStore.has(mk) ? memStore.get(mk) : null;
}

async function supaGet(key){
  const url = SUPA_TABLE + '?select=value&workspace=eq.' + encodeURIComponent(WORKSPACE)
            + '&key=eq.' + encodeURIComponent(key);
  const r = await fetch(url, { headers: SUPA_HEAD });
  if(!r.ok) throw new Error('HTTP ' + r.status);
  const rows = await r.json();
  return (Array.isArray(rows) && rows.length) ? rows[0].value : null;
}
async function supaSet(key, value){
  const url = SUPA_TABLE + '?on_conflict=workspace,key';
  const r = await fetch(url, {
    method: 'POST',
    headers: { ...SUPA_HEAD, 'Prefer': 'resolution=merge-duplicates,return=minimal' },
    body: JSON.stringify({ workspace: WORKSPACE, key, value, updated_at: new Date().toISOString() })
  });
  if(!r.ok){
    let detalle = 'HTTP ' + r.status;
    try{ const j = await r.json(); if(j && j.message) detalle = j.message; }catch(e){}
    throw new Error(detalle);
  }
  return true;
}
async function supaList(){
  const url = SUPA_TABLE + '?select=key&workspace=eq.' + encodeURIComponent(WORKSPACE);
  const r = await fetch(url, { headers: SUPA_HEAD });
  if(!r.ok) throw new Error('HTTP ' + r.status);
  const rows = await r.json();
  return Array.isArray(rows) ? rows.map(x=>x.key) : [];
}

// En modo demo todo ocurre en memoria: se puede trastear sin miedo y al
// recargar vuelve a estar como el primer día, igual para todo el mundo.

  demoStore.set('routine-draft-'+DEMO_ID+'-w'+weekOfISO(), JSON.stringify(r));
  demoStore.set('intake-'+DEMO_ID, JSON.stringify({ edad:'30', genero:'—', peso:'72', altura:'176',
    contacto:'muestra@umbral.app', aniosExperiencia:'4',

    franjas:'Mañanas entre semana, sábado libre', lesiones:'Molestia antigua en rodilla derecha, sin lesión activa',
    comoLlego:'Recomendación', material:'Gimnasio completo' }));
  demoStore.set('profile-'+DEMO_ID, JSON.stringify({ estado:'Activo', tarifa:'90', pagado:'Sí',
    vence:'', plaza:'Ejemplo', alta:'', notas:'' }));
  demoStore.set('journal-'+DEMO_ID, JSON.stringify(diarioDemo()));
  demoStore.set('habits-config-'+DEMO_ID, JSON.stringify(habitosDemo()));
  demoStore.set('habits-'+DEMO_ID, JSON.stringify(habitosLogDemo()));
  demoStore.set('call-'+DEMO_ID, JSON.stringify({ nextDate:'', duration:'25 min',
    notes:'En la revisión repasamos la semana, ajustamos cargas y resolvemos dudas.' }));
  demoStore.set('quest-config-'+DEMO_ID, JSON.stringify(['sleep_quality','fatigue_accum','motivation','pain_unusual']));
  demoStore.set('seed-done-v1','true');

async function safeGet(key, shared){
  // En modo demo leemos lo que el entrenador tenga diseñado de verdad; sólo si
  // el visitante ha tocado algo durante su visita se devuelve su versión
  // temporal, que vive únicamente en memoria.
  if(state.modoDemo && shared && demoStore.has(key)) return demoStore.get(key);
  // Lo no compartido es de este dispositivo: nunca sale a la nube.
  if(!shared) return readLocal(key, false);
  try{
    const v = await supaGet(key);
    storageMode = 'nube'; storageBroken = false;
    if(v !== null && v !== undefined){ cacheLocal(key, true, v); return v; }
    return null;
  }catch(e){
    // Sin conexión o error: tiramos de la última copia guardada en el móvil.
    lastStorageError = (e && e.message) ? e.message : String(e);
    if(storageMode === 'nube') storageMode = 'local';
    return readLocal(key, true);
  }
}

async function safeSet(key, value, shared){
  if(state.modoDemo){
    // Se acepta el cambio para que la app responda con normalidad, pero sólo
    // vive en memoria: al recargar, la demo vuelve a su estado original.
    if(shared) demoStore.set(key, value);
    else cacheLocal(key, false, value);
    return true;
  }
  if(!shared){ cacheLocal(key, false, value); return true; }
  cacheLocal(key, true, value);   // guardamos siempre en local primero
  try{
    await supaSet(key, value);
    storageMode = 'nube'; storageBroken = false;
    return true;
  }catch(e){
    lastStorageError = (e && e.message) ? e.message : String(e);
    storageBroken = true;
    storageMode = lsAvailable() ? 'local' : 'memoria';
    return true; // no se ha perdido: está en el móvil
  }
}

// ---------- GALERÍA DE VÍDEOS ----------
// Los vídeos viven en Supabase Storage; en la base de datos sólo guardamos su
// referencia. Se suben una vez y se reutilizan en cualquier ejercicio o atleta.
const VIDEO_BUCKET = 'umbral-videos';
const MAX_VIDEO_MB = 60;

async function getVideoLib(){
  const raw = await safeGet('video-library', true);
  try{ const l = raw ? JSON.parse(raw) : []; return Array.isArray(l) ? l : []; }
  catch(e){ return []; }
}
async function saveVideoLib(lib){ return safeSet('video-library', JSON.stringify(lib), true); }
function videoPublicUrl(path){
  return SUPA_URL + '/storage/v1/object/public/' + VIDEO_BUCKET + '/' + path;
}
async function subirVideo(file, nombre){
  if(!file) throw new Error('no hay archivo');
  const mb = file.size / (1024*1024);
  if(mb > MAX_VIDEO_MB) throw new Error(`el vídeo pesa ${mb.toFixed(1)} MB (máximo ${MAX_VIDEO_MB})`);
  // Con vídeos muy pesados el plan gratuito de Supabase se agota rápido
  // (1 GB ≈ 18 vídeos de 55 MB). Avisamos sin bloquear.
  if(mb > 30) console.info(`Vídeo de ${mb.toFixed(0)} MB: con este tamaño caben ~${Math.floor(1024/mb)} en el plan gratuito.`);
  const ext = (file.name.split('.').pop() || 'mp4').toLowerCase().replace(/[^a-z0-9]/g,'');
  const path = Date.now() + '-' + uid() + '.' + ext;
  const r = await fetch(SUPA_URL + '/storage/v1/object/' + VIDEO_BUCKET + '/' + path, {
    method: 'POST',
    headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + SUPA_KEY, 'Content-Type': file.type || 'video/mp4' },
    body: file
  });
  if(!r.ok){
    let detalle = 'HTTP ' + r.status;
    try{ const j = await r.json(); if(j && j.message) detalle = j.message; }catch(e){}
    if(r.status === 404) detalle = 'falta crear el almacén de vídeos en Supabase';
    throw new Error(detalle);
  }
  const item = { id: uid(), name: nombre || file.name.replace(/\.[^.]+$/,''), path,
                 url: videoPublicUrl(path), size: Math.round(file.size/1024), fecha: todayISO() };
  const lib = await getVideoLib();
  lib.push(item);
  await saveVideoLib(lib);
  return item;
}
async function borrarVideo(item){
  try{
    await fetch(SUPA_URL + '/storage/v1/object/' + VIDEO_BUCKET + '/' + item.path, {
      method: 'DELETE',
      headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + SUPA_KEY }
    });
  }catch(e){ /* si falla el borrado del archivo, al menos lo quitamos de la lista */ }
  const lib = await getVideoLib();
  await saveVideoLib(lib.filter(v=>v.id !== item.id));
}

async function storageSelfTest(){
  const key = '__umbral_test__';
  const val = 'ok-' + Date.now();
  try{
    await supaSet(key, val);
    const back = await supaGet(key);
    if(back === val){
      storageMode = 'nube'; storageBroken = false;
      return { ok:true, mode:'nube', detail:'sincronizado entre dispositivos' };
    }
    lastStorageError = 'la escritura no se pudo releer';
  }catch(e){ lastStorageError = (e && e.message) ? e.message : String(e); }
  storageBroken = true;
  storageMode = lsAvailable() ? 'local' : 'memoria';
  return { ok:false, mode:storageMode, detail:lastStorageError };
}

// ---------- SONIDO Y VIBRACIÓN ----------
// Sin avisos audibles un temporizador de intervalos es inservible: obliga a
// mirar la pantalla justo cuando no puedes.
let audioCtx = null;
function ensureAudio(){
  try{
    if(!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      audioCtx = new AC();
    }
    if(audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }catch(e){ return null; }
}
// «triangle» corta más que una sinusoidal pura en un gimnasio con ruido de
// fondo, y sumamos un segundo armónico una octava por encima: dos tonos a la
// vez se perciben más fuertes y más «de aviso» que uno solo, sin necesidad de
// forzar el volumen hasta el punto de distorsionar.
function beep(freq, ms, vol){
  const ctx = ensureAudio();
  if(!ctx) return;
  const v = Math.min(0.95, vol || 0.6);
  try{
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = 'triangle'; osc.frequency.value = freq;
    gain.gain.setValueAtTime(v, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + ms/1000);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + ms/1000);

    const osc2 = ctx.createOscillator(), gain2 = ctx.createGain();
    osc2.type = 'sine'; osc2.frequency.value = freq*2;
    gain2.gain.setValueAtTime(v*0.35, ctx.currentTime);
    gain2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + ms/1000);
    osc2.connect(gain2); gain2.connect(ctx.destination);
    osc2.start(); osc2.stop(ctx.currentTime + ms/1000);
  }catch(e){}
}
function buzz(pattern){ try{ if(navigator.vibrate) navigator.vibrate(pattern); }catch(e){} }
// Volúmenes subidos de forma notable respecto a la versión anterior (0.18-0.3
// → 0.55-0.9): en un gimnasio real, con música y ruido, un aviso flojo no
// sirve de nada. «done» además suena más largo, para que no pase inadvertido
// aunque el atleta esté a media serie y no mirando el móvil.
const CUE = {
  tick:   ()=>{ beep(700, 110, 0.55); },                                 // 3-2-1
  work:   ()=>{ beep(1000,260,0.85); buzz(160); },                       // empieza trabajo
  rest:   ()=>{ beep(540,300,0.75); buzz([90,80,90]); },                 // empieza descanso
  setEnd: ()=>{ beep(780,220,0.85); setTimeout(()=>beep(1080,320,0.85),190); buzz([120,90,120]); },
  done:   ()=>{ [0,220,440,660].forEach((d,i)=>setTimeout(()=>beep(700+i*220,340,0.9), d)); buzz([150,100,150,100,260]); }
};
// Cuenta atrás de los últimos 3 segundos de cualquier fase
function cueCountdown(rem){ if(rem===3||rem===2||rem===1) CUE.tick(); }

// ---------- PANTALLA ENCENDIDA ----------
let wakeLock = null;
async function keepAwake(on){
  try{
    if(on){
      if('wakeLock' in navigator && !wakeLock){
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', ()=>{ wakeLock = null; });
      }
    } else if(wakeLock){ await wakeLock.release(); wakeLock = null; }
  }catch(e){ /* no soportado: no es crítico */ }
}
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible' && session && session.fullscreen) keepAwake(true);
});

// ---------- SESIÓN EN CURSO, A PRUEBA DE CIERRES ----------
// La sesión vivía sólo en memoria: cerrar la app a mitad de entreno perdía
// todo el registro. Ahora se guarda continuamente y se puede retomar.
let sessionSaveTimer = null;
function sessionKey(athleteId){ return 'session-activa-'+athleteId; }
async function persistSession(){
  const id = state.athleteAsId || state.selectedId;
  if(!id || !session) return;
  const snapshot = {
    day: session.day, startedAt: session.startedAt || Date.now(),
    elapsedSec: session.elapsedSec, exercises: session.exercises,
    showSurvey: session.showSurvey, avgExerciseRPE: session.avgExerciseRPE,
    fatigueScore: session.fatigueScore, savedAt: Date.now()
  };
  await safeSet(sessionKey(id), JSON.stringify(snapshot), true);
}
function queueSessionSave(){
  clearTimeout(sessionSaveTimer);
  sessionSaveTimer = setTimeout(persistSession, 800);
}
async function clearPersistedSession(){
  const id = state.athleteAsId || state.selectedId;
  if(id) await safeSet(sessionKey(id), '', true);
}
async function findPausedSession(athleteId){
  const raw = await safeGet(sessionKey(athleteId), true);
  if(!raw) return null;
  try{
    const s = JSON.parse(raw);
    if(!s || !s.exercises) return null;
    // Descartamos restos de más de 12 horas
    if(Date.now() - (s.savedAt||0) > 12*3600*1000) return null;
    return s;
  }catch(e){ return null; }
}

// Terminar una sesión sin dejar cronómetros vivos: si el intervalo seguía
// corriendo tras poner session=null, reventaba al leer session.elapsedSec.
// Mantener la pantalla encendida durante la sesión (si el navegador lo permite).
let wakeLockRef = null;
async function keepScreenOn(){
  try{
    if('wakeLock' in navigator && !wakeLockRef){
      wakeLockRef = await navigator.wakeLock.request('screen');
      wakeLockRef.addEventListener('release', ()=>{ wakeLockRef = null; });
    }
  }catch(e){ /* puede denegarse: no es crítico */ }
}
function releaseScreen(){
  try{ if(wakeLockRef){ wakeLockRef.release(); wakeLockRef = null; } }catch(e){}
}
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible' && session && session.fullscreen) keepScreenOn();
});

// Cronómetro basado en la hora real, no en contar ticks. Si el móvil se apaga
// o el navegador congela los temporizadores al cambiar de app, al volver el
// tiempo transcurrido sigue siendo correcto.
function arrancarCronometro(){
  clearInterval(stopwatchInterval);
  if(!session) return;
  // Punto de referencia: lo ya acumulado y el momento en que se (re)arranca.
  session.baseElapsed = session.elapsedSec || 0;
  session.runFrom = Date.now();
  const refresca = ()=>{
    if(!session){ clearInterval(stopwatchInterval); stopwatchInterval=null; return; }
    const transcurrido = Math.floor((Date.now() - session.runFrom)/1000);
    session.elapsedSec = (session.baseElapsed || 0) + Math.max(0, transcurrido);
    const disp = document.getElementById('stopwatchDisplay');
    if(disp) disp.textContent = fmtTime(session.elapsedSec);
    if(session.elapsedSec % 15 === 0) queueSessionSave();
  };
  refresca();
  stopwatchInterval = setInterval(refresca, 1000);
}
// Lo mismo para los temporizadores de ejercicio (Tabata/EMOM/AMRAP/descanso
// entre series): si el móvil estuvo en segundo plano, al volver recalculamos
// contra el reloj real en vez de esperar al siguiente tick, incluso si se
// saltaron fases enteras mientras no se miraba.
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState !== 'visible' || !timerModal) return;
  const activo = timerModal.running || timerModal.running2 || timerModal.seriesRunning;
  if(activo && typeof timerModal._tick === 'function') timerModal._tick();
});

// Al volver a la app tras tenerla en segundo plano, recalculamos de inmediato
// en vez de esperar al siguiente tick.
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible' && session && stopwatchInterval){
    const transcurrido = Math.floor((Date.now() - session.runFrom)/1000);
    session.elapsedSec = (session.baseElapsed || 0) + Math.max(0, transcurrido);
    const disp = document.getElementById('stopwatchDisplay');
    if(disp) disp.textContent = fmtTime(session.elapsedSec);
    queueSessionSave();
  }
});

function stopSession(){
  clearInterval(stopwatchInterval); stopwatchInterval = null;
  clearInterval(engineInterval); engineInterval = null;
  clearTimeout(sessionSaveTimer);
  session = null;
  keepAwake(false);
  const ov = document.getElementById('sessionOverlay'); if(ov) ov.remove();
  const tb = document.getElementById('timerModalBack'); if(tb) tb.remove();
  timerModal = null;
}
let timerModal = null;
let stopwatchInterval = null, engineInterval = null;

function uid(){ return Math.random().toString(36).slice(2,9); }
function todayISO(){ return fechaLocalISO(new Date()); }
// Fecha en horario LOCAL. Usar toISOString() aquí restaba un día en España
// (medianoche local = 22:00 UTC del día anterior), así que las claves de semana
// caían en domingo y la app escribía en una y leía de otra.
function fechaLocalISO(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const dia = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${dia}`;
}
function weekOfISO(){ const d=new Date(); const day=d.getDay()||7; d.setDate(d.getDate()-day+1); return fechaLocalISO(d); }
function saturdayOfWeek(){ const d=new Date(); const day=d.getDay()||7; d.setDate(d.getDate()-day+6); return fechaLocalISO(d); }
function fmtTime(sec){ const m=Math.floor(sec/60), s=Math.abs(sec%60); return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`; }
// Colores del RPE dentro de la paleta: verde sobrio, mostaza y granate.
function rpeColor(rpe){ if(rpe<=3) return '#2F7355'; if(rpe<=6) return '#856210'; return '#A83A2E'; }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]||c)); }

async function init(){
  // El botón de tema debe reflejar el que ya se aplicó al cargar (ver el
  // script inline justo tras <body>), no asumir que siempre se arranca en claro.
  const tBtn = document.getElementById('themeToggle');
  if(tBtn) tBtn.textContent = document.body.classList.contains('theme-dark') ? '☀ Claro' : '☾ Oscuro';

  // El enlace público del cuestionario abre la app en modo formulario.
  try{
    const params = new URLSearchParams(location.search);
    if(params.get('filtro')) state.modoFiltro = true;
  }catch(e){}

  await seedDemoAthlete();
  await loadAthletes();
  if(state.athletes.length && !state.selectedId) state.selectedId = state.athletes[0].id;
  const savedLogin = await safeGet('umbral-session', false);
  if(savedLogin){
    try{
      const l = JSON.parse(savedLogin);
      if(l.role === 'coach'){ state.authRole='coach'; state.role='coach'; state.tab='atletas'; }
      else if(l.role === 'atleta' && l.athleteAsId && state.athletes.find(a=>a.id===l.athleteAsId)){
        state.authRole='atleta'; state.role='atleta'; state.athleteAsId=l.athleteAsId; state.tab='rutina';
        // Si dejó una sesión a medias, le llevamos directo a ella.
        const pend = await findPausedSession(l.athleteAsId);
        if(pend) state.tab = 'diario';
      }
    }catch(e){}
  }
  state.loading = false;
  render();
  const lg = document.getElementById('logoutBtn');
  if(lg) lg.addEventListener('click', async ()=>{
    state.authRole=null; state.role='coach'; state.athleteAsId=null; state.gateMode=null; state.tab='atletas';
    // Limpiamos subvistas abiertas: si no, al volver a entrar se aterrizaba en
    // el check de hábitos o el cuestionario de la sesión anterior.
    state.modoDemo = false; demoStore.clear();
    state.calShowHabits=false; state.calShowQuest=false; state.questWeek=null;
    state.editEntry=null; state.editTask=null; state._inAthleteDetail=false;
    state.openDays={}; state.calOffset=0; state.sessionWeek=null; state.sessionDay=null;
    stopSession();
    await safeSet('umbral-session', JSON.stringify({}), false);
    render();
  });
}

document.getElementById('themeToggle').addEventListener('click', ()=>{
  const isDark = document.body.classList.contains('theme-dark');
  document.body.classList.toggle('theme-dark', !isDark);
  document.body.classList.toggle('theme-light', isDark);
  document.getElementById('themeToggle').textContent = isDark ? '☀ Claro' : '☾ Oscuro';
  // Preferencia de ESTE dispositivo: no viaja a la nube, no depende de con
  // qué cuenta hayas entrado. Antes no se guardaba en ningún sitio y volvía
  // siempre a claro al cerrar la app.
  try{ localStorage.setItem('umbral-theme', isDark ? 'light' : 'dark'); }catch(e){}
  render();
});

function getScrollPos(){ return window.scrollY || document.documentElement.scrollTop || document.body.scrollTop || 0; }
function setScrollPos(y){
  window.scrollTo(0,y);
  document.documentElement.scrollTop = y;
  document.body.scrollTop = y;
}
function render(){
  const y = getScrollPos();
  const main = document.getElementById('main');
  const chip = document.getElementById('identityChip');
  const logout = document.getElementById('logoutBtn');
  const noticeSlot = document.getElementById('noticeSlot');
  if(state.loading){ main.innerHTML='<div class="empty">Cargando…</div>'; return; }

  // Modo formulario público: ?filtro=1 abre sólo el cuestionario, sin acceso
  // a ninguna otra parte de la app.
  if(state.modoFiltro){
    main.innerHTML = '<div class="empty">Cargando…</div>';
    document.getElementById('bottomNav').innerHTML = '';
    if(chip) chip.style.display = 'none';
    if(logout) logout.style.display = 'none';
    if(noticeSlot) noticeSlot.innerHTML = '';
    tplFormularioFiltro().then(h=>{
      main.innerHTML = h;
      bindFormularioFiltro();
    });
    return;
  }
  if(!state.authRole){
    main.innerHTML = renderGate();
    document.getElementById('bottomNav').innerHTML = '';
    if(chip) chip.style.display = 'none';
    if(logout) logout.style.display = 'none';
    if(noticeSlot) noticeSlot.innerHTML = '';
    const bt = document.getElementById('brandTag'); if(bt) bt.style.display = 'none';
    bindGateEvents();
    setScrollPos(0);
    return;
  }
  const bt = document.getElementById('brandTag'); if(bt) bt.style.display = '';

  if(chip){
    chip.style.display = '';
    if(state.authRole === 'coach') chip.textContent = state.previewing ? 'Vista de atleta' : 'Entrenador';
    else {
      const me = state.athletes.find(a=>a.id===state.athleteAsId);
      chip.textContent = me ? me.name : 'Atleta';
    }
  }
  if(logout) logout.style.display = '';
  if(noticeSlot && state.authRole==='coach' && !noticeSlot.innerHTML){
    noticeSlot.innerHTML = '<div class="notice"><b>Panel de entrenador.</b> Los atletas sólo ven su propio perfil al entrar con su PIN.</div>';
  }
  if(noticeSlot && state.authRole==='atleta') noticeSlot.innerHTML = '';
  if(noticeSlot && state.previewing){
    const me = state.athletes.find(a=>a.id===state.athleteAsId);
    noticeSlot.innerHTML = `<div class="notice" style="border-left-color:var(--accent);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">
      <span>Viendo la app como <b>${escapeHtml(me?me.name:'atleta')}</b>. Los cambios que hagas aquí se guardan de verdad.</span>
      <button class="btn small" id="exitPreviewBtn">Volver al panel</button></div>`;
    const ep = document.getElementById('exitPreviewBtn');
    if(ep) ep.addEventListener('click', ()=>{
      state.previewing = false; state.role='coach'; state.athleteAsId=null; state.tab='atletas';
      stopSession(); renderScrollTop();
    });
  }

  main.innerHTML = state.role==='coach' ? renderCoachShell() : renderAtletaShell();
  renderNav();
  bindShellEvents();
  maybeShowTutorial();
  setScrollPos(y);
  requestAnimationFrame(()=>{ setScrollPos(y); aplicarAnimacionEntrada(); });
}

function renderTutorial(){
  let ov = document.getElementById('tutorialOverlay');
  if(!ov){ ov = document.createElement('div'); ov.id='tutorialOverlay'; ov.className='tut-back'; document.body.appendChild(ov); }
  const i = state.tutorialStep || 0;
  const s = TUTORIAL_STEPS[i];
  const last = i === TUTORIAL_STEPS.length - 1;
  ov.innerHTML = `<div class="tut-card">
    <div class="tut-ic">${s.ic()}</div>
    <h2>${s.title}</h2>
    <p>${s.body}</p>
    <div class="tut-dots">${TUTORIAL_STEPS.map((_,n)=>`<i class="${n===i?'on':''}"></i>`).join('')}</div>
    <div class="tut-actions">
      ${i>0?'<button class="btn ghost" id="tutPrev">Atrás</button>':'<button class="btn ghost" id="tutSkip">Saltar</button>'}
      <button class="btn" id="tutNext">${last?'Empezar':'Siguiente'}</button>
    </div>
    ${!last && i>0 ? '<button class="tut-skip-link" id="tutSkip2">Saltar guía</button>' : ''}
  </div>`;
  const close = async ()=>{
    const id = state.athleteAsId;
    if(id) await safeSet('tutorial-'+id, 'done', true);
    state.showTutorial = false; state.tutorialStep = 0;
    const el = document.getElementById('tutorialOverlay'); if(el) el.remove();
  };
  const nx = document.getElementById('tutNext');
  if(nx) nx.addEventListener('click', ()=>{
    if(last) close();
    else { state.tutorialStep = i+1; renderTutorial(); }
  });
  const pv = document.getElementById('tutPrev');
  if(pv) pv.addEventListener('click', ()=>{ state.tutorialStep = i-1; renderTutorial(); });
  ['tutSkip','tutSkip2'].forEach(id=>{ const b=document.getElementById(id); if(b) b.addEventListener('click', close); });
}

async function maybeShowTutorial(){
  if(state.role !== 'atleta' || !state.athleteAsId) return;
  if(state.tab === 'intake') return;          // primero que rellene su ficha
  if(document.getElementById('tutorialOverlay')) return;
  if(state.showTutorial){ renderTutorial(); return; }
  const done = await safeGet('tutorial-'+state.athleteAsId, true);
  if(!done){ state.showTutorial = true; state.tutorialStep = 0; renderTutorial(); }
}

async function bindGateEvents(){
  document.querySelectorAll('[data-gate]').forEach(b=>b.addEventListener('click', ()=>{
    state.gateMode = b.dataset.gate; render();
  }));
  const backBtn = document.getElementById('gateBackBtn');
  if(backBtn) backBtn.addEventListener('click', ()=>{ state.gateMode = null; render(); });

  const coachEnter = document.getElementById('coachEnterBtn');
  const coachInput = document.getElementById('coachCodeInput');
  const tryCoach = async ()=>{
    const code = (coachInput.value||'').trim();
    if(!code){ toast('Introduce el código', true); return; }
    const real = await getCoachCode();
    if(code.toUpperCase() !== real.toUpperCase()){ toast('Código incorrecto', true); return; }
    state.authRole = 'coach'; state.role = 'coach'; state.tab = 'atletas'; state.gateMode = null;
    await safeSet('umbral-session', JSON.stringify({role:'coach'}), false);
    render();
  };
  if(coachEnter) coachEnter.addEventListener('click', tryCoach);
  if(coachInput) coachInput.addEventListener('keydown', e=>{ if(e.key==='Enter') tryCoach(); });

  const loginBtn = document.getElementById('loginBtn');
  const pinInput = document.getElementById('pinInput');
  const tryAthlete = async ()=>{
    try{
      const pin = (pinInput.value||'').trim();
      if(!pin){ toast('Introduce el PIN', true); return; }
      // Buscamos a quién corresponde el PIN: así ningún atleta ve la lista
      // de nombres de los demás.
      const a = state.athletes.find(x=>String(x.pin) === pin);
      // El atleta de muestra entra como cualquier otro, pero en modo aislado:
      // lee lo que tú hayas diseñado y nada de lo que toque queda guardado.
      if(a && a.esDemo) state.modoDemo = true;
      if(a){
        state.authRole = 'atleta'; state.role = 'atleta'; state.athleteAsId = a.id; state.gateMode = null;
        await safeSet('umbral-session', JSON.stringify({role:'atleta', athleteAsId:a.id}), false);
        const intakeRaw = await safeGet('intake-'+a.id, true);
        state.tab = intakeRaw ? 'rutina' : 'intake';
        render();
      } else toast('PIN incorrecto', true);
    }catch(e){ toast('Error al entrar: '+e.message, true); }
  };
  if(loginBtn) loginBtn.addEventListener('click', tryAthlete);
  if(pinInput) pinInput.addEventListener('keydown', e=>{ if(e.key==='Enter') tryAthlete(); });
}
function renderKeepScroll(){ render(); }
function renderScrollTop(){
  state._animarEntrada = true;          // sólo al cambiar de pantalla
  render();
  requestAnimationFrame(()=>setScrollPos(0));
}
// Marca la animación de entrada una sola vez, tras pintar.
function aplicarAnimacionEntrada(){
  if(!state._animarEntrada) return;
  state._animarEntrada = false;
  const el = document.getElementById('tabContent') || document.getElementById('main');
  if(!el) return;
  el.classList.remove('anim-in');
  void el.offsetWidth;
  el.classList.add('anim-in');
  setTimeout(()=>el.classList.remove('anim-in'), 400);
}
function toast(msg, isError){
  let t = document.getElementById('umbralToast');
  if(!t){ t=document.createElement('div'); t.id='umbralToast'; t.style.cssText='position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:200;padding:10px 18px;border-radius:8px;font-family:Manrope,sans-serif;font-weight:700;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,0.25);'; document.body.appendChild(t); }
  t.style.background = isError ? '#A83A2E' : 'var(--accent)';
  t.style.color = isError ? '#FFFFFF' : 'var(--on-accent)';
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>{ t.style.transition='opacity .4s'; t.style.opacity='0'; }, 1800);
}

function renderNav(){
  const nav = document.getElementById('bottomNav');
  if(state.role==='atleta'){
    if(!state.athleteAsId){ nav.innerHTML=''; return; }
    const items = [
      {key:'rutina', ic:icClipboard(), label:'Rutina'},
      {key:'diario', ic:icDumbbell(), label:'Sesión'},
      {key:'calendario', ic:icCalendar(), label:'Calendario'},
      {key:'progreso', ic:icChartUp(), label:'Progreso'},
      {key:'perfil', ic:icPerson(), label:'Perfil'}
    ];
    nav.innerHTML = items.map(it=>`<button data-navtab="${it.key}" class="${state.tab===it.key?'active':''}">${it.ic}${it.label}</button>`).join('');
  } else {
    // Resumen, Tareas y Calendario van juntos en "Agenda": los tres responden
    // a la misma pregunta ("¿qué tengo pendiente?") y separados obligaban a
    // saltar entre pestañas para hacerse una idea. Con seis ítems el menú no
    // cabía bien en móvil; con cuatro sí.
    const items = [
      {key:'atletas', ic:icPeople(), label:'Atletas'},
      {key:'agenda', ic:icCalendar(), label:'Agenda'},
      {key:'galeria', ic:icPlayCircle(), label:'Galería'},
      {key:'captacion', ic:icClipboard(), label:'Leads'}
    ];
    nav.innerHTML = items.map(it=>`<button data-navtab="${it.key}" class="${state.tab===it.key?'active':''}">${it.ic}${it.label}</button>`).join('');
  }
  nav.querySelectorAll('button').forEach(b=>b.addEventListener('click', ()=>{ state.tab=b.dataset.navtab; stopSession(); renderScrollTop(); }));
}

function renderAtletaShell(){
  if(!state.athleteAsId) return '<div class="card"><div class="empty">Sesión no válida. Pulsa «Salir» y vuelve a entrar.</div></div>';
  let html = '';
  if(state.tab==='intake') html += `<div id="tabContent" data-mode="intake" data-athlete="${state.athleteAsId}"></div>`;
  else html += `<div id="tabContent" data-athlete="${state.athleteAsId}"></div>`;

async function bindShellEvents(){
  const backupSlot = document.getElementById('backupSlot');
  if(backupSlot){
    backupSlot.innerHTML = await tplBackup();
    paintStorageHealth();
    const recuperar = document.getElementById('recuperarRutinasBtn');
    if(recuperar) recuperar.addEventListener('click', async ()=>{
      recuperar.textContent = 'Buscando…'; recuperar.disabled = true;
      const wk = weekOfISO();
      let recuperadas = 0, revisados = 0;
      const tiene = r => !!r && DAYS.some(d=>BLOCKS.some(b=>(r.days[d][b.key]||[]).length>0));
      for(const a of state.athletes){
        revisados++;
        for(const esBorrador of [false, true]){
          const legacyRaw = await safeGet((esBorrador?'routine-draft-':'routine-')+a.id, true);
          if(!legacyRaw) continue;
          let vieja = null;
          try{ vieja = normalizaRutina(JSON.parse(legacyRaw)); }catch(e){ continue; }
          if(!tiene(vieja)) continue;
          const actualRaw = await safeGet(routineKey(a.id, esBorrador, wk), true);
          let actual = null;
          try{ actual = actualRaw ? normalizaRutina(JSON.parse(actualRaw)) : null; }catch(e){}
          if(tiene(actual)) continue;             // ya hay algo: no lo pisamos
          vieja.weekOf = wk;
          const ok = await safeSet(routineKey(a.id, esBorrador, wk), JSON.stringify(vieja), true);
          if(ok) recuperadas++;
        }
      }
      toast(recuperadas
        ? `Recuperadas ${recuperadas} rutinas de ${revisados} atletas`
        : `Revisados ${revisados} atletas: no había nada antiguo que recuperar`);
      recuperar.textContent = 'Buscar y recuperar'; recuperar.disabled = false;
      render();
    });
    const saveCode = document.getElementById('saveCoachCodeBtn');
    if(saveCode) saveCode.addEventListener('click', async ()=>{
      const v = (document.getElementById('newCoachCode').value||'').trim();
      if(v.length < 4){ toast('Usa al menos 4 caracteres', true); return; }
      const ok = await safeSet('coach-code', v, true);
      toast(ok ? 'Código actualizado — apúntalo' : 'No se pudo guardar', !ok);
      if(ok) document.getElementById('newCoachCode').value = '';
    });
    const testBtn = document.getElementById('testStorageBtn');
    if(testBtn) testBtn.addEventListener('click', async ()=>{
      const r = await storageSelfTest();
      toast(r.ok ? 'Almacenamiento OK: ' + r.detail : 'Fallo: ' + r.detail, !r.ok);
      paintStorageHealth();
    });
    const box = document.getElementById('backupBox');
    const exportBtn = document.getElementById('exportBtn');
    if(exportBtn) exportBtn.addEventListener('click', async ()=>{
      exportBtn.textContent = 'Exportando…'; exportBtn.disabled = true;
      try{
        box.value = await exportAll();
        toast('Copia generada — cópiala y guárdala');
      }catch(e){ toast('No se pudo exportar: '+e.message, true); }
      exportBtn.textContent = 'Exportar datos'; exportBtn.disabled = false;
    });
    const copyBtn = document.getElementById('copyBackupBtn');
    if(copyBtn) copyBtn.addEventListener('click', async ()=>{
      if(!box.value.trim()){ toast('Genera la copia primero', true); return; }
      try{
        if(navigator.clipboard && navigator.clipboard.writeText) await navigator.clipboard.writeText(box.value);
        else { box.select(); document.execCommand('copy'); }
        toast('Copiado al portapapeles');
      }catch(e){ box.select(); toast('Selecciona y copia manualmente', true); }
    });
    const importBtn = document.getElementById('importBtn');
    if(importBtn) importBtn.addEventListener('click', async ()=>{
      if(!box.value.trim()){ toast('Pega primero una copia', true); return; }
      importBtn.textContent = 'Restaurando…'; importBtn.disabled = true;
      try{
        const n = await importAll(box.value);
        await loadAthletes();
        state.selectedId = state.athletes.length ? state.athletes[0].id : null;
        toast(`Restaurado: ${n} registros, ${state.athletes.length} atletas`);
        render();
      }catch(e){ toast('No se pudo restaurar: '+e.message, true); }
      importBtn.textContent = 'Restaurar desde la copia pegada'; importBtn.disabled = false;
    });
  }
  // Crea el atleta de muestra con una semana ya diseñada. A partir de ahí es un
  // atleta normal: lo editas como cualquier otro y quien lo pruebe verá tu
  // versión, sin poder ensuciarla.
  const crearDemo = document.getElementById('crearDemoBtn');
  if(crearDemo) crearDemo.addEventListener('click', async ()=>{
    crearDemo.textContent = 'Creando…'; crearDemo.disabled = true;
    try{
      const usados = new Set(state.athletes.map(a=>String(a.pin)));
      if(usados.has(DEMO_PIN)){ toast('El PIN 0000 ya está en uso por otro atleta', true); return; }
      const nuevo = { id: DEMO_ID, name: 'Atleta de muestra', pin: DEMO_PIN, esDemo: true };
      state.athletes.push(nuevo);
      await safeSet('athletes-list', JSON.stringify(state.athletes), true);
      const r = rutinaDemo();
      await safeSet(routineKey(DEMO_ID, false, weekOfISO()), JSON.stringify(r), true);
      await safeSet(routineKey(DEMO_ID, true, weekOfISO()), JSON.stringify(r), true);
      await safeSet('intake-'+DEMO_ID, JSON.stringify({ edad:'30', genero:'', peso:'72', altura:'176',
        contacto:'', aniosExperiencia:'4',
        historial:'Corredor popular que ha añadido fuerza los dos últimos años.',
        objetivos:'Mejorar en Hyrox sin perder velocidad en carrera.', disponibilidad:'5',
        franjas:'Mañanas entre semana, sábado libre',
        lesiones:'Molestia antigua en rodilla derecha, sin lesión activa',
        comoLlego:'Recomendación', material:'Gimnasio completo' }), true);
      await safeSet('profile-'+DEMO_ID, JSON.stringify({ estado:'Activo', tarifa:'90', pagado:'Sí',
        vence:'', plaza:'Ejemplo', alta:'', notas:'Atleta de muestra para enseñar la app.' }), true);
      await safeSet('journal-'+DEMO_ID, JSON.stringify(diarioDemo()), true);
      await safeSet('habits-config-'+DEMO_ID, JSON.stringify(habitosDemo()), true);
      await safeSet('habits-'+DEMO_ID, JSON.stringify(habitosLogDemo()), true);
      await safeSet('quest-config-'+DEMO_ID, JSON.stringify(['sleep_quality','fatigue_accum','motivation','pain_unusual']), true);
      toast('Atleta de muestra creado · PIN ' + DEMO_PIN);
      renderScrollTop();
    }catch(e){ toast('No se pudo crear: '+e.message, true); }
    crearDemo.textContent = 'Crear atleta de muestra'; crearDemo.disabled = false;
  });

  const addBtn = document.getElementById('addAthleteBtn');
  if(addBtn) addBtn.addEventListener('click', async ()=>{
    const nameInput = document.getElementById('newAthleteName');
    const name = nameInput.value.trim(); if(!name) return;
    // Con acceso sólo por PIN, dos PINs iguales dejarían a un atleta entrar en
    // el perfil de otro. Generamos uno que no exista ya.
    const usados = new Set(state.athletes.map(a=>String(a.pin)));
    let pin = null;
    for(let i=0;i<9000;i++){
      const c = String(Math.floor(1000+Math.random()*9000));
      if(!usados.has(c)){ pin = c; break; }
    }
    if(!pin){ toast('No quedan PINs libres de 4 dígitos', true); return; }
    const modalidad = (document.getElementById('newAthleteModalidad')||{}).value || 'gym';
    const newAthlete = { id: uid(), name, pin, modalidad };
    state.athletes.push(newAthlete);
    const ok = await safeSet('athletes-list', JSON.stringify(state.athletes), true);
    toast(ok ? `${name} añadido · PIN ${pin}` : 'No se pudo guardar', !ok);
    render();
  });
  const previewBtn = document.getElementById('previewAsAthleteBtn');
  if(previewBtn) previewBtn.addEventListener('click', ()=>{
    const id = document.getElementById('previewAthleteSel').value;
    state.previewing = true;             // seguimos siendo entrenador por debajo
    state.role = 'atleta'; state.athleteAsId = id; state.tab = 'rutina';
    stopSession();
    renderScrollTop();
  });

  document.querySelectorAll('[data-openathlete]').forEach(b=>b.addEventListener('click', ()=>{
    state.selectedId = b.dataset.openathlete; state._inAthleteDetail = true; state.athleteSubTab='planificacion'; state.planOffset = 0; state.openDays = {}; renderScrollTop();
  }));
  await renderTabContent();
}

async function renderTabContent(){
  const el = document.getElementById('tabContent'); if(!el) return;
  const mode = el.dataset.mode;
  const token = ++_renderToken;

  // No vaciamos la pantalla mientras cargamos: dejar el contenido anterior a la
  // vista evita el parpadeo en cada toque. Sólo si tarda de verdad avisamos.
  const lento = setTimeout(()=>{ if(token === _renderToken) el.classList.add('cargando'); }, 260);

  let html = '';
  try{
    if(mode==='galeria-coach') html = await tplGaleriaCoach();
    if(mode==='agenda') html = await tplAgenda();
    if(mode==='captacion') html = await tplCaptacion();
    if(mode==='resumen') html = await tplResumen();
    else if(mode==='calendario-coach') html = await tplCalendarioCoach();
    else if(mode==='tareas') html = await tplTareas();
    else if(mode==='athlete-detail') html = await tplAthleteDetail(el.dataset.athlete);
    else if(mode==='intake') html = await tplIntake(el.dataset.athlete);
    else {
      const athleteId = el.dataset.athlete;
      if(state.tab==='rutina') html = await tplRutinaAtleta(athleteId);
      else if(state.tab==='diario') html = await tplSesionEntry(athleteId);
      else if(state.tab==='calendario') html = await tplCalendarioAtleta(athleteId);
      else if(state.tab==='progreso') html = await tplProgreso(athleteId);
      else if(state.tab==='perfil'){
        if(state.verTests) html = await tplTestsAtleta(athleteId);
        else if(state.verGym) html = await tplGym(athleteId, false);
        else if(state.verFotos) html = await tplProgresoFotos(athleteId, false);
        else html = await tplPerfilAtleta(athleteId);
      }
    }
  }catch(e){
    html = `<div class="card"><div class="empty">No se pudo cargar esta pantalla. ${escapeHtml(e.message||'')}</div></div>`;
  }
  clearTimeout(lento);
  // Si mientras cargábamos el usuario ya se fue a otro sitio, descartamos.
  if(token !== _renderToken) return;
  el.classList.remove('cargando');
  el.innerHTML = tplDemoAviso() + html;
  bindDynamicEvents();
  renderNav();
  if(session && session.fullscreen) mountSessionOverlay(state.athleteAsId || state.selectedId);
}

async function tplIntake(athleteId){
  let html = `<div class="card"><h2>Antes de empezar — cuéntame sobre ti</h2>
    <p style="font-size:12.5px;color:var(--muted);margin-bottom:16px;">Esto ayuda a tu entrenador a diseñar tu plan desde el primer día.</p>`;
  let lastGroup = '';
  INTAKE_FIELDS.forEach(f=>{
    if(f.group !== lastGroup){ html += `<div class="q-cat">${f.group}</div>`; lastGroup = f.group; }
    html += `<div class="q-item" style="margin-bottom:16px;"><label class="field-label">${f.label}</label>`;
    if(f.type==='select') html += `<select data-intake="${f.id}" style="width:100%;"><option value="">Selecciona…</option>${f.options.map(o=>`<option value="${o}">${o}</option>`).join('')}</select>`;
    else if(f.type==='textarea') html += `<textarea data-intake="${f.id}" style="min-height:56px;"></textarea>`;
    else html += `<input type="${f.type}" data-intake="${f.id}" style="width:100%;">`;
    html += `</div>`;
  });
  html += `<button class="btn" id="submitIntake">Guardar y continuar</button></div>`;
  return html;
}

// ---------- ROUTINE HELPERS ----------
// ---------- RUTINAS POR SEMANA ----------
// Cada semana natural tiene su propia clave, así se pueden preparar semanas
// futuras sin pisar la que está en curso. Las rutinas antiguas (sin semana)
// se migran solas a la semana actual la primera vez que se abren.
const TURNOS = ['', 'Mañana', 'Tarde'];
function lunesDe(fechaISO){
  const d = new Date(fechaISO + 'T00:00:00');
  const day = d.getDay() || 7;
  d.setDate(d.getDate() - day + 1);
  return fechaLocalISO(d);
}
function semanaDesplazada(offset){
  const d = new Date(weekOfISO() + 'T00:00:00');
  d.setDate(d.getDate() + (offset||0)*7);
  return fechaLocalISO(d);
}
function routineKey(athleteId, draft, weekOf){
  const base = draft ? 'routine-draft-' : 'routine-';
  return base + athleteId + '-w' + weekOf;
}
function estructuraVacia(){
  const days = {};
  DAYS.forEach(d=>{ days[d] = {}; BLOCKS.forEach(b=>{ days[d][b.key] = []; }); });
  return { days };
}
function normalizaRutina(r){
  if(!r || typeof r !== 'object') r = {};
  if(!r.days) r.days = {};
  DAYS.forEach(d=>{
    if(!r.days[d]) r.days[d] = {};
    BLOCKS.forEach(b=>{ if(!Array.isArray(r.days[d][b.key])) r.days[d][b.key] = []; });
  });
  return r;
}
async function getRoutine(athleteId, draft, weekOf){
  const semana = weekOf || state.planWeek || weekOfISO();
  const raw = await safeGet(routineKey(athleteId, draft, semana), true);
  let actual = null;
  if(raw){ try{ actual = normalizaRutina(JSON.parse(raw)); }catch(e){} }
  const tieneContenido = r => !!r && DAYS.some(d=>BLOCKS.some(b=>(r.days[d][b.key]||[]).length>0));
  if(tieneContenido(actual)) return actual;

  // Rescate de claves desplazadas un día: un fallo de zona horaria hizo que
  // algunas semanas se guardaran etiquetadas con el sábado o el domingo
  // anterior. Si la clave correcta está vacía, miramos esos dos vecinos.
  for(const desfase of [-1, -2]){
    const v = new Date(semana + 'T00:00:00');
    v.setDate(v.getDate() + desfase);
    const claveVecina = routineKey(athleteId, draft, fechaLocalISO(v));
    const rawV = await safeGet(claveVecina, true);
    if(!rawV) continue;
    try{
      const rv = normalizaRutina(JSON.parse(rawV));
      if(tieneContenido(rv)){
        rv.weekOf = semana;
        await safeSet(routineKey(athleteId, draft, semana), JSON.stringify(rv), true);
        return rv;
      }
    }catch(e){}
  }

  // Migración del formato antiguo. Antes sólo actuaba si la clave de la semana
  // no existía; bastaba con que se hubiera creado vacía para que la migración
  // quedara bloqueada y las rutinas parecieran perdidas.
  if(semana === weekOfISO()){
    const legacy = await safeGet((draft?'routine-draft-':'routine-')+athleteId, true);
    if(legacy){
      try{
        const r = normalizaRutina(JSON.parse(legacy));
        if(tieneContenido(r)){
          r.weekOf = semana;
          await safeSet(routineKey(athleteId, draft, semana), JSON.stringify(r), true);
          return r;
        }
      }catch(e){}
    }
  }
  if(actual) return actual;
  const vacia = normalizaRutina(estructuraVacia());
  vacia.weekOf = semana;
  return vacia;
}
async function saveRoutine(athleteId, draft, rutina, weekOf){
  // Prioridad: la semana explícita del parámetro, luego la que la PANTALLA
  // tiene abierta ahora (state.planWeek). La etiqueta interna de la rutina va
  // la última: si quedó obsoleta, podía "secuestrar" guardados futuros hacia
  // una semana que ya no se estaba viendo, sin ningún aviso.
  const semana = weekOf || state.planWeek || rutina.weekOf || weekOfISO();
  rutina.weekOf = semana;
  rutina.updatedAt = new Date().toISOString();
  return safeSet(routineKey(athleteId, draft, semana), JSON.stringify(rutina), true);
}

function habitosLogDemo(){

// 1RM estimado. Brzycki y Epley coinciden casi exactamente en el rango 1-6;
// en 6 repeticiones Brzycki es algo más conservador, que es lo que interesa
// para programar cargas. Promediamos ambas para no heredar el sesgo de una.
function estima1RM(peso, reps){
  const w = parseFloat(peso), r = parseInt(reps,10);
  if(isNaN(w) || isNaN(r) || w<=0 || r<1 || r>12) return null;
  if(r === 1) return w;
  const brzycki = w * 36 / (37 - r);
  const epley   = w * (1 + r/30);
  return Math.round(((brzycki + epley) / 2) * 10) / 10;
}

// Estándares de fuerza como múltiplo del peso corporal. Son referencias de
// uso común en la comunidad (no un consenso científico): sirven para orientar,
// no para juzgar. Mujeres ~80% en tren inferior y ~65% en tren superior.
// Cada array es el umbral MÍNIMO para entrar en ese nivel, en el mismo orden
// que NIVELES_FUERZA. El primer valor es el mínimo de "Principiante", así que
// alcanzar el umbral de un nivel te coloca EN ese nivel, no en el siguiente.
const ESTANDARES_FUERZA = {
  //            Princip. Novel  Interm. Avanz.  Élite
  sentadilla: { hombre:[0.75,  1.25,  1.5,    2.0,   2.5],
                mujer: [0.60,  1.00,  1.25,   1.6,   2.0] },
  banca:      { hombre:[0.50,  0.75,  1.0,    1.5,   2.0],
                mujer: [0.35,  0.50,  0.75,   1.0,   1.3] },
  muerto:     { hombre:[1.00,  1.50,  2.0,    2.5,   3.0],
                mujer: [0.80,  1.20,  1.5,    2.0,   2.5] }
};
const NIVELES_FUERZA = ['Principiante','Novel','Intermedio','Avanzado','Élite'];
function nivelFuerza(lift, unRM, pesoCorporal, genero){
  const est = ESTANDARES_FUERZA[lift];
  if(!est || !unRM || !pesoCorporal) return null;
  const clave = (genero||'').toLowerCase().startsWith('mujer') ? 'mujer' : 'hombre';
  const umbrales = est[clave];
  const ratio = unRM / pesoCorporal;
  // El nivel es el del umbral más alto que se alcanza; por debajo del primero,
  // aún está construyendo base.
  let idx = -1;
  umbrales.forEach((u,i)=>{ if(ratio >= u) idx = i; });
  const nivel = idx < 0 ? 'Construyendo base' : NIVELES_FUERZA[idx];
  return { nivel, ratio: Math.round(ratio*100)/100, clave };
}

// Devuelve la estimación de un test ya rellenado, o null si no aplica.
function estimacionDeTest(test, resultado, intake){
  if(!test || !resultado) return null;
  if(test.lift){
    const unRM = estima1RM(resultado.peso, resultado.reps);
    if(!unRM) return null;
    const pc = parseFloat(intake && intake.peso);
    const nf = nivelFuerza(test.lift, unRM, pc, intake && intake.genero);
    return {
      titular: `1RM estimado: ${unRM} kg`,
      nivel: nf ? nf.nivel.toLowerCase().includes('base') ? 'medio' : 'bueno' : 'medio',
      texto: nf
        ? `Equivale a ${nf.ratio}× tu peso corporal, lo que se sitúa en el nivel ${nf.nivel.toLowerCase()}. Es una referencia orientativa de uso común, no un consenso científico: la edad, las palancas y tu historial mueven mucho esa cifra.`
        : 'Para situarlo por nivel necesito tu peso corporal en la ficha inicial.'
    };
  }
  if(typeof test.estima === 'function'){
    const e = test.estima(resultado);
    if(!e) return null;
    return { titular:null, nivel:e.nivel, texto:e.texto };
  }
  return null;
}

// Sube una foto o un vídeo al almacén. Reutiliza el bucket de vídeos, que ya
// está configurado; las fotos pesan poquísimo comparadas con el vídeo.
async function subirArchivoGym(file){
  if(!file) throw new Error('no hay archivo');
  const esVideo = (file.type||'').startsWith('video');
  const maxMB = esVideo ? MAX_VIDEO_MB : 8;
  const mb = file.size / (1024*1024);
  if(mb > maxMB) throw new Error(`pesa ${mb.toFixed(1)} MB (máximo ${maxMB})`);
  const ext = (file.name.split('.').pop() || (esVideo?'mp4':'jpg')).toLowerCase().replace(/[^a-z0-9]/g,'');
  const path = 'gym/' + Date.now() + '-' + uid() + '.' + ext;
  const r = await fetch(SUPA_URL + '/storage/v1/object/' + VIDEO_BUCKET + '/' + path, {
    method:'POST',
    headers:{ 'apikey':SUPA_KEY, 'Authorization':'Bearer '+SUPA_KEY, 'Content-Type': file.type || (esVideo?'video/mp4':'image/jpeg') },
    body:file
  });
  if(!r.ok){
    let detalle = 'HTTP ' + r.status;
    try{ const j = await r.json(); if(j && j.message) detalle = j.message; }catch(e){}
    if(r.status === 404) detalle = 'falta crear el almacén en Supabase';
    throw new Error(detalle);
  }
  return { id:uid(), tipo: esVideo?'video':'foto', url: videoPublicUrl(path), path,
           nombre: file.name.replace(/\.[^.]+$/,'').slice(0,40), fecha: todayISO() };
}

    puntos:{ 'Sí, encaja':10, 'Me encaja pero necesito ajustar fechas':7,
             'Me parece caro, quiero saber más':4, 'No es mi momento':1 },
    eje:'potencial' }
];

// Calcula las dos puntuaciones y marca qué necesita que lo leas tú.
function evaluaRespuesta(resp, preguntas){
  preguntas = preguntas || FILTRO_PREGUNTAS;
  const ejes = { potencial:[], alineacion:[] };
  const revisar = [];

  preguntas.forEach(q=>{
    if(!q.eje) return;
    const v = resp[q.id];
    const esOtro = resp[q.id+'__otro'];

    // Texto libre o respuesta "Otro": no se puntúa sola, la lees tú.
    if(esOtro || (q.revisionManual && v)){
      revisar.push({ id:q.id, label:q.label, valor: esOtro || v });
      return;
    }
    if(v === undefined || v === '' || v === null) return;

    if(q.tipo==='escala' && q.pesoEscala){
      ejes[q.eje].push(Math.max(1, Math.min(10, parseInt(v,10)||1)));
      return;
    }
    if(q.puntosTexto){
      ejes[q.eje].push(String(v).trim() ? q.puntosTexto.conTexto : q.puntosTexto.vacio);
      return;
    }
    if(q.tipo==='multi' && Array.isArray(v) && v.length){
      // Nos quedamos con el mejor material disponible, no con la media.
      const mejor = Math.max(...v.map(o=>(q.puntos&&q.puntos[o])||5));
      ejes[q.eje].push(mejor);
      return;
    }
    if(q.puntos && q.puntos[v] !== undefined){
      ejes[q.eje].push(q.puntos[v]);
      return;
    }
    if(q.tipo==='texto' && String(v).trim()){
      revisar.push({ id:q.id, label:q.label, valor:v });
    }
  });

  const media = arr => arr.length ? Math.round((arr.reduce((a,b)=>a+b,0)/arr.length)*10)/10 : null;
  return {
    potencial: media(ejes.potencial),
    alineacion: media(ejes.alineacion),
    revisar
  };
}

// Prioridad de la llamada de venta. Una alineación baja pesa más que un
// potencial alto: alguien que paga pero no sigue el método acaba yéndose.
function prioridadLead(ev){
  const p = ev.potencial, a = ev.alineacion;
  if(p === null || a === null) return { nivel:'incompleto', texto:'Respuestas incompletas' };
  if(a < 5) return { nivel:'baja', texto:'Poco alineado con tu forma de trabajar, aunque pudiera pagarlo. Antes de invertir tiempo, valora si merece la llamada.' };
  if(p >= 8 && a >= 8) return { nivel:'alta', texto:'Encaja bien por objetivo y por forma de trabajar. Prioriza esta llamada.' };
  if(p >= 6 && a >= 6) return { nivel:'media', texto:'Encaje razonable. Merece la llamada, con alguna cosa que aclarar.' };
  return { nivel:'baja', texto:'Encaje flojo. Lee sus respuestas antes de decidir.' };
}

const GRUPO_TIPOS = { superserie:'Superserie', triserie:'Triserie', circuito:'Circuito' };

  const base = GRUPO_TIPOS[tipo] || 'Combinada';

// Agrupa una lista respetando el orden: los sueltos van solos.
function agrupaEjercicios(lista){
  const salida = [];
  let actual = null;
  (lista||[]).forEach(ex=>{
    const gid = ex.grupoId || '';
    if(gid && actual && actual.grupoId === gid){
      actual.ejercicios.push(ex);
      return;
    }
    actual = { grupoId: gid, tipo: gid ? (ex.grupoTipo||'superserie') : null, ejercicios:[ex] };
    salida.push(actual);
  });
  return salida;
}
// Grupos ya existentes en un bloque, para poder añadirse a uno.
function gruposDeBloque(lista){
  const vistos = new Map();
  (lista||[]).forEach(ex=>{
    if(!ex.grupoId) return;
    if(!vistos.has(ex.grupoId)) vistos.set(ex.grupoId, { id:ex.grupoId, tipo:ex.grupoTipo||'superserie', n:0, nombres:[] });
    const g = vistos.get(ex.grupoId);
    g.n++; if(ex.name) g.nombres.push(ex.name);
  });
  return [...vistos.values()];
}

// Localiza en qué microciclo del plan cae una fecha dada.
async function currentMicro(athleteId, refDate){
  const plan = await getPlan(athleteId);
  const ref = refDate ? new Date(refDate+'T00:00:00') : new Date();
  let upcoming = null;
  for(const macro of plan.macros){
    if(!macro.startDate) continue;
    const start = new Date(macro.startDate+'T00:00:00');
    const diffWeeks = Math.floor((ref - start)/(7*86400000));
    if(diffWeeks >= 0 && diffWeeks < macro.micros.length){
      const m = macro.micros[diffWeeks];
      const wStart = new Date(start); wStart.setDate(wStart.getDate()+diffWeeks*7);
      const wEnd = new Date(wStart); wEnd.setDate(wEnd.getDate()+6);
      let comp = null, dias = null;
      (macro.competitions||[]).forEach(c=>{
        if(!c.date) return;
        const d = Math.ceil((new Date(c.date+'T00:00:00') - ref)/86400000);
        if(d >= 0 && (dias===null || d < dias)){ dias = d; comp = c; }
      });
      return { macro, micro:m, index:diffWeeks, total:macro.micros.length, wStart, wEnd, comp, dias };
    }
    if(start > ref){
      const d = Math.ceil((start - ref)/86400000);
      if(!upcoming || d < upcoming.dias) upcoming = { macro, start, dias:d };
    }
  }
  return upcoming ? { upcoming } : null;
}
