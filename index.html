    <div class="q-item"><p>Fecha (sábado de esta semana)</p><input type="date" id="questDateInput" value="${existing && existing.date ? existing.date : saturdayOfWeek()}"></div>`;
  active.forEach(qid=>{
    const q = QUESTION_BANK.find(x=>x.id===qid); if(!q) return;
    const val = existing && existing.answers ? existing.answers[qid] : null;
    const note = existing && existing.notes ? existing.notes[qid] : '';
    if(q.type==='text'){
      html += `<div class="q-item"><p>${q.text}</p><textarea data-qtext="${q.id}" style="min-height:44px;">${val?escapeHtml(val):''}</textarea></div>`;
    } else if(q.type==='scale_dynamic'){
      html += `<div class="q-item"><p>${q.text}</p><div class="scale" data-qscale="${q.id}">`;
      for(let n=1;n<=planned;n++) html += `<button data-val="${n}" class="${val===n?'sel':''}">${n}/${planned}</button>`;
      html += `</div></div>`;
    } else {
      html += `<div class="q-item"><p>${q.text}</p><div class="scale" data-qscale="${q.id}">`;
      for(let n=1;n<=5;n++) html += `<button data-val="${n}" class="${val===n?'sel':''}">${n}</button>`;
      html += `</div><div class="scale-labels"><span>1 · ${q.labels[0]}</span><span>5 · ${q.labels[1]}</span></div>
        <div class="q-note"><textarea data-qnote="${q.id}" placeholder="Notas adicionales (opcional)">${note?escapeHtml(note):''}</textarea></div></div>`;
    }
  });
  html += `<button class="btn" id="submitQuest">Enviar cuestionario</button></div>`;
  return html;
}

// ---------- PROGRESO ----------
async function tplProgreso(athleteId){
  const raw = await safeGet('journal-'+athleteId, true);
  const entries = raw ? JSON.parse(raw) : [];
  let html = `<div class="card"><h2>Progreso</h2>`;
  if(entries.length < 2){ html += `<div class="empty">Necesitas al menos 2 sesiones registradas para ver tendencias.</div></div>`; return html; }
  const now = new Date();
  const sum7 = entries.filter(e=>(now-new Date(e.date))/86400000<=7).reduce((a,e)=>a+e.fatigueScore,0);
  const sum28 = entries.filter(e=>(now-new Date(e.date))/86400000<=28).reduce((a,e)=>a+e.fatigueScore,0);
  const chronicWeekly = sum28/4;

  // El ACWR compara la semana actual con la media del último mes. Con menos de
  // 3 semanas de historial el denominador es tan pequeño que da cifras
  // disparatadas (2 sesiones bastan para un "4.00 · riesgo elevado" falso),
  // así que no se muestra hasta tener base suficiente.
  const oldest = entries.reduce((a,e)=>{ const d=new Date(e.date+'T00:00:00'); return (!a||d<a)?d:a; }, null);
  const diasHistorial = oldest ? Math.floor((now-oldest)/86400000) : 0;
  const semanasConDatos = new Set(entries
    .filter(e=>(now-new Date(e.date))/86400000<=28)
    .map(e=>{ const d=new Date(e.date+'T00:00:00'); const day=d.getDay()||7; d.setDate(d.getDate()-day+1); return d.toISOString().slice(0,10); })).size;
  const acwrFiable = diasHistorial >= 21 && semanasConDatos >= 3 && chronicWeekly > 0;

  let acwrVal = '—', flagText = 'sin datos suficientes', acwrNota = '';
  if(acwrFiable){
    const r = sum7/chronicWeekly;
    acwrVal = r.toFixed(2);
    // Cruzamos con la periodización: una descarga planificada no es un problema.
    const info = await currentMicro(athleteId);
    const intensidadPlan = (info && info.micro) ? info.micro.intensity : null;
    if(r < 0.8){
      if(intensidadPlan === 1){ flagText = 'descarga planificada'; acwrNota = 'Carga baja porque la semana es de descarga. Es lo previsto.'; }
      else if(intensidadPlan === null){ flagText = 'carga baja'; acwrNota = 'Estás por debajo de tu media del último mes. No hay microciclo activo con el que contrastarlo: si es una descarga buscada, ignóralo.'; }
      else { flagText = 'carga baja'; acwrNota = 'Estás entrenando por debajo de tu media del último mes.'; }
    } else if(r > 1.3){
      if(intensidadPlan === 4){ flagText = 'pico planificado'; acwrNota = 'Subida fuerte, coherente con una semana de pico. Vigila las sensaciones.'; }
      else if(intensidadPlan === null){ flagText = 'subida brusca'; acwrNota = 'La carga ha subido más rápido que tu adaptación. Sin microciclo activo no puedo saber si estaba previsto.'; }
      else { flagText = 'subida brusca'; acwrNota = 'La carga ha subido más rápido que tu adaptación. Asociado a más riesgo de lesión.'; }
    } else { flagText = 'zona óptima'; }
  } else {
    acwrNota = `Necesita 3 semanas de registro para ser fiable (llevas ${semanasConDatos} de las últimas 4).`;
  }

  const avgOverallRPE = (entries.reduce((a,e)=>a+e.overallRPE,0)/entries.length).toFixed(1);
  // Las entradas antiguas (o importadas) pueden no traer las cuatro escalas de
  // bienestar. Promediamos sólo las que existan y descartamos las que no tengan
  // ninguna, en vez de arrastrar un NaN por toda la pantalla.
  const wellnessOf = e => {
    const vals = [e.fatiga, e.calidad, e.hidratacion, e.satisfaccion]
      .filter(v => typeof v === 'number' && !isNaN(v));
    return vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null;
  };
  const wellVals = entries.map(wellnessOf).filter(v => v !== null);
  const avgWellness = wellVals.length ? (wellVals.reduce((a,b)=>a+b,0)/wellVals.length).toFixed(1) : '—';
  html += `<div class="kpi-row">
    <div class="kpi"><b>${sum7.toFixed(0)}</b><span>Carga 7 días</span></div>
    <div class="kpi"><b>${acwrVal}</b><span>ACWR · ${flagText}</span></div>
    <div class="kpi"><b>${avgOverallRPE}</b><span>RPE medio</span></div>
    <div class="kpi"><b>${avgWellness}/5</b><span>Bienestar</span></div>
  </div>
  ${acwrNota?`<div style="font-size:12px;color:var(--muted);margin:-6px 0 14px;line-height:1.5;">${acwrNota}</div>`:''}`;
  // Con muchas sesiones las barras quedarían de menos de 2px. Mostramos las
  // últimas 30, que es lo que de verdad se lee en un móvil.
  // Reparto por tipo de sesión en los últimos 28 días
  const desde = new Date(); desde.setDate(desde.getDate()-28);
  const ult28 = entries.filter(e=>new Date(e.date+'T00:00:00') >= desde);
  if(ult28.length){
    const cuenta = {}, cargaPorTipo = {};
    ult28.forEach(e=>{
      const t = tipoDeSesion(e);
      cuenta[t] = (cuenta[t]||0)+1;
      cargaPorTipo[t] = (cargaPorTipo[t]||0) + (e.fatigueScore||0);
    });
    const tipos = Object.keys(cuenta).sort((a,b)=>cuenta[b]-cuenta[a]);
    const maxC = Math.max(...tipos.map(t=>cuenta[t]),1);
    html += `<div style="background:var(--panel2);border-radius:8px;padding:14px;margin-bottom:12px;">
      <div style="font-size:11px;color:var(--muted);margin-bottom:10px;">Reparto por tipo de sesión · últimos 28 días (${ult28.length} sesiones)</div>`;
    tipos.forEach(t=>{
      const pct = (cuenta[t]/maxC)*100;
      html += `<div class="hstat" style="margin-bottom:10px;">
        <div class="hstat-top"><span>${escapeHtml(t)}</span><b>${cuenta[t]} ${cuenta[t]===1?'sesión':'sesiones'}</b></div>
        <div class="hstat-bar"><i style="width:${pct.toFixed(0)}%;"></i></div>
        <div class="hstat-sub">carga acumulada ${cargaPorTipo[t].toFixed(0)}</div>
      </div>`;
    });
    html += `</div>`;
  }

  const MAX_BARRAS = 30;
  const recientes = entries.slice(-MAX_BARRAS);
  const loads = recientes.map(e=>e.fatigueScore); const maxLoad = Math.max(...loads,1);
  html += `<div style="background:var(--panel2);border-radius:8px;padding:14px;margin-bottom:12px;"><div style="font-size:11px;color:var(--muted);margin-bottom:8px;">Carga de entrenamiento por sesión (sRPE)${entries.length>MAX_BARRAS?` · últimas ${MAX_BARRAS} de ${entries.length}`:''}</div>
    <div style="display:flex;align-items:flex-end;gap:3px;height:80px;">${loads.map(l=>`<div style="flex:1;min-width:3px;background:var(--accent);border-radius:2px 2px 0 0;height:${Math.max(4,(l/maxLoad)*80)}px;"></div>`).join('')}</div></div>`;
  const wellPoints = entries.map(wellnessOf).map((v,i)=>({v,i})).filter(p=>p.v!==null);
  const w=560,h=110,pad=16;
  if(wellPoints.length >= 2){
    const denom = entries.length > 1 ? entries.length-1 : 1;
    const pts = wellPoints.map(p=>{
      const x = pad + (p.i/denom)*(w-2*pad);
      const y = h-pad - ((p.v-1)/4)*(h-2*pad);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(' ');
    html += `<div style="background:var(--panel2);border-radius:8px;padding:14px;"><div style="font-size:11px;color:var(--muted);margin-bottom:8px;">Bienestar compuesto (tendencia)</div>
      <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;"><polyline points="${pts}" style="fill:none;stroke:var(--accent);stroke-width:2.5;"/></svg></div>`;
  } else {
    html += `<div style="background:var(--panel2);border-radius:8px;padding:14px;"><div style="font-size:11px;color:var(--muted);">Bienestar compuesto</div>
      <div class="empty">Hacen falta al menos dos sesiones con el diario completo.</div></div>`;
  }
  html += `</div>`;
  return html;
}

// ---------- PERFIL (atleta, propio) ----------
// Orientación de recuperación tras la sesión. Deliberadamente cualitativa: las
// fórmulas que dan "X horas exactas" a partir del sRPE tienen respaldo débil y
// varían mucho entre personas, así que damos pautas, no cifras falsas.
function guiaRecuperacion(carga, rpe, minutos){
  let nivel, titulo, pautas;
  if(carga < 250 || rpe <= 4){
    nivel='suave'; titulo='Carga ligera';
    pautas = ['Puedes entrenar mañana con normalidad.','Suficiente con tu rutina habitual de sueño e hidratación.'];
  } else if(carga < 500 || rpe <= 6){
    nivel='moderada'; titulo='Carga moderada';
    pautas = ['Mañana puedes volver a entrenar, mejor si es otro patrón o grupo muscular.','Come algo con proteína en las próximas 2 horas.','Duerme tus horas habituales.'];
  } else if(carga < 800 || rpe <= 8){
    nivel='alta'; titulo='Carga alta';
    pautas = ['Deja al menos 24 h antes de repetir un estímulo similar.','Prioriza sueño: es donde de verdad se adapta el cuerpo.','Proteína e hidratación en las próximas horas.','Si mañana entrenas, que sea suave o de otro patrón.'];
  } else {
    nivel='muy alta'; titulo='Carga muy alta';
    pautas = ['Deja 48 h antes de repetir un estímulo parecido.','El sueño de esta noche es lo más determinante para recuperarte.','Cuida la comida posterior: proteína e hidratos.','Mañana, descanso activo o movilidad.','Si aparece dolor articular o el sueño empeora, coméntaselo a tu entrenador.'];
  }
  return {nivel, titulo, pautas};
}
function tplRecuperacion(carga, rpe, minutos){
  const g = guiaRecuperacion(carga, rpe, minutos);
  const color = g.nivel==='suave'||g.nivel==='moderada' ? 'var(--accent)' : 'var(--warn)';
  return `<div class="card" id="recoveryCard" style="margin-top:14px;border-left:3px solid ${color};">
    <h2>Recuperación</h2>
    <div style="font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--muted);margin-bottom:10px;">
      ${minutos} min · RPE ${rpe} · carga ${carga} — <b style="color:${color};">${g.titulo}</b>
    </div>
    <ul style="margin:0 0 0 18px;padding:0;font-size:13.5px;line-height:1.65;">
      ${g.pautas.map(p=>`<li>${p}</li>`).join('')}
    </ul>
    <p style="font-size:11px;color:var(--muted);margin-top:10px;">Orientación general a partir de tu carga y esfuerzo. No sustituye a cómo te encuentres: si sigues fatigado, díselo a tu entrenador.</p>
  </div>`;
}

// ---------- CHECK DIARIO DE HÁBITOS ----------
// Dos orígenes: los que fija el entrenador (el atleta no puede tocarlos) y los
// que el atleta añade por su cuenta (sólo él los gestiona).
const HABIT_TYPES = {
  check:  'Sí / no',
  scale:  'Valoración 1-5',
  number: 'Cantidad'
};
const HABITS_SUGERIDOS = [
  {name:'Creatina', type:'check'},
  {name:'Horas de sueño', type:'number', unit:'h'},
  {name:'Calidad del sueño', type:'scale'},
  {name:'Pasos', type:'number', unit:'pasos'},
  {name:'Proteína objetivo', type:'check'},
  {name:'Hidratación', type:'scale'}
];
function habitId(){ return 'h'+uid(); }

async function getHabitDefs(athleteId){
  const raw = await safeGet('habits-config-'+athleteId, true);
  let cfg = null;
  try{ cfg = raw ? JSON.parse(raw) : null; }catch(e){ cfg = null; }
  if(!cfg || !Array.isArray(cfg.coach) || !Array.isArray(cfg.athlete)) cfg = { coach:[], athlete:[] };
  return cfg;
}
async function saveHabitDefs(athleteId, cfg){
  return safeSet('habits-config-'+athleteId, JSON.stringify(cfg), true);
}
async function getHabitLog(athleteId){
  const raw = await safeGet('habits-'+athleteId, true);
  try{ const l = raw ? JSON.parse(raw) : {}; return (l && typeof l==='object') ? l : {}; }
  catch(e){ return {}; }
}
async function saveHabitLog(athleteId, log){
  return safeSet('habits-'+athleteId, JSON.stringify(log), true);
}
function ultimosDias(n){
  const out = [];
  for(let i=n-1;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    out.push(d.toISOString().slice(0,10));
  }
  return out;
}
// Estadística semanal por hábito: adherencia si es check, media si es escala o cantidad.
function statsHabito(def, log, dias){
  const vals = [];
  dias.forEach(f=>{ const d = log[f]; if(d && d[def.id] !== undefined && d[def.id] !== '') vals.push(d[def.id]); });
  if(!vals.length) return { texto:'sin datos', detalle:'0 de '+dias.length+' días', pct:0 };
  if(def.type === 'check'){
    const si = vals.filter(v=>v===true||v==='true').length;
    return { texto: si+'/'+dias.length+' días', detalle: Math.round(si/dias.length*100)+'% de adherencia', pct: si/dias.length*100 };
  }
  const nums = vals.map(v=>parseFloat(v)).filter(v=>!isNaN(v));
  if(!nums.length) return { texto:'sin datos', detalle:'', pct:0 };
  const media = nums.reduce((a,b)=>a+b,0)/nums.length;
  const max = def.type==='scale' ? 5 : Math.max(...nums,1);
  return {
    texto: (def.type==='scale' ? media.toFixed(1)+'/5' : (Number.isInteger(media)?media:media.toFixed(1))+(def.unit?' '+def.unit:'')),
    detalle: 'media de '+nums.length+' día'+(nums.length===1?'':'s'),
    pct: def.type==='scale' ? (media/max*100) : Math.min(100, media/max*100)
  };
}

async function tplHabitos(athleteId){
  const cfg = await getHabitDefs(athleteId);
  const log = await getHabitLog(athleteId);
  const hoy = todayISO();
  const deHoy = log[hoy] || {};
  const todos = [...cfg.coach.map(h=>({...h, fijo:true})), ...cfg.athlete.map(h=>({...h, fijo:false}))];

  let html = `<div class="card">
    <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:4px;">
      <h2 style="margin:0;">Check diario</h2>
      <button class="btn ghost small" id="closeHabitsBtn">← Calendario</button>
    </div>
    <p style="font-size:12.5px;color:var(--muted);margin-bottom:14px;">${new Date().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'})}</p>`;

  if(!todos.length){
    html += `<div class="empty">Aún no hay hábitos que seguir. Añade los tuyos abajo o espera a que tu entrenador te asigne alguno.</div>`;
  }
  todos.forEach(h=>{
    const v = deHoy[h.id];
    html += `<div class="habit-row">
      <div class="habit-head">
        <b>${escapeHtml(h.name)}</b>
        ${h.fijo?'<span class="habit-tag">de tu entrenador</span>':''}
      </div>`;
    if(h.type === 'check'){
      const on = (v===true||v==='true');
      html += `<button class="habit-check ${on?'on':''}" data-habit="${h.id}" data-type="check">${on?'✓ Hecho':'Marcar'}</button>`;
    } else if(h.type === 'scale'){
      html += `<div class="scale" data-habitscale="${h.id}">${[1,2,3,4,5].map(n=>`<button data-val="${n}" class="${String(v)===String(n)?'sel':''}">${n}</button>`).join('')}</div>`;
    } else {
      html += `<div class="row"><input type="number" class="habit-num" data-habit="${h.id}" value="${v!==undefined?v:''}" placeholder="0" style="width:110px;">${h.unit?`<span style="font-size:12.5px;color:var(--muted);">${escapeHtml(h.unit)}</span>`:''}</div>`;
    }
    if(!h.fijo) html += `<button class="btn ghost small" data-delhabit="${h.id}" style="margin-top:8px;">Quitar</button>`;
    html += `</div>`;
  });

  html += `<div class="block-title">Añadir un hábito propio</div>
    <div class="ex-grid">
      <div class="full"><label class="field-label">Nombre</label><input type="text" id="newHabitName" placeholder="Ej. Estiramientos, Magnesio…" list="habitSuggestions" style="width:100%;"></div>
      <div><label class="field-label">Tipo</label><select id="newHabitType" style="width:100%;">${Object.keys(HABIT_TYPES).map(k=>`<option value="${k}">${HABIT_TYPES[k]}</option>`).join('')}</select></div>
      <div><label class="field-label">Unidad (opcional)</label><input type="text" id="newHabitUnit" placeholder="h, pasos, g" style="width:100%;"></div>
    </div>
    <button class="btn ghost" id="addHabitBtn" style="margin-top:10px;">+ Añadir</button>
  </div>`;

  // Estadística de los últimos 7 días
  if(todos.length){
    const dias = ultimosDias(7);
    html += `<div class="card"><h2>Tu semana</h2>
      <p style="font-size:12.5px;color:var(--muted);margin-bottom:12px;">Últimos 7 días.</p>`;
    todos.forEach(h=>{
      const s = statsHabito(h, log, dias);
      html += `<div class="hstat">
        <div class="hstat-top"><span>${escapeHtml(h.name)}</span><b>${s.texto}</b></div>
        <div class="hstat-bar"><i style="width:${Math.max(2,Math.min(100,s.pct)).toFixed(0)}%;"></i></div>
        <div class="hstat-sub">${s.detalle}</div>
      </div>`;
    });
    html += `<div class="hstat-days">${dias.map(f=>{
      const hay = log[f] && Object.keys(log[f]).length;
      return `<span class="${hay?'on':''}" title="${f}">${f.slice(8)}</span>`;
    }).join('')}</div>
    <p style="font-size:11px;color:var(--muted);margin-top:8px;">Días con algún registro.</p></div>`;
  }
  return html;
}

      <div style="font-size:12.5px;color:var(--accent);margin-top:4px;">7 días: <b>${s.texto}</b> <span style="color:var(--muted);">${s.detalle}</span></div>

async function tplPerfilAtleta(athleteId){
  const me = state.athletes.find(a=>a.id===athleteId);
  const raw = await safeGet('intake-'+athleteId, true);
  const data = raw ? JSON.parse(raw) : null;
  const profRaw = await safeGet('profile-'+athleteId, true);
  const p = profRaw ? JSON.parse(profRaw) : {};
  const jRaw = await safeGet('journal-'+athleteId, true);
  const journal = jRaw ? JSON.parse(jRaw) : [];
  const callRaw = await safeGet('call-'+athleteId, true);
  const call = callRaw ? JSON.parse(callRaw) : {};

  // Resumen de entrenamiento
  const totalMin = Math.round(journal.reduce((a,e)=>a+(e.durationSeconds||0),0)/60);
  let firstDate = null;
  journal.forEach(e=>{ const d=new Date(e.date+'T00:00:00'); if(!firstDate||d<firstDate) firstDate=d; });
  const semanas = firstDate ? Math.max(1, Math.ceil((new Date() - firstDate)/(7*86400000))) : 0;

  let html = `<div class="card"><h2>${escapeHtml(me?me.name:'Tu perfil')}</h2>
    <div class="kpi-row">
      <div class="kpi"><b>${journal.length}</b><span>Sesiones</span></div>
      <div class="kpi"><b>${totalMin}</b><span>Minutos</span></div>
      <div class="kpi"><b>${semanas}</b><span>Semanas</span></div>
    </div>
    ${call.nextDate?`<div style="font-size:13px;color:var(--muted);">Próxima revisión: <b style="color:var(--accent);">${call.nextDate}</b>${call.duration?' · '+escapeHtml(call.duration):''}</div>`:''}
  </div>`;

  // Suscripción
  const pagadoColor = p.pagado==='Sí' ? 'var(--accent)' : (p.pagado==='No' ? 'var(--danger)' : 'var(--warn)');
  let vencAviso = '';
  if(p.vence){
    const dias = Math.ceil((new Date(p.vence+'T00:00:00') - new Date())/86400000);
    if(p.pagado !== 'Sí'){
      if(dias < 0) vencAviso = `<div class="pending-task" style="margin-top:12px;"><span class="tag">Pago vencido</span>El plazo terminó hace ${Math.abs(dias)} día${Math.abs(dias)===1?'':'s'}.</div>`;
      else if(dias <= 7) vencAviso = `<div class="pending-task" style="margin-top:12px;"><span class="tag">Pago próximo</span>Quedan ${dias} día${dias===1?'':'s'} para la fecha límite.</div>`;
    }
  }
  html += `<div class="card"><h2>Tu suscripción</h2>
    <div class="kv-list">
      <div><span>Estado</span><b>${escapeHtml(p.estado||'—')}</b></div>
      <div><span>Tarifa mensual</span><b>${p.tarifa?escapeHtml(String(p.tarifa))+' €':'—'}</b></div>

// ---------- PERIODIZACIÓN: VISTA ----------
function periodChartSvg(macro){
  const micros = macro.micros;
  if(!micros.length) return '<div class="empty">Añade microciclos para ver la curva.</div>';
  const w = Math.max(560, micros.length*54), h = 210;
  const padL = 40, padR = 20, padT = 30, padB = 46;
  const innerW = w - padL - padR, innerH = h - padT - padB;
  const x = i => micros.length===1 ? padL+innerW/2 : padL + (i/(micros.length-1))*innerW;
  const y = v => padT + innerH - ((v-1)/3)*innerH;
  let g = '';
  for(let lvl=1; lvl<=4; lvl++){
    g += `<line x1="${padL}" y1="${y(lvl).toFixed(1)}" x2="${w-padR}" y2="${y(lvl).toFixed(1)}" stroke="var(--border)" stroke-width="1" stroke-dasharray="3 4"/>`;
    g += `<text x="${padL-8}" y="${(y(lvl)+3.5).toFixed(1)}" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="10" fill="var(--muted)">${lvl}</text>`;
  }
  micros.forEach((m,i)=>{
    const bh = ((m.volume||1)/4)*innerH;
    const bw = Math.min(26, innerW/Math.max(micros.length,1)*0.5);
    g += `<rect x="${(x(i)-bw/2).toFixed(1)}" y="${(padT+innerH-bh).toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" fill="var(--accent)" opacity="0.13" rx="2"/>`;
  });
  (macro.competitions||[]).forEach(c=>{
    if(!c.date) return;
    const start = new Date(macro.startDate+'T00:00:00');
    const cd = new Date(c.date+'T00:00:00');
    if(isNaN(start)||isNaN(cd)) return;
    const weeks = (cd - start)/(7*86400000);
    // El rango válido llega hasta el FINAL de la última semana, no hasta su
    // lunes: una carrera en domingo cae ~0.86 semanas después del último punto.
    if(weeks < -0.5 || weeks > micros.length) return;
    const denom = Math.max(1, micros.length-1);
    let cx = padL + (weeks/denom)*innerW;
    cx = Math.max(padL, Math.min(w-padR, cx));
    g += `<line x1="${cx.toFixed(1)}" y1="${padT-6}" x2="${cx.toFixed(1)}" y2="${padT+innerH}" stroke="var(--danger)" stroke-width="1.6"/>`;
    g += `<circle cx="${cx.toFixed(1)}" cy="${padT-10}" r="4" fill="var(--danger)"/>`;
    const anchor = cx > w-padR-40 ? 'end' : (cx < padL+40 ? 'start' : 'middle');
    g += `<text x="${cx.toFixed(1)}" y="${padT-18}" text-anchor="${anchor}" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="var(--danger)">${escapeHtml((c.name||'Comp.').slice(0,14))}</text>`;
  });
  const pts = micros.map((m,i)=>`${x(i).toFixed(1)},${y(m.intensity||1).toFixed(1)}`).join(' ');
  g += `<polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>`;
  micros.forEach((m,i)=>{
    g += `<circle cx="${x(i).toFixed(1)}" cy="${y(m.intensity||1).toFixed(1)}" r="4.5" fill="var(--panel)" stroke="var(--accent)" stroke-width="2.2"/>`;
    const d = microDate(macro, i);
    g += `<text x="${x(i).toFixed(1)}" y="${h-24}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="var(--muted)">S${i+1}</text>`;
    if(d) g += `<text x="${x(i).toFixed(1)}" y="${h-11}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="8.5" fill="var(--muted)" opacity="0.75">${fmtShortDate(d)}</text>`;
  });
  return `<div class="chart-scroll"><svg viewBox="0 0 ${w} ${h}" style="width:${micros.length>9?w+'px':'100%'};height:auto;">${g}</svg></div>`;
}

// ---------- COPIA DE SEGURIDAD ----------
// Cada versión publicada del artefacto tiene su propio almacenamiento, así que
// una actualización arranca vacía. Exportar/importar permite llevarse los datos.
function derivedKeys(athletes){
  const keys = ['athletes-list','quest-config','tasks-list'];
  (athletes||[]).forEach(a=>{
    ['intake','profile','routine','routine-draft','routine-history','journal','quest','quest-config','call','plan']
      .forEach(p=>keys.push(p+'-'+a.id));
  });
  return keys;
}
async function exportAll(){
  const data = {};
  let keys = null;
  try{
    const listed = await supaList();
    if(Array.isArray(listed) && listed.length) keys = listed;
  }catch(e){ /* sin conexión: usamos las claves derivadas */ }
  if(!keys) keys = derivedKeys(state.athletes);
  for(const k of keys){
    if(k === 'seed-done-v1' || k.indexOf('__umbral') === 0) continue;
    const v = await safeGet(k, true);
    if(v !== null && v !== undefined) data[k] = v;
  }
  return JSON.stringify({ _umbral:1, exportedAt:new Date().toISOString(), data }, null, 2);
}
async function importAll(json){
  let payload;
  try{ payload = JSON.parse(json); }
  catch(e){ throw new Error('el texto no es una copia válida'); }
  const data = payload && payload.data ? payload.data : payload;
  if(!data || typeof data !== 'object') throw new Error('la copia no contiene datos');
  if(!data['athletes-list']) throw new Error('la copia no incluye la lista de atletas');
  let incomingAthletes;
  try{ incomingAthletes = JSON.parse(data['athletes-list']); }
  catch(e){ throw new Error('la lista de atletas de la copia está dañada'); }
  if(!Array.isArray(incomingAthletes)) throw new Error('la lista de atletas de la copia está dañada');
  if(!incomingAthletes.length) throw new Error('la copia no contiene ningún atleta');
  let count = 0;
  for(const k of Object.keys(data)){
    if(k === 'athletes-list'){
      // Fusionamos en vez de sobrescribir: así restaurar nunca borra atletas
      // que ya existieran en esta versión.
      const currentRaw = await safeGet('athletes-list', true);
      let current = [];
      try{ current = currentRaw ? JSON.parse(currentRaw) : []; }catch(e){ current = []; }
      if(!Array.isArray(current)) current = [];
      const merged = current.slice();
      incomingAthletes.forEach(a=>{
        if(!a || !a.id) return;
        const i = merged.findIndex(x=>x.id===a.id);
        if(i === -1) merged.push(a); else merged[i] = a;
      });
      const ok = await safeSet('athletes-list', JSON.stringify(merged), true);
      if(ok) count++;
      continue;
    }
    const ok = await safeSet(k, data[k], true);
    if(ok) count++;
  }
  await safeSet('seed-done-v1','true', true);
  return count;
}

// Archiva la planificación publicada si pertenece a una semana ya cerrada.
// Antes sólo se archivaba al pulsar "Compartir": si una semana no cambiabas el
// plan, esa semana desaparecía del histórico del atleta.
async function autoArchiveWeek(athleteId){
  const published = await getRoutine(athleteId, false);
  const hasContent = DAYS.some(d => BLOCKS.some(b => published.days[d][b.key].length > 0));
  if(!hasContent) return;
  const wk = weekOfISO();
  const marcada = published.weekOf;
  if(!marcada){
    published.weekOf = wk;
    await safeSet('routine-'+athleteId, JSON.stringify(published), true);
    return;
  }
  if(marcada === wk) return;                       // seguimos en la misma semana
  const histRaw = await safeGet('routine-history-'+athleteId, true);
  const hist = histRaw ? JSON.parse(histRaw) : [];
  if(hist.some(h=>h.weekOf === marcada)) { published.weekOf = wk; await safeSet('routine-'+athleteId, JSON.stringify(published), true); return; }
  hist.push({ weekNumber: hist.length+1, weekOf: marcada, days: published.days });
  await safeSet('routine-history-'+athleteId, JSON.stringify(hist), true);
  published.weekOf = wk;
  await safeSet('routine-'+athleteId, JSON.stringify(published), true);
}

async function tplPlanificacionCoach(athleteId){
  await autoArchiveWeek(athleteId);
  const draft = await getRoutine(athleteId, true);
  const published = await getRoutine(athleteId, false);
  const sameAsPublished = JSON.stringify(draft.days) === JSON.stringify(published.days);
  let html = `<div class="draft-banner"><span>${sameAsPublished ? 'El borrador coincide con lo que ve el atleta.' : '<b style="color:var(--accent);">Tienes cambios sin compartir.</b> El atleta sigue viendo la versión anterior.'}</span>
    <button class="btn small" id="shareRoutineBtn">Compartir planificación</button></div>`;
  if(state.athletes.length > 1){
    const otros = state.athletes.filter(a=>a.id !== athleteId);
    html += `<div class="day-tools" style="margin-bottom:14px;">
      <span class="day-tools-label">Copiar la semana entera a</span>

      <button class="btn ghost small" id="xferWeekBtn">Copiar semana</button>
    </div>`;

    html += `<div class="acc ${open}" data-day="${d}"><div class="acc-head" data-toggle="${d}"><b>${d}</b><span class="chev"><span class="chev-arrow">▾</span></span><span class="chev-count">${totalEx} ejerc.</span></div><div class="acc-body">`;

    html += `<div class="day-tools">
      <span class="day-tools-label">Copiar este día a</span>

      <button class="btn ghost small" data-copyday="${d}" data-mode="append">Añadir</button>
      ${totalEx?`<button class="btn ghost small" data-swapday="${d}">Intercambiar</button>
      <button class="btn ghost small" data-clearday="${d}">Vaciar día</button>`:''}
    </div>`;
    // Copiar este día al de otro atleta: cuando dos entrenan lo mismo.
    if(totalEx && state.athletes.length > 1){
      const otros = state.athletes.filter(a=>a.id !== athleteId);
      html += `<div class="day-tools">
        <span class="day-tools-label">Copiar a otro atleta</span>
        <select class="xfer-athlete" data-from="${d}">
          ${otros.map(a=>`<option value="${a.id}">${escapeHtml(a.name)}</option>`).join('')}
        </select>
        <select class="xfer-day" data-from="${d}">
          ${DAYS.map(x=>`<option value="${x}" ${x===d?'selected':''}>${x.charAt(0).toUpperCase()+x.slice(1)}</option>`).join('')}
        </select>
        <button class="btn ghost small" data-xferday="${d}" data-mode="replace">Sustituir</button>
        <button class="btn ghost small" data-xferday="${d}" data-mode="append">Añadir</button>

async function tplResumen(){
  const now = new Date();
  const upcomingList = [], unpaidList = [], riskList = [];
  for(const a of state.athletes){
    const callRaw = await safeGet('call-'+a.id, true);
    if(callRaw){ const c = JSON.parse(callRaw); if(c.nextDate){ const days=(new Date(c.nextDate)-now)/86400000; if(days>=0 && days<=14) upcomingList.push({id:a.id, name:a.name, date:c.nextDate}); } }
    const profRaw = await safeGet('profile-'+a.id, true);
    if(profRaw){ const p = JSON.parse(profRaw); if(p.pagado==='No' || p.pagado==='Pendiente') unpaidList.push({id:a.id, name:a.name, estado:p.pagado}); }
    const jRaw = await safeGet('journal-'+a.id, true);
    if(jRaw){
      const entries = JSON.parse(jRaw);
      if(entries.length>=2){
        const sum7 = entries.filter(e=>(now-new Date(e.date))/86400000<=7).reduce((acc,e)=>acc+e.fatigueScore,0);
        const sum28 = entries.filter(e=>(now-new Date(e.date))/86400000<=28).reduce((acc,e)=>acc+e.fatigueScore,0);
        const chronicWeekly = sum28/4;
        if(chronicWeekly>0 && (sum7/chronicWeekly)>1.3) riskList.push({id:a.id, name:a.name, acwr:(sum7/chronicWeekly).toFixed(2)});
      }
    }
  }
  upcomingList.sort((x,y)=>x.date.localeCompare(y.date));
  const sections = [
    { key:'calls', title:'Próximas videollamadas', count:upcomingList.length, rows: upcomingList.map(u=>`<div class="entry"><div class="entry-top"><span>${escapeHtml(u.name)}</span><span>${u.date}</span></div></div>`).join('') },
    { key:'unpaid', title:'Pagos pendientes', count:unpaidList.length, rows: unpaidList.map(u=>`<div class="entry"><div class="entry-top"><span>${escapeHtml(u.name)}</span><span>${escapeHtml(u.estado)}</span></div></div>`).join('') },
    { key:'risk', title:'Riesgo por ACWR', count:riskList.length, rows: riskList.map(u=>`<div class="entry"><div class="entry-top"><span>${escapeHtml(u.name)}</span><span>ACWR ${u.acwr}</span></div></div>`).join('') },
    { key:'all', title:'Todos los atletas', count:state.athletes.length, rows: state.athletes.map(a=>`<div class="entry"><div class="entry-top"><span>${escapeHtml(a.name)}</span></div></div>`).join('') }
  ];
  let html = `<div class="card"><h2>Resumen</h2>`;
  sections.forEach(s=>{
    const open = state.openDays['resumen-'+s.key] ? 'open':'';
    html += `<div class="acc ${open}" data-day="resumen-${s.key}"><div class="acc-head" data-toggle="resumen-${s.key}"><b style="text-transform:none;">${s.title}</b><span class="chev"><span class="chev-arrow">▾</span></span><span class="chev-count">${s.count}</span></div>
      <div class="acc-body">${s.rows || '<div class="empty">Nada que mostrar.</div>'}</div></div>`;
  });
  html += `</div>`;
  return html;
}

// ---------- BIND DYNAMIC EVENTS ----------
// Enlaza el autoguardado de UNA tarjeta. Separado para poder aplicarlo a una
// tarjeta recién insertada sin volver a recorrer toda la pantalla.
// Enlaza el botón de eliminar de UNA tarjeta, para que también funcione en las
// insertadas sobre la marcha.
function bindRemoveEx(btn, athleteId){
  btn.addEventListener('click', async ()=>{
    const exId = btn.dataset.removeex; const card = btn.closest('.ex-card');
    if(!card) return;
    const blockKey = card.dataset.block, d = card.dataset.day;
    const draft = await getRoutine(athleteId, true);
    draft.days[d][blockKey] = draft.days[d][blockKey].filter(x=>x.id!==exId);
    draft.updatedAt = new Date().toISOString();
    const ok = await safeSet('routine-draft-'+athleteId, JSON.stringify(draft), true);
    if(!ok){ toast('No se pudo guardar. Comprueba la conexión.', true); return; }
    card.remove();
    actualizaContadorDia(d);
  });
}

function bindExerciseCard(card, athleteId){

    const fields = card.querySelectorAll('input, textarea, select');
    const commit = async ()=>{
      const athleteId = state.selectedId;
      const d = card.dataset.day, blockKey = card.dataset.block, exId = card.dataset.exid;
      const draft = await getRoutine(athleteId, true);
      const ex = draft.days[d][blockKey].find(x=>x.id===exId);
      if(ex){
        ex.name = card.querySelector('.ex-name').value.trim();
        ex.desc = card.querySelector('.ex-desc').value.trim();
        ex.section = card.querySelector('.ex-section').value.trim();
        ex.load = card.querySelector('.ex-load').value.trim();
        ex.series = card.querySelector('.ex-series').value.trim();
        ex.reps = card.querySelector('.ex-reps').value.trim();
        ex.rest = card.querySelector('.ex-rest').value.trim();
        ex.rir = card.querySelector('.ex-rir').value.trim();
        ex.rpeTarget = card.querySelector('.ex-rpetarget').value.trim();
        const prevType = exTimer(ex).type;
        const t = exTimer(ex);
        const typeEl = card.querySelector('.ex-timer-type');
        if(typeEl) t.type = typeEl.value;
        const num = (sel, fallback)=>{ const el=card.querySelector(sel); return el ? (parseInt(el.value,10)||fallback) : fallback; };
        t.work = num('.tm-work', t.work);
        t.rest = num('.tm-rest', t.rest);
        t.rounds = num('.tm-rounds', t.rounds);
        t.sets = num('.tm-sets', t.sets);
        t.setRest = num('.tm-setrest', t.setRest);
        t.emomLen = num('.tm-emomlen', t.emomLen);
        t.emomRounds = num('.tm-emomrounds', t.emomRounds);
        t.amrapMin = num('.tm-amrapmin', t.amrapMin);
        t.seriesRestSec = num('.tm-seriesrest', t.seriesRestSec);
        t.seriesCount = num('.tm-seriescount', t.seriesCount);
        ex.timer = t;
        draft.updatedAt = new Date().toISOString();
        await safeSet('routine-draft-'+athleteId, JSON.stringify(draft), true);
        const flag = card.querySelector('.save-flag'); if(flag){ flag.classList.add('show'); setTimeout(()=>flag.classList.remove('show'),1200); }
        // Al cambiar el tipo de temporizador cambian sus campos: redibujamos
        // sólo esta tarjeta, no la pantalla entera (eso hacía saltar el scroll).
        if(t.type !== prevType){
          const nuevaHtml = exCardHtml(ex, blockKey, d);
          card.insertAdjacentHTML('afterend', nuevaHtml);
          const reemplazo = card.nextElementSibling;
          card.remove();
          if(reemplazo) bindExerciseCard(reemplazo, athleteId);
        }
      }
    };
    let debounce = null;
    const delBtn = card.querySelector('[data-removeex]');
    if(delBtn && !delBtn.dataset.bound){ delBtn.dataset.bound='1'; bindRemoveEx(delBtn, athleteId); }
    fields.forEach(f=>{
      // `change` sólo salta al perder el foco, lo que en móvil es frágil: si el
      // usuario escribe y navega sin tocar fuera del campo, la edición se perdía.
      // Guardamos también mientras escribe, con una pequeña espera.
      f.addEventListener('input', ()=>{ clearTimeout(debounce); debounce = setTimeout(commit, 600); });
      f.addEventListener('change', ()=>{ clearTimeout(debounce); commit(); });
    });
}
// Refresca el "N ejerc." de la cabecera del día sin re-renderizar.
function actualizaContadorDia(d){
  const acc = [...document.querySelectorAll('.acc')].find(a=>a.dataset.day===d);
  if(!acc) return;
  const n = acc.querySelectorAll('.ex-card').length;
  const cnt = acc.querySelector('.chev-count');
  if(cnt) cnt.textContent = n + ' ejerc.';
}

async function bindDynamicEvents(){
  // Quién es el atleta en contexto: el que ha iniciado sesión (modo atleta) o
  // el seleccionado en el panel (modo entrenador).
  const athleteId = state.role === 'atleta' ? state.athleteAsId : state.selectedId;
  const backToAthletes = document.getElementById('backToAthletes');
  if(backToAthletes) backToAthletes.addEventListener('click', ()=>{ state._inAthleteDetail=false; renderScrollTop(); });
  document.querySelectorAll('[data-subtab]').forEach(b=>b.addEventListener('click', ()=>{ state.athleteSubTab=b.dataset.subtab; renderScrollTop(); }));

  // ---------- PERIODIZACIÓN: eventos ----------
  const periodSave = async (mutate)=>{
    const athleteId = state.selectedId;
    const plan = await getPlan(athleteId);
    mutate(plan);
    const ok = await savePlan(athleteId, plan);
    if(!ok) toast('No se pudo guardar la periodización', true);
    return ok;
  };
  const addMacroBtn = document.getElementById('addMacroBtn');
  if(addMacroBtn) addMacroBtn.addEventListener('click', async ()=>{
    await periodSave(p=>p.macros.push(blankMacro()));
    toast('Macrociclo creado');
    renderKeepScroll();
  });
  document.querySelectorAll('[data-delmacro]').forEach(b=>b.addEventListener('click', async ()=>{
    await periodSave(p=>{ p.macros = p.macros.filter(m=>m.id!==b.dataset.delmacro); });
    renderKeepScroll();
  }));
  document.querySelectorAll('.macro-name').forEach(inp=>inp.addEventListener('change', async ()=>{
    await periodSave(p=>{ const m=p.macros.find(x=>x.id===inp.dataset.macro); if(m) m.name=inp.value.trim()||'Macrociclo'; });
    toast('Guardado');
  }));
  document.querySelectorAll('.macro-start').forEach(inp=>inp.addEventListener('change', async ()=>{
    await periodSave(p=>{ const m=p.macros.find(x=>x.id===inp.dataset.macro); if(m) m.startDate=inp.value; });
    renderKeepScroll();
  }));
  document.querySelectorAll('.macro-weeks').forEach(inp=>inp.addEventListener('change', async ()=>{
    const n = Math.max(1, Math.min(52, parseInt(inp.value,10)||1));
    await periodSave(p=>{
      const m=p.macros.find(x=>x.id===inp.dataset.macro); if(!m) return;
      while(m.micros.length < n) m.micros.push({ id:uid(), intensity:2, volume:3, type:'Acumulación', note:'' });
      while(m.micros.length > n) m.micros.pop();
    });
    renderKeepScroll();
  }));
  document.querySelectorAll('[data-addcomp]').forEach(b=>b.addEventListener('click', async ()=>{
    await periodSave(p=>{
      const m=p.macros.find(x=>x.id===b.dataset.addcomp); if(!m) return;
      if(!Array.isArray(m.competitions)) m.competitions=[];
      m.competitions.push({ id:uid(), name:'', date:'' });
    });
    renderKeepScroll();
  }));
  document.querySelectorAll('[data-delcomp]').forEach(b=>b.addEventListener('click', async ()=>{
    const [mid,cid] = b.dataset.delcomp.split('|');
    await periodSave(p=>{ const m=p.macros.find(x=>x.id===mid); if(m) m.competitions=(m.competitions||[]).filter(c=>c.id!==cid); });
    renderKeepScroll();
  }));
  // Redibuja SÓLO el gráfico afectado: reconstruir la pantalla entera hacía
  // que la vista saltara al principio al tocar cualquier control.
  const refreshChart = async (macroId)=>{
    const box = document.getElementById('chart-'+macroId);
    if(!box) return;
    const plan = await getPlan(state.selectedId);
    const macro = plan.macros.find(m=>m.id===macroId);
    if(macro) box.innerHTML = periodChartSvg(macro);
  };
  const compField = (cls, key)=>{
    document.querySelectorAll('.'+cls).forEach(inp=>inp.addEventListener('change', async ()=>{
      await periodSave(p=>{
        const m=p.macros.find(x=>x.id===inp.dataset.macro); if(!m) return;
        const c=(m.competitions||[]).find(y=>y.id===inp.dataset.comp); if(c) c[key]=inp.value;
      });
      await refreshChart(inp.dataset.macro);
      toast('Guardado');
    }));
  };
  compField('comp-name','name');
  compField('comp-date','date');
  const microField = (cls, key, numeric)=>{
    document.querySelectorAll('.'+cls).forEach(inp=>inp.addEventListener('change', async ()=>{
      await periodSave(p=>{
        const m=p.macros.find(x=>x.id===inp.dataset.macro); if(!m) return;
        const mc=m.micros.find(y=>y.id===inp.dataset.micro); if(!mc) return;
        mc[key] = numeric ? (parseInt(inp.value,10)||1) : inp.value;
      });
      await refreshChart(inp.dataset.macro);
    }));
  };
  microField('micro-int','intensity', true);
  microField('micro-vol','volume', true);
  microField('micro-type','type', false);
  microField('micro-note','note', false);

  const addTaskBtn = document.getElementById('addTaskBtn');
  if(addTaskBtn) addTaskBtn.addEventListener('click', async ()=>{
    try{
      const name = document.getElementById('taskName').value.trim();
      if(!name){ toast('Ponle un nombre a la tarea', true); return; }
      const tasks = await getTasks();
      tasks.push({ id:uid(), name, desc:document.getElementById('taskDesc').value.trim(), dueDate:document.getElementById('taskDue').value, athleteId:document.getElementById('taskAthlete').value, done:false });
      const ok = await safeSet('tasks-list', JSON.stringify(tasks), true);
      toast(ok?'Tarea añadida':'No se pudo guardar', !ok);
      renderKeepScroll();
    }catch(e){ toast('Error al guardar: '+e.message, true); }
  });
  document.querySelectorAll('[data-edittask]').forEach(b=>b.addEventListener('click', ()=>{
    state.editTask = b.dataset.edittask; renderKeepScroll();
  }));
  document.querySelectorAll('[data-canceltask]').forEach(b=>b.addEventListener('click', ()=>{
    state.editTask = null; renderKeepScroll();
  }));
  document.querySelectorAll('[data-savetask]').forEach(b=>b.addEventListener('click', async ()=>{
    const id = b.dataset.savetask;
    const card = document.querySelector(`[data-taskcard="${id}"]`);
    if(!card) return;
    const nombre = card.querySelector('.tk-name').value.trim();
    if(!nombre){ toast('La tarea necesita un nombre', true); return; }
    const tasks = await getTasks();
    const t = tasks.find(x=>x.id===id);
    if(t){
      t.name = nombre;
      t.desc = card.querySelector('.tk-desc').value.trim();
      t.dueDate = card.querySelector('.tk-due').value;
      t.athleteId = card.querySelector('.tk-ath').value;
      const ok = await safeSet('tasks-list', JSON.stringify(tasks), true);
      toast(ok?'Tarea actualizada':'No se pudo guardar', !ok);
    }
    state.editTask = null; renderKeepScroll();
  }));
  document.querySelectorAll('[data-donetask]').forEach(b=>b.addEventListener('click', async ()=>{
    const tasks = await getTasks();
    const t = tasks.find(x=>x.id===b.dataset.donetask); if(t) t.done=true;
    await safeSet('tasks-list', JSON.stringify(tasks), true);
    renderKeepScroll();
  }));
  document.querySelectorAll('[data-deltask]').forEach(b=>b.addEventListener('click', async ()=>{
    let tasks = await getTasks();
    tasks = tasks.filter(x=>x.id!==b.dataset.deltask);
    await safeSet('tasks-list', JSON.stringify(tasks), true);
    renderKeepScroll();
  }));

  const callAthleteSelect = document.getElementById('callAthleteSelect');
  if(callAthleteSelect) callAthleteSelect.addEventListener('change', ()=>{ state.selectedId = callAthleteSelect.value; renderKeepScroll(); });
  const saveCallBtn = document.getElementById('saveCallBtn');
  if(saveCallBtn) saveCallBtn.addEventListener('click', async ()=>{
    const athleteId = saveCallBtn.dataset.athleteid;
    const call = { nextDate: document.getElementById('callDate').value, duration: document.getElementById('callDuration').value, notes: document.getElementById('callNotes').value };
    try{
      const ok = await safeSet('call-'+athleteId, JSON.stringify(call), true);
      toast(ok ? 'Videollamada guardada' : 'No se pudo guardar', !ok);
      saveCallBtn.textContent = ok?'Guardado ✓':'Error'; setTimeout(()=>{ saveCallBtn.textContent='Guardar'; },1400);
    }catch(e){ toast('Error al guardar: '+e.message, true); }
  });

  const saveProfileBtn = document.getElementById('saveProfileBtn');
  if(saveProfileBtn) saveProfileBtn.addEventListener('click', async ()=>{
    const athleteId = saveProfileBtn.dataset.athleteid;
    const p = { estado:document.getElementById('profEstado').value, tarifa:document.getElementById('profTarifa').value, pagado:document.getElementById('profPagado').value,
      vence:document.getElementById('profVence').value, plaza:document.getElementById('profPlaza').value, alta:document.getElementById('profAlta').value,
      notas:document.getElementById('profNotas').value };
    try{
      const ok = await safeSet('profile-'+athleteId, JSON.stringify(p), true);
      toast(ok ? 'Perfil guardado' : 'No se pudo guardar — revisa la conexión', !ok);
      saveProfileBtn.textContent = ok?'Guardado ✓':'Error'; setTimeout(()=>{ saveProfileBtn.textContent='Guardar'; },1400);
    }catch(e){ toast('Error al guardar: '+e.message, true); }
  });

  const submitIntake = document.getElementById('submitIntake');
  if(submitIntake) submitIntake.addEventListener('click', async ()=>{
    try{
      const data = {}; INTAKE_FIELDS.forEach(f=>{ const el=document.querySelector(`[data-intake="${f.id}"]`); data[f.id]=el?el.value.trim():''; });
      const ok = await safeSet('intake-'+state.athleteAsId, JSON.stringify(data), true);
      if(!ok){ toast('No se pudo guardar — revisa la conexión e inténtalo de nuevo', true); return; }
      toast('Datos guardados');
      state.tab='rutina'; renderScrollTop();
    }catch(e){ toast('Error al guardar: '+e.message, true); }
  });

  document.querySelectorAll('[data-toggle]').forEach(h=>h.addEventListener('click', ()=>{
    const d = h.dataset.toggle;
    const acc = h.closest('.acc');
    if(!acc) return;
    const wasOpen = acc.classList.contains('open');
    const container = acc.parentElement;
    container.querySelectorAll(':scope > .acc.open').forEach(el=>{ if(el!==acc) el.classList.remove('open'); });
    acc.classList.toggle('open', !wasOpen);
    Object.keys(state.openDays).forEach(k=>{ state.openDays[k] = false; });
    state.openDays[d] = !wasOpen;
  }));

  // --- Copiar / intercambiar / vaciar días de la planificación ---
  // Los ejercicios se clonan con identificadores nuevos: si compartieran id,
  // editar uno cambiaría también el del otro día.
  const clonaBloques = (dias)=>{
    const copia = {};
    BLOCKS.forEach(b=>{
      copia[b.key] = (dias[b.key]||[]).map(ex=>({ ...ex, id: uid(), timer: {...exTimer(ex)} }));
    });
    return copia;
  };
  const totalDe = (dias)=> BLOCKS.reduce((a,b)=>a+((dias&&dias[b.key])?dias[b.key].length:0),0);

  document.querySelectorAll('[data-copyday]').forEach(btn=>btn.addEventListener('click', async ()=>{
    const origen = btn.dataset.copyday;
    const modo = btn.dataset.mode;
    const sel = document.querySelector(`.copy-target[data-from="${origen}"]`);
    if(!sel) return;
    const destino = sel.value;
    const athleteId = state.selectedId;
    const draft = await getRoutine(athleteId, true);
    if(totalDe(draft.days[origen]) === 0){ toast(`${origen} no tiene ejercicios que copiar`, true); return; }
    const yaHay = totalDe(draft.days[destino]);
    if(modo === 'replace' && yaHay){
      if(!confirm(`${destino.charAt(0).toUpperCase()+destino.slice(1)} ya tiene ${yaHay} ejercicio${yaHay===1?'':'s'}.\n\n¿Sustituirlos por los de ${origen}?`)) return;
    }
    const clon = clonaBloques(draft.days[origen]);
    if(modo === 'replace'){
      draft.days[destino] = clon;
    } else {
      BLOCKS.forEach(b=>{ draft.days[destino][b.key] = (draft.days[destino][b.key]||[]).concat(clon[b.key]); });
    }
    draft.updatedAt = new Date().toISOString();
    const ok = await safeSet('routine-draft-'+athleteId, JSON.stringify(draft), true);
    if(!ok){ toast('No se pudo guardar', true); return; }
    toast(`${origen} → ${destino}: ${totalDe(clon)} ejercicios ${modo==='replace'?'copiados':'añadidos'}`);
    state.openDays = {}; state.openDays[destino] = true;
    renderKeepScroll();
  }));

  // --- Copiar un día al de OTRO atleta ---
  document.querySelectorAll('[data-xferday]').forEach(btn=>btn.addEventListener('click', async ()=>{
    const origen = btn.dataset.xferday;
    const modo = btn.dataset.mode;
    const fila = btn.closest('.day-tools');
    const destinoAtleta = fila.querySelector('.xfer-athlete').value;
    const destinoDia = fila.querySelector('.xfer-day').value;
    const nombreDest = (state.athletes.find(a=>a.id===destinoAtleta)||{}).name || 'ese atleta';
    try{
      const draftOrigen = await getRoutine(athleteId, true);
      const clon = clonaBloques(draftOrigen.days[origen]);
      const total = BLOCKS.reduce((a,b)=>a+clon[b.key].length,0);
      if(!total){ toast('Ese día no tiene ejercicios', true); return; }
      const draftDestino = await getRoutine(destinoAtleta, true);
      const yaTenia = BLOCKS.reduce((a,b)=>a+draftDestino.days[destinoDia][b.key].length,0);
      if(modo==='replace' && yaTenia){
        if(!confirm(`${nombreDest} ya tiene ${yaTenia} ejercicio(s) el ${destinoDia}.\n\n¿Sustituirlos por los ${total} de tu ${origen}?`)) return;
      }
      BLOCKS.forEach(b=>{
        draftDestino.days[destinoDia][b.key] = (modo==='append')
          ? draftDestino.days[destinoDia][b.key].concat(clon[b.key])
          : clon[b.key];
      });
      draftDestino.updatedAt = new Date().toISOString();
      const ok = await safeSet('routine-draft-'+destinoAtleta, JSON.stringify(draftDestino), true);
      toast(ok ? `${total} ejercicios copiados a ${nombreDest} (${destinoDia})` : 'No se pudo copiar', !ok);
      if(ok) toast(`Recuerda compartir la planificación de ${nombreDest}`);
    }catch(e){ toast('Error al copiar: '+e.message, true); }
  }));

  // --- Copiar la semana completa a otro atleta ---
  const xferWeek = document.getElementById('xferWeekBtn');
  if(xferWeek) xferWeek.addEventListener('click', async ()=>{
    const destino = document.getElementById('xferWeekAthlete').value;
    const nombreDest = (state.athletes.find(a=>a.id===destino)||{}).name || 'ese atleta';
    try{
      const draftOrigen = await getRoutine(athleteId, true);
      let total = 0;
      DAYS.forEach(d=>{ BLOCKS.forEach(b=>{ total += draftOrigen.days[d][b.key].length; }); });
      if(!total){ toast('Esta semana no tiene ejercicios', true); return; }
      const draftDestino = await getRoutine(destino, true);
      let tenia = 0;
      DAYS.forEach(d=>{ BLOCKS.forEach(b=>{ tenia += draftDestino.days[d][b.key].length; }); });
      const aviso = tenia
        ? `${nombreDest} ya tiene ${tenia} ejercicio(s) en su borrador.\n\n¿Sustituir su semana entera por esta (${total} ejercicios)?`
        : `¿Copiar la semana entera (${total} ejercicios) a ${nombreDest}?`;
      if(!confirm(aviso)) return;
      DAYS.forEach(d=>{ draftDestino.days[d] = clonaBloques(draftOrigen.days[d]); });
      draftDestino.updatedAt = new Date().toISOString();
      const ok = await safeSet('routine-draft-'+destino, JSON.stringify(draftDestino), true);
      toast(ok ? `Semana copiada a ${nombreDest}` : 'No se pudo copiar', !ok);
      if(ok) toast(`Queda en su borrador: revísala y compártela`);
    }catch(e){ toast('Error al copiar: '+e.message, true); }
  });

  document.querySelectorAll('[data-swapday]').forEach(btn=>btn.addEventListener('click', async ()=>{
    const origen = btn.dataset.swapday;
    const sel = document.querySelector(`.copy-target[data-from="${origen}"]`);
    if(!sel) return;
    const destino = sel.value;
    const athleteId = state.selectedId;
    const draft = await getRoutine(athleteId, true);
    if(!confirm(`¿Intercambiar los entrenamientos de ${origen} y ${destino}?`)) return;
    const a = draft.days[origen], b = draft.days[destino];
    draft.days[origen] = b; draft.days[destino] = a;
    draft.updatedAt = new Date().toISOString();
    const ok = await safeSet('routine-draft-'+athleteId, JSON.stringify(draft), true);
    if(!ok){ toast('No se pudo guardar', true); return; }
    toast(`${origen} ↔ ${destino}`);
    state.openDays = {}; state.openDays[destino] = true;
    renderKeepScroll();
  }));

  document.querySelectorAll('[data-clearday]').forEach(btn=>btn.addEventListener('click', async ()=>{
    const d = btn.dataset.clearday;
    const athleteId = state.selectedId;
    const draft = await getRoutine(athleteId, true);
    const n = totalDe(draft.days[d]);
    if(!n) return;
    if(!confirm(`¿Vaciar ${d}?\n\nSe quitan sus ${n} ejercicio${n===1?'':'s'} del borrador.`)) return;
    BLOCKS.forEach(b=>{ draft.days[d][b.key] = []; });
    draft.updatedAt = new Date().toISOString();
    const ok = await safeSet('routine-draft-'+athleteId, JSON.stringify(draft), true);
    if(!ok){ toast('No se pudo guardar', true); return; }
    toast(`${d} vaciado`);
    state.openDays = {}; state.openDays[d] = true;
    renderKeepScroll();
  }));

  // Añadir ejercicio: insertamos la tarjeta en el sitio y ya. Reconstruir la
  // pantalla entera hacía que el scroll saltara al principio en cada añadido.
  document.querySelectorAll('[data-addex]').forEach(b=>b.addEventListener('click', async ()=>{
    const [d, blockKey] = b.dataset.addex.split('|');
    const athleteId = state.selectedId;
    const draft = await getRoutine(athleteId, true);
    const nuevo = blankExercise();
    draft.days[d][blockKey].push(nuevo);
    draft.updatedAt = new Date().toISOString();
    const ok = await safeSet('routine-draft-'+athleteId, JSON.stringify(draft), true);
    if(!ok){ toast('No se pudo guardar. Comprueba la conexión.', true); return; }
    state.openDays[d] = true;
    b.insertAdjacentHTML('beforebegin', exCardHtml(nuevo, blockKey, d));
    const card = b.previousElementSibling;
    if(card){
      bindExerciseCard(card, athleteId);
      const nombre = card.querySelector('.ex-name');
      if(nombre) nombre.focus();
      if(typeof card.scrollIntoView === 'function') card.scrollIntoView({block:'nearest', behavior:'smooth'});
    }
    actualizaContadorDia(d);
  }));

  // auto-save per exercise field on blur
  document.querySelectorAll('.ex-card').forEach(card=>bindExerciseCard(card, athleteId));

  const shareRoutineBtn = document.getElementById('shareRoutineBtn');
  if(shareRoutineBtn) shareRoutineBtn.addEventListener('click', async ()=>{
    const athleteId = state.selectedId;
    const previousPublished = await getRoutine(athleteId, false);
    const hasContent = DAYS.some(d => BLOCKS.some(b => previousPublished.days[d][b.key].length > 0));
    if(hasContent){
      const histRaw = await safeGet('routine-history-'+athleteId, true);
      const hist = histRaw ? JSON.parse(histRaw) : [];
      const currentWeekOf = weekOfISO();
      const alreadyArchivedThisWeek = hist.length && hist[hist.length-1].weekOf === currentWeekOf;
      if(!alreadyArchivedThisWeek){
        hist.push({ weekNumber: hist.length+1, weekOf: currentWeekOf, days: previousPublished.days });
        await safeSet('routine-history-'+athleteId, JSON.stringify(hist), true);
      }
    }
    const draft = await getRoutine(athleteId, true);
    draft.updatedAt = new Date().toISOString();
    draft.weekOf = weekOfISO();
    const ok = await safeSet('routine-'+athleteId, JSON.stringify(draft), true);
    toast(ok ? 'Planificación compartida' : 'No se pudo compartir', !ok);
    shareRoutineBtn.textContent = ok?'Compartido ✓':'Error';
    setTimeout(()=>{ shareRoutineBtn.textContent='Compartir planificación'; render(); },1300);
  });

  const replayTut = document.getElementById('replayTutorialBtn');
  if(replayTut) replayTut.addEventListener('click', ()=>{
    state.showTutorial = true; state.tutorialStep = 0; renderTutorial();
  });

  // --- Navegación de meses del calendario ---
  document.querySelectorAll('[data-calmove]').forEach(b=>b.addEventListener('click', ()=>{
    const paso = parseInt(b.dataset.calmove,10);
    const nuevo = (state.calOffset||0) + paso;
    if(nuevo > 0) return;              // no tiene sentido ir al futuro
    state.calOffset = nuevo;
    renderKeepScroll();
  }));

  // --- CHECK DIARIO DE HÁBITOS ---
  const openHab = document.getElementById('openHabitsBtn');
  if(openHab) openHab.addEventListener('click', ()=>{ state.calShowHabits = true; renderScrollTop(); });
  const closeHab = document.getElementById('closeHabitsBtn');
  if(closeHab) closeHab.addEventListener('click', ()=>{ state.calShowHabits = false; renderScrollTop(); });

  const marcarHabito = async (hid, valor)=>{
    const log = await getHabitLog(athleteId);
    const hoy = todayISO();
    if(!log[hoy]) log[hoy] = {};
    if(valor === null || valor === '') delete log[hoy][hid];
    else log[hoy][hid] = valor;
    await saveHabitLog(athleteId, log);
  };
  document.querySelectorAll('[data-habit][data-type="check"]').forEach(b=>b.addEventListener('click', async ()=>{
    const on = b.classList.contains('on');
    await marcarHabito(b.dataset.habit, !on);
    renderKeepScroll();
  }));
  document.querySelectorAll('[data-habitscale]').forEach(sc=>{
    sc.querySelectorAll('button').forEach(btn=>btn.addEventListener('click', async ()=>{
      await marcarHabito(sc.dataset.habitscale, parseInt(btn.dataset.val,10));
      renderKeepScroll();
    }));
  });
  document.querySelectorAll('.habit-num').forEach(inp=>{
    let deb=null;
    const guardar = async ()=>{
      const v = inp.value.trim();
      await marcarHabito(inp.dataset.habit, v===''?null:parseFloat(v));
    };
    inp.addEventListener('input', ()=>{ clearTimeout(deb); deb=setTimeout(guardar,700); });
    inp.addEventListener('change', ()=>{ clearTimeout(deb); guardar(); });
  });
  const addHab = document.getElementById('addHabitBtn');
  if(addHab) addHab.addEventListener('click', async ()=>{
    const nombre = document.getElementById('newHabitName').value.trim();
    if(!nombre){ toast('Ponle un nombre al hábito', true); return; }
    const cfg = await getHabitDefs(athleteId);
    cfg.athlete.push({ id:habitId(), name:nombre,
      type:document.getElementById('newHabitType').value,
      unit:document.getElementById('newHabitUnit').value.trim() });
    const ok = await saveHabitDefs(athleteId, cfg);
    toast(ok?'Hábito añadido':'No se pudo guardar', !ok);
    renderKeepScroll();
  });
  document.querySelectorAll('[data-delhabit]').forEach(b=>b.addEventListener('click', async ()=>{
    const cfg = await getHabitDefs(athleteId);
    cfg.athlete = cfg.athlete.filter(h=>h.id !== b.dataset.delhabit);
    await saveHabitDefs(athleteId, cfg);
    renderKeepScroll();
  }));
  // Lado entrenador
  const addCoachHab = document.getElementById('addCoachHabitBtn');
  if(addCoachHab) addCoachHab.addEventListener('click', async ()=>{
    const nombre = document.getElementById('coachHabitName').value.trim();
    if(!nombre){ toast('Ponle un nombre al hábito', true); return; }
    const cfg = await getHabitDefs(athleteId);
    cfg.coach.push({ id:habitId(), name:nombre,
      type:document.getElementById('coachHabitType').value,
      unit:document.getElementById('coachHabitUnit').value.trim() });
    const ok = await saveHabitDefs(athleteId, cfg);
    toast(ok?'Hábito asignado':'No se pudo guardar', !ok);
    renderKeepScroll();
  });
  document.querySelectorAll('[data-delcoachhabit]').forEach(b=>b.addEventListener('click', async ()=>{
    const cfg = await getHabitDefs(athleteId);
    cfg.coach = cfg.coach.filter(h=>h.id !== b.dataset.delcoachhabit);
    await saveHabitDefs(athleteId, cfg);
    renderKeepScroll();
  }));

  // --- Corregir y eliminar sesiones del diario ---
  document.querySelectorAll('[data-editentry]').forEach(b=>b.addEventListener('click', ()=>{
    state.editEntry = parseInt(b.dataset.editentry,10); renderKeepScroll();
  }));
  document.querySelectorAll('[data-cancelentry]').forEach(b=>b.addEventListener('click', ()=>{
    state.editEntry = null; renderKeepScroll();
  }));
  document.querySelectorAll('[data-delentry]').forEach(b=>b.addEventListener('click', async ()=>{
    const idx = parseInt(b.dataset.delentry,10);
    const raw = await safeGet('journal-'+athleteId, true);
    const entries = raw ? JSON.parse(raw) : [];
    const e = entries[idx];
    if(!e) return;
    if(!confirm(`¿Eliminar la sesión del ${e.date}?\n\nDejará de contar para la carga y el ACWR. No se puede deshacer.`)) return;
    entries.splice(idx,1);
    const ok = await safeSet('journal-'+athleteId, JSON.stringify(entries), true);
    toast(ok?'Sesión eliminada':'No se pudo eliminar', !ok);
    state.editEntry = null; renderKeepScroll();
  }));
  document.querySelectorAll('[data-saveentry]').forEach(b=>b.addEventListener('click', async ()=>{
    const idx = parseInt(b.dataset.saveentry,10);
    const card = b.closest('.entry');
    const raw = await safeGet('journal-'+athleteId, true);
    const entries = raw ? JSON.parse(raw) : [];
    const e = entries[idx];
    if(!e || !card) return;
    const num = (sel, min, max, fallback)=>{
      const el = card.querySelector(sel); if(!el) return fallback;
      const v = parseInt(el.value,10);
      return (isNaN(v) || v<min || v>max) ? fallback : v;
    };
    const fecha = card.querySelector('.ed-date').value || e.date;
    const mins  = Math.max(1, num('.ed-min', 1, 600, Math.round((e.durationSeconds||0)/60)));
    const rpe   = num('.ed-rpe', 1, 10, e.overallRPE);
    e.date = fecha;
    const nuevoDia = card.querySelector('.ed-day');
    if(nuevoDia) e.day = nuevoDia.value;
    e.durationSeconds = mins*60;
    e.overallRPE = rpe;
    e.fatiga = num('.ed-fat',1,5,e.fatiga);
    e.calidad = num('.ed-cal',1,5,e.calidad);
    e.hidratacion = num('.ed-hid',1,5,e.hidratacion);
    e.satisfaccion = num('.ed-sat',1,5,e.satisfaccion);
    e.notes = card.querySelector('.ed-notes').value.trim();
    // La carga se recalcula: si no había RPE por ejercicio, manda el general.
    const base = (e.avgExerciseRPE && e.avgExerciseRPE > 0) ? e.avgExerciseRPE : rpe;
    e.fatigueScore = +(base * mins).toFixed(1);
    entries.sort((x,y)=>String(x.date).localeCompare(String(y.date)));
    const ok = await safeSet('journal-'+athleteId, JSON.stringify(entries), true);
    toast(ok?'Sesión corregida':'No se pudo guardar', !ok);
    state.editEntry = null; renderKeepScroll();
  }));

  // --- Editar nombre y PIN del atleta ---
  const saveAthBasics = document.getElementById('saveAthBasics');
  if(saveAthBasics) saveAthBasics.addEventListener('click', async ()=>{
    const id = saveAthBasics.dataset.athleteid;
    const nuevoNombre = document.getElementById('editAthName').value.trim();
    const nuevoPin = document.getElementById('editAthPin').value.trim();
    if(!nuevoNombre){ toast('El nombre no puede quedar vacío', true); return; }
    if(!/^\d{4,6}$/.test(nuevoPin)){ toast('El PIN debe tener entre 4 y 6 dígitos', true); return; }
    if(state.athletes.some(x=>x.id!==id && String(x.pin)===nuevoPin)){
      toast('Ese PIN ya lo usa otro atleta', true); return;
    }
    const at = state.athletes.find(x=>x.id===id);
    if(!at) return;
    at.name = nuevoNombre; at.pin = nuevoPin;
    const ok = await safeSet('athletes-list', JSON.stringify(state.athletes), true);
    toast(ok ? 'Datos actualizados' : 'No se pudo guardar', !ok);
    if(ok) render();
  });

  // --- Eliminar atleta y todo su rastro ---
  const delAth = document.getElementById('deleteAthBtn');
  if(delAth) delAth.addEventListener('click', async ()=>{
    const id = delAth.dataset.athleteid;
    const at = state.athletes.find(x=>x.id===id);
    if(!at) return;
    const aviso = `¿Eliminar a ${at.name}?\n\nSe borrarán su ficha, rutinas, historial, diario, cuestionarios, periodización y tareas asociadas.\n\nEsta acción no se puede deshacer. Exporta una copia antes si quieres conservarlo.`;
    if(!confirm(aviso)) return;
    try{
      for(const p of ['intake','profile','routine','routine-draft','routine-history','journal','quest','quest-config','call','plan','tutorial','session-activa','habits','habits-config']){
        await safeSet(p+'-'+id, '', true);
      }
      const tareas = await getTasks();
      const restantes = tareas.filter(t=>t.athleteId !== id);
      if(restantes.length !== tareas.length) await safeSet('tasks-list', JSON.stringify(restantes), true);
      state.athletes = state.athletes.filter(x=>x.id!==id);
      await safeSet('athletes-list', JSON.stringify(state.athletes), true);
      state._inAthleteDetail = false;
      state.selectedId = state.athletes.length ? state.athletes[0].id : null;
      toast(`${at.name} eliminado`);
      renderScrollTop();
    }catch(e){ toast('Error al eliminar: '+e.message, true); }
  });

  // --- Perfil del atleta: guardar sus propios datos ---
  const saveMyIntake = document.getElementById('saveMyIntake');
  if(saveMyIntake) saveMyIntake.addEventListener('click', async ()=>{
    try{
      const prevRaw = await safeGet('intake-'+athleteId, true);
      const data = prevRaw ? JSON.parse(prevRaw) : {};
      INTAKE_FIELDS.forEach(f=>{ const el=document.querySelector(`[data-myintake="${f.id}"]`); if(el) data[f.id]=el.value.trim(); });
      const ok = await safeSet('intake-'+athleteId, JSON.stringify(data), true);
      toast(ok?'Datos actualizados':'No se pudo guardar', !ok);
    }catch(e){ toast('Error al guardar: '+e.message, true); }
  });

  // --- Exportar la videollamada al calendario del móvil ---
  const addCal = document.getElementById('addToCalendarBtn');
  if(addCal) addCal.addEventListener('click', async ()=>{
    try{
      const raw = await safeGet('call-'+athleteId, true);
      const call = raw ? JSON.parse(raw) : {};
      const me = state.athletes.find(a=>a.id===athleteId);
      const ics = icsFor(call, me?me.name:'');
      if(!ics){ toast('No hay videollamada programada', true); return; }
      const blob = new Blob([ics], {type:'text/calendar;charset=utf-8'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'revision-umbral.ics';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url), 1500);
      toast('Evento descargado — ábrelo con tu calendario');
    }catch(e){ toast('No se pudo generar el evento', true); }
  });

  // --- Cuestionario como subpestaña ---
  const openQuest = document.getElementById('openQuestBtn');
  if(openQuest) openQuest.addEventListener('click', ()=>{ state.calShowQuest=true; state.questWeek=null; renderScrollTop(); });
  const closeQuest = document.getElementById('closeQuestBtn');
  if(closeQuest) closeQuest.addEventListener('click', ()=>{ state.calShowQuest=false; state.questWeek=null; renderScrollTop(); });
  const questWeekSelect = document.getElementById('questWeekSelect');
  if(questWeekSelect) questWeekSelect.addEventListener('change', ()=>{ state.questWeek = questWeekSelect.value; renderKeepScroll(); });

  // --- Selectores de semana y día en Sesión ---
  const sessionWeekSel = document.getElementById('sessionWeek');
  const sessionDaySelect = document.getElementById('sessionDay');
  const refreshPreview = async ()=>{
    const week = sessionWeekSel ? sessionWeekSel.value : 'actual';
    const day = sessionDaySelect ? sessionDaySelect.value : DAY_INDEX[new Date().getDay()];
    state.sessionWeek = week; state.sessionDay = day;
    let source = await getRoutine(athleteId, false);
    if(week !== 'actual'){
      const histRaw = await safeGet('routine-history-'+athleteId, true);
      const hist = histRaw ? JSON.parse(histRaw) : [];
      const h = hist.find(w=>String(w.weekNumber)===String(week));
      if(h) source = { days:h.days };
    }
    const box = document.getElementById('sessionPreview');
    if(box) box.innerHTML = sessionPreviewHtml(source, day);
  };
  if(sessionWeekSel) sessionWeekSel.addEventListener('change', refreshPreview);
  if(sessionDaySelect) sessionDaySelect.addEventListener('change', refreshPreview);

  const resumeBtn = document.getElementById('resumeSessionBtn');
  if(resumeBtn) resumeBtn.addEventListener('click', async ()=>{
    const paused = await findPausedSession(athleteId);
    if(!paused){ toast('Ya no está disponible', true); render(); return; }
    session = { day: paused.day, elapsedSec: paused.elapsedSec||0, exercises: paused.exercises,
      fullscreen:true, showSurvey: !!paused.showSurvey, startedAt: paused.startedAt,
      avgExerciseRPE: paused.avgExerciseRPE, fatigueScore: paused.fatigueScore };
    clearInterval(stopwatchInterval);
    stopwatchInterval = setInterval(()=>{
      if(!session){ clearInterval(stopwatchInterval); stopwatchInterval=null; return; }
      session.elapsedSec++;
      const disp=document.getElementById('stopwatchDisplay');
      if(disp) disp.textContent=fmtTime(session.elapsedSec);
      if(session.elapsedSec % 15 === 0) queueSessionSave();
    },1000);
    keepAwake(true);
    mountSessionOverlay(athleteId);
  });
  const discardBtn = document.getElementById('discardSessionBtn');
  if(discardBtn) discardBtn.addEventListener('click', async ()=>{
    if(!confirm('Se perderá lo registrado en esa sesión. ¿Descartarla?')) return;
    await safeSet(sessionKey(athleteId), '', true);
    toast('Sesión descartada');
    render();
  });

  // --- Registro manual de una sesión ya hecha ---
  const manualBtn = document.getElementById('manualSessionBtn');
  if(manualBtn) manualBtn.addEventListener('click', ()=>{ state.manualSession = true; renderKeepScroll(); });
  const cancelManual = document.getElementById('cancelManualBtn');
  if(cancelManual) cancelManual.addEventListener('click', ()=>{ state.manualSession = false; state.manual=null; renderKeepScroll(); });
  document.querySelectorAll('[data-mnscale]').forEach(sc=>{
    sc.querySelectorAll('button').forEach(b=>b.addEventListener('click', ()=>{
      sc.querySelectorAll('button').forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel');
    }));
  });
  const saveManual = document.getElementById('saveManualBtn');
  if(saveManual) saveManual.addEventListener('click', async ()=>{
    try{
      const card = document.getElementById('manualCard');
      const val = k=>{ const sc=card.querySelector(`[data-mnscale="${k}"]`); const sel=sc&&sc.querySelector('button.sel'); return sel?parseInt(sel.dataset.val,10):null; };
      const overallRPE = val('overallRPE');
      if(overallRPE===null){ toast('Marca al menos el RPE general', true); return; }
      const fecha = card.querySelector('#mnDate').value || todayISO();
      const mins = Math.max(1, parseInt(card.querySelector('#mnMin').value,10) || 60);
      const dia = document.getElementById('sessionDay').value;

      const ejercicios = [];
      const rpes = [];
      card.querySelectorAll('[data-mnex]').forEach(fila=>{
        const nombre = fila.querySelector('div').textContent.trim();
        const rpe = parseInt(fila.querySelector('.mn-rpe').value,10);
        const carga = fila.querySelector('.mn-load').value.trim();
        const series = fila.querySelector('.mn-series').value.trim();
        const rir = fila.querySelector('.mn-rir').value.trim();
        if(!isNaN(rpe) && rpe>=1 && rpe<=10) rpes.push(rpe);
        ejercicios.push({ name:nombre, rpeApplied:(!isNaN(rpe)?rpe:null), loadApplied:carga,
          seriesDone:series, rirApplied:rir, done:true });
      });
      const avg = rpes.length ? +(rpes.reduce((a,b)=>a+b,0)/rpes.length).toFixed(1) : 0;
      const base = avg > 0 ? avg : overallRPE;
      const carga = +(base * mins).toFixed(1);

      const registro = {
        date: fecha, day: dia, durationSeconds: mins*60, exercises: ejercicios,
        avgExerciseRPE: avg, fatigueScore: carga, cargaDesdeRPEGeneral: !(avg>0),
        overallRPE,
        descanso: val('descanso'), fatiga: val('fatiga'), calidad: val('calidad'),
        hidratacion: val('hidratacion'), satisfaccion: val('satisfaccion'),
        notes: card.querySelector('#mnNotes').value.trim(),
        registroManual: true
      };
      const raw = await safeGet('journal-'+athleteId, true);
      const entries = raw ? JSON.parse(raw) : [];
      entries.push(registro);
      entries.sort((a,b)=>String(a.date).localeCompare(String(b.date)));
      const ok = await safeSet('journal-'+athleteId, JSON.stringify(entries), true);
      if(!ok){ toast('No se pudo guardar', true); return; }
      toast('Sesión registrada en el diario');
      state.manualSession = false; state.manual = null;
      state.tab = 'progreso'; render();
    }catch(e){ toast('Error al guardar: '+e.message, true); }
  });

  const startSession = document.getElementById('startSession');
  if(startSession) startSession.addEventListener('click', async ()=>{
    const day = document.getElementById('sessionDay').value;
    const week = document.getElementById('sessionWeek') ? document.getElementById('sessionWeek').value : 'actual';
    let routine = await getRoutine(state.athleteAsId, false);
    if(week !== 'actual'){
      const histRaw = await safeGet('routine-history-'+state.athleteAsId, true);
      const hist = histRaw ? JSON.parse(histRaw) : [];
      const h = hist.find(w=>String(w.weekNumber)===String(week));
      if(h) routine = { days:h.days };
    }
    const list = flattenExercises(routine, day);
    if(!list.length){ toast('No hay ejercicios programados para ese día', true); return; }
    session = { day, elapsedSec:0, exercises:list, fullscreen:true, showSurvey:false, avgExerciseRPE:null, fatigueScore:null, startedAt:Date.now() };
    ensureAudio();
    keepAwake(true);
    persistSession();
    clearInterval(stopwatchInterval);
    stopwatchInterval = setInterval(()=>{
      if(!session){ clearInterval(stopwatchInterval); stopwatchInterval=null; return; }
      session.elapsedSec++;
      const disp=document.getElementById('stopwatchDisplay');
      if(disp) disp.textContent=fmtTime(session.elapsedSec);
      if(session.elapsedSec % 15 === 0) queueSessionSave();
    },1000);
    mountSessionOverlay(state.athleteAsId);
  });

  const saveQuestConfig = document.getElementById('saveQuestConfig');
  if(saveQuestConfig) saveQuestConfig.addEventListener('click', async ()=>{
    try{
      const active=[]; document.querySelectorAll('[data-qid]').forEach(cb=>{ if(cb.checked) active.push(cb.dataset.qid); });
      const target = state.selectedId;
      const ok = await safeSet('quest-config-'+target, JSON.stringify(active), true);
      const aplicarTodos = document.getElementById('questApplyAll');
      if(aplicarTodos && aplicarTodos.checked) await safeSet('quest-config', JSON.stringify(active), true);
      toast(ok ? 'Selección guardada' : 'No se pudo guardar', !ok);
      saveQuestConfig.textContent = ok?'Guardado ✓':'Error'; setTimeout(()=>{ saveQuestConfig.textContent='Guardar selección'; },1400);
    }catch(e){ toast('Error al guardar: '+e.message, true); }
  });
  document.querySelectorAll('[data-qscale]').forEach(scale=>{
    scale.querySelectorAll('button').forEach(btn=>btn.addEventListener('click', ()=>{ scale.querySelectorAll('button').forEach(b=>b.classList.remove('sel')); btn.classList.add('sel'); }));
  });
  const editQuestBtn = document.getElementById('editQuestBtn');
  if(editQuestBtn) editQuestBtn.addEventListener('click', ()=>{ state.calShowQuest=true; renderKeepScroll(); });
  const submitQuest = document.getElementById('submitQuest');
  if(submitQuest) submitQuest.addEventListener('click', async ()=>{
    try{
      const athleteId = state.athleteAsId;
      const active = await getQuestConfig(athleteId);
      const answers = {}, notes = {}; let ok2 = true;
      active.forEach(qid=>{
        const q = QUESTION_BANK.find(x=>x.id===qid); if(!q) return;
        if(q.type==='text'){ const ta=document.querySelector(`[data-qtext="${qid}"]`); answers[qid]=ta?ta.value.trim():''; }
        else {
          const sc=document.querySelector(`[data-qscale="${qid}"]`); const sel=sc&&sc.querySelector('button.sel');
          if(!sel){ ok2=false; return; }
          answers[qid]=parseInt(sel.dataset.val,10);
          const nt=document.querySelector(`[data-qnote="${qid}"]`); if(nt && nt.value.trim()) notes[qid]=nt.value.trim();
        }
      });
      if(!ok2){ toast('Responde todas las preguntas de escala antes de enviar', true); return; }
      const date = document.getElementById('questDateInput').value || saturdayOfWeek();
      const wk = weekOfISO();
      const raw = await safeGet('quest-'+athleteId, true);
      let responses = raw ? JSON.parse(raw) : [];
      responses = responses.filter(r=>r.weekOf!==wk);
      responses.push({ weekOf: wk, date, answers, notes });
      const ok = await safeSet('quest-'+athleteId, JSON.stringify(responses), true);
      toast(ok ? 'Cuestionario enviado' : 'No se pudo guardar', !ok);
      state.calShowQuest=false;
      renderKeepScroll();
    }catch(e){ toast('Error al guardar: '+e.message, true); }
  });
}

// ---------- PANTALLA DE ENTRADA ----------
// Sólo en arranque en frío: al cambiar de pestaña no se vuelve a mostrar,
// porque una intro de dos segundos veinte veces al día acaba estorbando.
(function initSplash(){
  const sp = document.getElementById('splash');
  if(!sp) return;
  let cerrado = false;
  const cerrar = ()=>{
    if(cerrado) return;
    cerrado = true;
    sp.classList.add('hide');
    setTimeout(()=>{ if(sp && sp.parentNode) sp.parentNode.removeChild(sp); }, 500);
  };
  // Se cierra sola al terminar la animación
  const DURACION = 2500;
  setTimeout(cerrar, DURACION);
  // …o antes, si el usuario toca la pantalla
  sp.addEventListener('click', cerrar);
  sp.addEventListener('touchstart', cerrar, {passive:true});
  // Red de seguridad: si algo fallara, nunca dejamos la app tapada
  setTimeout(cerrar, 6000);
})();

init();
</script>
</body>
</html>
