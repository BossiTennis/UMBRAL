  if(athleteId){
    const own = await safeGet('quest-config-'+athleteId, true);
    if(own){ try{ const p=JSON.parse(own); if(Array.isArray(p)) return p; }catch(e){} }
  }
  const raw = await safeGet('quest-config', true);
  return raw ? JSON.parse(raw) : DEFAULT_ACTIVE.slice();
}
async function countPlannedSessions(athleteId){
  const routine = await getRoutine(athleteId, false);
  const n = DAYS.filter(d => BLOCKS.some(b => routine.days[d][b.key].length > 0)).length;
  return n > 0 ? n : 5;
}
async function tplQuestForm(athleteId, existing){
  const active = await getQuestConfig(athleteId);
  const planned = await countPlannedSessions(athleteId);
  if(!active.length){
    return `<div class="empty" style="padding:18px 0;">Tu entrenador no ha activado ninguna pregunta para este cuestionario todavía. Cuando lo haga, aparecerá aquí.</div>`;
  }
  let html = `<div style="margin-top:10px;">
    <div class="q-item"><p>Fecha (sábado de esta semana)</p><input type="date" id="questDateInput" value="${existing && existing.date ? existing.date : saturdayOfWeek()}"></div>`;
  active.forEach(qid=>{
    const q = QUESTION_BANK.find(x=>x.id===qid); if(!q) return;
    const val = existing && existing.answers ? existing.answers[qid] : null;
    const note = existing && existing.notes ? existing.notes[qid] : '';
    const ayuda = q.ayuda ? `<span class="q-ayuda">${escapeHtml(q.ayuda)}</span>` : '';
    if(q.type==='text'){
      html += `<div class="q-item"><p>${q.text}${ayuda}</p><textarea data-qtext="${q.id}" style="min-height:44px;">${val?escapeHtml(val):''}</textarea></div>`;
    } else if(q.type==='numero'){
      // Una cifra real con su unidad, no una escala abstracta.
      html += `<div class="q-item"><p>${q.text}${ayuda}</p>
        <div class="q-num">
          <input type="number" data-qnum="${q.id}" value="${val!==null&&val!==undefined?escapeHtml(String(val)):''}"
            min="${q.min ?? 0}" max="${q.max ?? 9999}" step="${q.paso ?? 1}" inputmode="decimal" placeholder="—">
          <span>${escapeHtml(q.unidad||'')}</span>
        </div>
        <div class="q-note"><textarea data-qnote="${q.id}" placeholder="Notas (opcional)">${note?escapeHtml(note):''}</textarea></div></div>`;
    } else if(q.type==='scale_dynamic'){
      html += `<div class="q-item"><p>${q.text}${ayuda}</p><div class="scale" data-qscale="${q.id}">`;
      for(let n=1;n<=planned;n++) html += `<button data-val="${n}" class="${val===n?'sel':''}">${n}/${planned}</button>`;
      html += `</div></div>`;
    } else if(q.type==='opciones'){
      // Cada respuesta dice lo que significa: nada de adivinar si 4 es bueno.
      html += `<div class="q-item"><p>${q.text}${ayuda}</p><div class="q-ops" data-qops="${q.id}">`;
      q.opciones.forEach((op,idx)=>{
        const n = idx+1;
        html += `<button class="q-op ${val===n?'on':''}" data-val="${n}">${escapeHtml(op)}</button>`;
      });
      html += `</div><div class="q-note"><textarea data-qnote="${q.id}" placeholder="Notas (opcional)">${note?escapeHtml(note):''}</textarea></div></div>`;
    } else {
      // Compatibilidad con preguntas antiguas de escala 1-5.
      html += `<div class="q-item"><p>${q.text}${ayuda}</p><div class="scale" data-qscale="${q.id}">`;
      for(let n=1;n<=5;n++) html += `<button data-val="${n}" class="${val===n?'sel':''}">${n}</button>`;
      html += `</div>${q.labels?`<div class="scale-labels"><span>1 · ${q.labels[0]}</span><span>5 · ${q.labels[1]}</span></div>`:''}
        <div class="q-note"><textarea data-qnote="${q.id}" placeholder="Notas adicionales (opcional)">${note?escapeHtml(note):''}</textarea></div></div>`;
    }
  });
  html += `<button class="btn" id="submitQuest">Enviar cuestionario</button></div>`;
  return html;
}

// ---------- PROGRESO ----------
// Evolución de un ejercicio concreto a lo largo del tiempo: carga movida, RPE
// y series. Es lo que de verdad enseña si alguien está progresando.
// Clave de agrupación insensible a mayúsculas y a espacios repetidos: "Hip
// Thrust", "hip thrust" y "HIP THRUST " deben contar como el mismo ejercicio
// para poder seguir su progresión, sin obligar a escribirlo siempre igual.
// RPE y RIR admiten varias formas de escribirlos, porque en la práctica no
// siempre hay un único número:
//   "8"        → 8
//   "8-9"      → 8.5   (rango: se toma el punto medio)
//   "7,8,9"    → 8     (una por serie: se hace la media)
//   "7 8 9"    → 8     (igual, separado por espacios)
// Devuelve { media, valores, texto } o null si no hay nada aprovechable.
function parseEsfuerzo(txt){
  const bruto = String(txt == null ? '' : txt).trim();
  if(!bruto) return null;
  // "7,5" en España es un decimal, no dos series. Sólo cuando la coma separa
  // un único par de dígitos sueltos la tratamos como decimal; "7,8,9" siguen
  // siendo tres series.
  const decimalSuelto = bruto.match(/^(\d+),(\d+)$/);
  if(decimalSuelto){
    const n = parseFloat(bruto.replace(',','.'));
    if(!isNaN(n)) return { media: Math.round(n*10)/10, valores:[n], texto: bruto };
  }
  const partes = bruto.split(/[,;/\s]+/).filter(Boolean);
  const valores = [];
  partes.forEach(p=>{
    const rango = p.match(/^(\d+(?:[.,]\d+)?)\s*[-–—]\s*(\d+(?:[.,]\d+)?)$/);
    if(rango){
      const a = parseFloat(rango[1].replace(',','.')), b = parseFloat(rango[2].replace(',','.'));
      if(!isNaN(a) && !isNaN(b)) valores.push((a+b)/2);
      return;
    }
    const n = parseFloat(p.replace(',','.'));
    if(!isNaN(n)) valores.push(n);
  });
  if(!valores.length) return null;
  const media = valores.reduce((a,b)=>a+b,0) / valores.length;
  return { media: Math.round(media*10)/10, valores, texto: bruto };
}

function claveEjercicio(nombre){
  return (nombre||'').trim().toLowerCase().replace(/\s+/g,' ');
}
function extraeSeries(entries){
  const porEjercicio = new Map();   // clave normalizada -> { nombre, datos }
  entries.forEach(e=>{
    (e.exercises||[]).forEach(ex=>{
      if(!ex.name) return;
      const clave = claveEjercicio(ex.name);
      if(!clave) return;
      if(!porEjercicio.has(clave)) porEjercicio.set(clave, { nombre: ex.name.trim(), datos: [] });
      const kg = parseFloat(String(ex.loadApplied||'').replace(',','.').replace(/[^0-9.]/g,''));
      porEjercicio.get(clave).datos.push({
        fecha: e.date,
        carga: isNaN(kg) ? null : kg,
        rpe: (typeof ex.rpeApplied === 'number') ? ex.rpeApplied : null,
        series: ex.seriesDone || '',
        nota: ex.noteApplied || ''
      });
    });
  });
  porEjercicio.forEach(v=>v.datos.sort((a,b)=>String(a.fecha).localeCompare(String(b.fecha))));
  return porEjercicio;
}
function miniGrafica(datos, campo, color){
  const vals = datos.map(d=>d[campo]).filter(v=>v!==null && !isNaN(v));
  if(vals.length < 2) return '';
  const w=300, h=54, pad=6;
  const min = Math.min(...vals), max = Math.max(...vals);
  const rango = (max-min) || 1;
  const puntos = [];
  let idx = 0;
  datos.forEach((d,i)=>{
    const v = d[campo];
    if(v===null||isNaN(v)) return;
    const x = pad + (datos.length===1?0:(i/(datos.length-1))*(w-2*pad));
    const y = h - pad - ((v-min)/rango)*(h-2*pad);
    puntos.push(`${x.toFixed(1)},${y.toFixed(1)}`);
    idx++;
  });
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%;height:46px;">
    <polyline points="${puntos.join(' ')}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>`;
}
function tplMetricasEjercicio(entries){
  const mapa = extraeSeries(entries);   // clave normalizada -> {nombre, datos}
  const claves = [...mapa.keys()].filter(k=>mapa.get(k).datos.length >= 2)
    .sort((a,b)=>mapa.get(a).nombre.localeCompare(mapa.get(b).nombre,'es'));
  if(!claves.length){
    return `<div class="card"><h2>Evolución por ejercicio</h2>
      <div class="empty">Hacen falta al menos dos sesiones con el mismo ejercicio para ver su progresión. Anota la carga usada y el RPE en cada sesión.</div></div>`;
  }
  const sel = claves.includes(state.ejercicioSel) ? state.ejercicioSel : claves[0];
  const datos = mapa.get(sel).datos;
  const cargas = datos.map(d=>d.carga).filter(v=>v!==null);
  const rpes = datos.map(d=>d.rpe).filter(v=>v!==null);
  const primera = cargas.length ? cargas[0] : null;
  const ultima = cargas.length ? cargas[cargas.length-1] : null;
  let variacion = '';
  if(primera !== null && ultima !== null && primera > 0){
    const pct = Math.round(((ultima-primera)/primera)*100);
    variacion = pct === 0 ? 'Misma carga que al empezar'
      : (pct > 0 ? `<b style="color:var(--accent);">+${pct}%</b> de carga desde la primera vez`
                 : `<b style="color:var(--warn);">${pct}%</b> de carga desde la primera vez`);
  }
  let html = `<div class="card"><h2>Evolución por ejercicio</h2>
    <label class="field-label">Ejercicio</label>
    <select id="ejercicioSelect" style="width:100%;margin-bottom:14px;">
      ${claves.map(k=>`<option value="${escapeHtml(k)}" ${k===sel?'selected':''}>${escapeHtml(mapa.get(k).nombre)} (${mapa.get(k).datos.length})</option>`).join('')}
    </select>
    <div class="kpi-row">
      <div class="kpi"><b>${datos.length}</b><span>Veces</span></div>
      ${cargas.length?`<div class="kpi"><b>${Math.max(...cargas)}</b><span>Mejor carga</span></div>`:''}
      ${rpes.length?`<div class="kpi"><b>${(rpes.reduce((a,b)=>a+b,0)/rpes.length).toFixed(1)}</b><span>RPE medio</span></div>`:''}
    </div>
    ${variacion?`<p style="font-size:13px;color:var(--muted);margin-bottom:14px;">${variacion}</p>`:''}`;

  if(cargas.length >= 2){
    html += `<div class="metrica"><span>Carga movida</span>${miniGrafica(datos,'carga','var(--accent)')}</div>`;
  }
  if(rpes.length >= 2){
    html += `<div class="metrica"><span>Esfuerzo percibido (RPE)</span>${miniGrafica(datos,'rpe','var(--warn)')}</div>`;
  }
  html += `<div class="block-title">Historial</div>`;
  datos.slice().reverse().slice(0,10).forEach(d=>{
    html += `<div class="entry"><div class="entry-top"><span>${d.fecha}</span>
      <span>${d.carga!==null?`<b style="color:var(--accent);">${d.carga}</b>`:'—'}${d.rpe!==null?` · RPE ${d.rpe}`:''}${d.series?` · ${escapeHtml(String(d.series))} series`:''}</span></div>
      ${d.nota?`<div style="font-size:12px;color:var(--muted);margin-top:4px;">"${escapeHtml(d.nota)}"</div>`:''}</div>`;
  });
  html += `</div>`;
  return html;
}

// Tendencia por drill: porcentaje de acierto, intentos y sensación a lo largo
// del tiempo. Es el equivalente de «Evolución por ejercicio» para el tenis.
function tplMetricasDrills(entries){
  const porDrill = new Map();
  entries.filter(e=>e.esPista && Array.isArray(e.drills)).forEach(e=>{
    e.drills.forEach(dr=>{
      const clave = (dr.name||'').trim() || 'Drill sin nombre';
      if(!porDrill.has(clave)) porDrill.set(clave, []);
      porDrill.get(clave).push({ fecha:e.date, ...dr });
    });
  });
  porDrill.forEach(arr=>arr.sort((a,b)=>String(a.fecha).localeCompare(String(b.fecha))));
  const nombres = [...porDrill.keys()].filter(n=>porDrill.get(n).length >= 1).sort((a,b)=>a.localeCompare(b,'es'));
  if(!nombres.length) return '';

  const sel = nombres.includes(state.drillSel) ? state.drillSel : nombres[0];
  const datos = porDrill.get(sel);
  const conPct = datos.filter(d=>d.aciertoPct!==null && d.aciertoPct!==undefined);
  const primero = conPct.length ? conPct[0].aciertoPct : null;
  const ultimo = conPct.length ? conPct[conPct.length-1].aciertoPct : null;
  let variacion = '';
  if(primero!==null && ultimo!==null && conPct.length>=2){
    const dif = ultimo - primero;
    variacion = dif===0 ? 'Mismo acierto que la primera vez'
      : (dif>0 ? `<b style="color:var(--accent);">+${dif} puntos</b> de acierto desde la primera vez`
               : `<b style="color:var(--warn);">${dif} puntos</b> de acierto desde la primera vez`);
  }
  const mejor = conPct.length ? Math.max(...conPct.map(d=>d.aciertoPct)) : null;
  const sens = datos.map(d=>d.sensacion).filter(v=>typeof v==='number');

  let html = `<div class="card"><h2>Evolución por drill</h2>
    <label class="field-label">Drill</label>
    <select id="drillSelect" style="width:100%;margin-bottom:14px;">
      ${nombres.map(n=>`<option value="${escapeHtml(n)}" ${n===sel?'selected':''}>${escapeHtml(n)} (${porDrill.get(n).length})</option>`).join('')}
    </select>
    <div class="kpi-row">
      <div class="kpi"><b>${datos.length}</b><span>Veces</span></div>
      ${mejor!==null?`<div class="kpi"><b>${mejor}%</b><span>Mejor acierto</span></div>`:''}
      ${sens.length?`<div class="kpi"><b>${(sens.reduce((a,b)=>a+b,0)/sens.length).toFixed(1)}</b><span>Sensación media</span></div>`:''}
    </div>
    ${variacion?`<p style="font-size:13px;color:var(--muted);margin-bottom:14px;">${variacion}</p>`:''}`;

  if(conPct.length >= 2){
    html += `<div class="metrica"><span>Porcentaje de acierto</span>${miniGrafica(conPct.map(d=>({v:d.aciertoPct})),'v','var(--accent)')}</div>`;
  }
  html += `<div class="block-title">Historial</div>`;
  datos.slice().reverse().slice(0,10).forEach(d=>{
    html += `<div class="entry"><div class="entry-top"><span>${d.fecha}</span>
      <span>${d.aciertoPct!==null&&d.aciertoPct!==undefined?`<b style="color:var(--accent);">${d.aciertoPct}%</b>`:'—'}${(d.acertados!==null&&d.intentos)?` · ${d.acertados}/${d.intentos}`:''}${d.tiempo?` · ${d.tiempo} min`:''}${d.sensacion?` · sensación ${d.sensacion}/5`:''}</span></div>
      ${d.nota?`<div style="font-size:12px;color:var(--muted);margin-top:4px;">"${escapeHtml(d.nota)}"</div>`:''}</div>`;
  });
  html += `</div>`;
  return html;
}

async function tplProgreso(athleteId){
  const raw = await safeGet('journal-'+athleteId, true);
  const entries = raw ? JSON.parse(raw) : [];
  let html = `<div class="card"><h2>Progreso</h2>`;
  if(entries.length < 2){ html += `<div class="empty">Necesitas al menos 2 sesiones registradas para ver tendencias.</div></div>`; return html; }
  const now = new Date();

  // ---- ACWR por SEMANAS NATURALES (lunes a domingo) ----
  // Antes se usaban ventanas móviles de 7 y 28 días desde "hoy": el ratio
  // cambiaba cada día aunque no entrenaras, y no cuadraba con las semanas de
  // la planificación. Ahora la carga aguda es la de la semana en curso y la
  // crónica la media de las 4 semanas completas anteriores, que es lo que se
  // puede contrastar con el microciclo.
  const cargaPorSemana = new Map();
  entries.forEach(e=>{
    const lunes = lunesDe(e.date);
    cargaPorSemana.set(lunes, (cargaPorSemana.get(lunes)||0) + (e.fatigueScore||0));
  });
  const semanaActual = weekOfISO();
  const sum7 = cargaPorSemana.get(semanaActual) || 0;

  // Las 4 semanas completas ANTERIORES a la actual.
  const semanasPrevias = [];
  for(let k=1; k<=4; k++){
    const d = new Date(semanaActual+'T00:00:00');
    d.setDate(d.getDate() - k*7);
    semanasPrevias.push(fechaLocalISO(d));
  }
  const conCarga = semanasPrevias.filter(w=>cargaPorSemana.has(w));
  const chronicWeekly = conCarga.length
    ? conCarga.reduce((a,w)=>a+cargaPorSemana.get(w),0) / conCarga.length
    : 0;

  // Hace falta un mes completo de referencia: con menos, el denominador es tan
  // frágil que el ratio dice más del azar que del entrenamiento.
  const acwrFiable = conCarga.length >= 4 && chronicWeekly > 0;
  const semanasQueFaltan = Math.max(0, 4 - conCarga.length);

  let acwrVal = '—', flagText = 'sin datos suficientes', acwrNota = '';
  if(!acwrFiable){
    acwrNota = semanasQueFaltan === 4
      ? 'Aún no hay semanas completas anteriores con las que comparar. El ratio aparecerá cuando lleves un mes registrando.'
      : `Faltan ${semanasQueFaltan} semana${semanasQueFaltan===1?'':'s'} completa${semanasQueFaltan===1?'':'s'} de registro para que el ratio sea fiable. Con menos base, una sola sesión lo dispara y no significaría nada.`;
  }
  if(acwrFiable){
    const r = sum7/chronicWeekly;
    acwrVal = r.toFixed(2);
    // Cruzamos con la periodización: una descarga planificada no es un problema.
    const info = await currentMicro(athleteId);
    const intensidadPlan = (info && info.micro) ? info.micro.intensity : null;
    if(r < 0.8){
      if(intensidadPlan === 1){ flagText = 'descarga planificada'; acwrNota = 'Carga baja porque la semana es de descarga. Es lo previsto.'; }
      else if(intensidadPlan === null){ flagText = 'carga baja'; acwrNota = 'Estás por debajo de tu media del último mes. No hay microciclo activo con el que contrastarlo: si es una descarga buscada, ignóralo.'; }
      else { flagText = 'carga baja'; acwrNota = 'Estás entrenando por debajo de tu media del último mes.'; }
    } else if(r > 1.3){
      if(intensidadPlan === 4){ flagText = 'pico planificado'; acwrNota = 'Subida fuerte, coherente con una semana de pico. Vigila las sensaciones.'; }
      else if(intensidadPlan === null){ flagText = 'subida brusca'; acwrNota = 'La carga ha subido más rápido que tu adaptación. Sin microciclo activo no puedo saber si estaba previsto.'; }
      else { flagText = 'subida brusca'; acwrNota = 'La carga ha subido más rápido que tu adaptación. Asociado a más riesgo de lesión.'; }
    } else { flagText = 'zona óptima'; }
  }

  const avgOverallRPE = (entries.reduce((a,e)=>a+e.overallRPE,0)/entries.length).toFixed(1);
  // Las entradas antiguas (o importadas) pueden no traer las cuatro escalas de
  // bienestar. Promediamos sólo las que existan y descartamos las que no tengan
  // ninguna, en vez de arrastrar un NaN por toda la pantalla.
  const wellnessOf = e => {
    const vals = [e.fatiga, e.calidad, e.hidratacion, e.satisfaccion]
      .filter(v => typeof v === 'number' && !isNaN(v));
    return vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null;
  };
  const wellVals = entries.map(wellnessOf).filter(v => v !== null);
  const avgWellness = wellVals.length ? (wellVals.reduce((a,b)=>a+b,0)/wellVals.length).toFixed(1) : '—';
  // ---- Resumen en lenguaje claro ----
  // Un número como "2837 de carga" no le dice nada a nadie. Lo traducimos a
  // comparaciones que sí se entienden: cuánto has entrenado frente a la semana
  // pasada y si esa subida es asumible.
  const sesiones7 = entries.filter(e=>(now-new Date(e.date))/86400000<=7).length;
  const minutos7 = Math.round(entries.filter(e=>(now-new Date(e.date))/86400000<=7)
    .reduce((a,e)=>a+(e.durationSeconds||0),0)/60);
  const sumPrev = entries.filter(e=>{ const d=(now-new Date(e.date))/86400000; return d>7 && d<=14; })
    .reduce((a,e)=>a+(e.fatigueScore||0),0);
  let compara = '', flechaCls = 'igual', flecha = '=';
  if(sumPrev > 0){
    const pct = Math.round(((sum7 - sumPrev)/sumPrev)*100);
    if(pct > 8){ flecha='↑'; flechaCls='sube'; compara = `Has entrenado un <b>${pct}% más</b> que la semana pasada.`; }
    else if(pct < -8){ flecha='↓'; flechaCls='baja'; compara = `Has entrenado un <b>${Math.abs(pct)}% menos</b> que la semana pasada.`; }
    else { compara = `Has entrenado <b>prácticamente lo mismo</b> que la semana pasada.`; }
  } else {
    compara = 'Todavía no hay semana anterior con la que comparar.';
  }

  // Semáforo del ACWR en lenguaje llano
  let semaforo = null;
  if(acwrFiable){
    const r = sum7/chronicWeekly;
    if(r < 0.8) semaforo = { color:'ambar', titulo:'Por debajo de tu ritmo habitual',
      texto: flagText==='descarga planificada' ? 'Es una semana de descarga: está previsto y te viene bien.' : 'Si no es una descarga buscada, te estás quedando corto respecto a tu media del último mes.' };
    else if(r > 1.3) semaforo = { color:'rojo', titulo:'Subida rápida de carga',
      texto: flagText==='pico planificado' ? 'Coincide con una semana de pico: vigila el sueño y las molestias.' : 'Has subido más rápido de lo que sueles adaptarte. Es cuando más aparecen las lesiones: cuida el descanso.' };
    else semaforo = { color:'verde', titulo:'Carga bien ajustada',
      texto:'Estás entrenando en el margen donde se progresa sin acumular riesgo. Es donde quieres estar.' };
  }

  html += `<div class="resumen-carga">
    <div class="rc-cabecera">
      <span class="rc-flecha ${flechaCls}">${flecha}</span>
      <div>
        <b>Esta semana: ${sesiones7} ${sesiones7===1?'sesión':'sesiones'} · ${minutos7} min</b>
        <span>${compara}</span>
      </div>
    </div>
    ${semaforo?`<div class="rc-sem ${semaforo.color}">
      <b>${semaforo.titulo}</b>
      <span>${semaforo.texto}</span>
    </div>`:`<div class="rc-sem gris">
      <b>Aún sin lectura de riesgo</b>
      <span>${acwrNota||'Hacen falta unas semanas de registro para valorar si tu carga sube demasiado rápido.'}</span>
    </div>`}
  </div>`;

  html += `<div class="kpi-row">
    <div class="kpi" title="Suma del esfuerzo de tus sesiones: minutos por RPE"><b>${sum7.toFixed(0)}</b><span>Carga semanal</span></div>
    <div class="kpi" title="Relación entre esta semana y tu media del último mes"><b>${acwrVal}</b><span>Ratio de carga</span></div>
    <div class="kpi"><b>${avgOverallRPE}</b><span>Esfuerzo medio</span></div>
    <div class="kpi"><b>${avgWellness}/5</b><span>Bienestar</span></div>
  </div>
  <details class="expl"><summary>¿Qué significan estos números?</summary>
    <p><b>Carga semanal</b>: cuánto has entrenado en total, combinando duración y esfuerzo. Sirve para comparar semanas entre sí, no como nota.</p>
    <p><b>Ratio de carga</b>: compara esta semana con tu media del último mes. Entre 0,8 y 1,3 es la zona donde se progresa con menos riesgo. Por encima de 1,3, la carga sube más rápido de lo que el cuerpo se adapta.</p>
    <p><b>Esfuerzo medio</b>: lo duras que te han parecido las sesiones, del 1 al 10.</p>
    <p><b>Bienestar</b>: media de fatiga, calidad, hidratación y satisfacción que anotas al terminar.</p>
  </details>`;
  // Con muchas sesiones las barras quedarían de menos de 2px. Mostramos las
  // últimas 30, que es lo que de verdad se lee en un móvil.
  // Reparto por tipo de sesión en los últimos 28 días
  const desde = new Date(); desde.setDate(desde.getDate()-28);
  const ult28 = entries.filter(e=>new Date(e.date+'T00:00:00') >= desde);
  if(ult28.length){
    const cuenta = {}, cargaPorTipo = {};
    ult28.forEach(e=>{
      const t = tipoDeSesion(e);
      cuenta[t] = (cuenta[t]||0)+1;
      cargaPorTipo[t] = (cargaPorTipo[t]||0) + (e.fatigueScore||0);
    });
    const tipos = Object.keys(cuenta).sort((a,b)=>cuenta[b]-cuenta[a]);
    const maxC = Math.max(...tipos.map(t=>cuenta[t]),1);
    html += `<div style="background:var(--panel2);border-radius:8px;padding:14px;margin-bottom:12px;">
      <div style="font-size:11px;color:var(--muted);margin-bottom:10px;">Reparto por tipo de sesión · últimos 28 días (${ult28.length} sesiones)</div>`;
    tipos.forEach(t=>{
      const pct = (cuenta[t]/maxC)*100;
      html += `<div class="hstat" style="margin-bottom:10px;">
        <div class="hstat-top"><span>${escapeHtml(t)}</span><b>${cuenta[t]} ${cuenta[t]===1?'sesión':'sesiones'}</b></div>
        <div class="hstat-bar"><i style="width:${pct.toFixed(0)}%;"></i></div>
        <div class="hstat-sub">carga acumulada ${cargaPorTipo[t].toFixed(0)}</div>
      </div>`;
    });
    html += `</div>`;
  }

  // Carga por día de la ÚLTIMA SEMANA (lunes a domingo), con su fecha debajo.
  // Ver "L 15 · M 16 · X 17…" hace evidente cómo fluctúa la intensidad, algo
  // que una tira de 30 barras anónimas no conseguía transmitir.
  const INI_SEM = ['L','M','X','J','V','S','D'];
  const lunesActual = weekOfISO();
  const diasSemana = [];
  for(let k=0;k<7;k++){
    const dte = new Date(lunesActual+'T00:00:00');
    dte.setDate(dte.getDate()+k);
    const iso = fechaLocalISO(dte);
    const delDia = entries.filter(e=>e.date===iso);
    diasSemana.push({
      iso, inicial: INI_SEM[k], numero: dte.getDate(),
      carga: delDia.reduce((a,e)=>a+(e.fatigueScore||0),0),
      sesiones: delDia.length,
      esHoy: iso === todayISO()
    });
  }
  const maxDia = Math.max(...diasSemana.map(d=>d.carga), 1);
  const totalSemana = diasSemana.reduce((a,d)=>a+d.carga,0);
  html += `<div class="carga-sem">
    <div class="cs-cab">
      <span>Carga por día · esta semana</span>
      <span class="cs-total">${totalSemana ? Math.round(totalSemana)+' total' : 'sin sesiones aún'}</span>
    </div>
    <div class="cs-barras">
      ${diasSemana.map(d=>`
        <div class="cs-dia ${d.esHoy?'hoy':''} ${d.carga?'':'vacio'}">
          <span class="cs-val">${d.carga?Math.round(d.carga):''}</span>
          <div class="cs-barra" style="height:${d.carga?Math.max(6,(d.carga/maxDia)*72):3}px;"></div>
          <span class="cs-lbl">${d.inicial}</span>
          <span class="cs-num">${d.numero}</span>
        </div>`).join('')}
    </div>
    <p class="cs-pie">La altura es la carga de ese día (RPE × minutos). Los huecos son descanso, y también forman parte del plan.</p>
  </div>`;

  // Historial más largo, por si quiere ver la tendencia de fondo.
  const MAX_BARRAS = 30;
  if(entries.length > 7){
    const recientes = entries.slice(-MAX_BARRAS);
    const loads = recientes.map(e=>e.fatigueScore); const maxLoad = Math.max(...loads,1);
    html += `<div style="background:var(--panel2);border-radius:8px;padding:14px;margin-bottom:12px;"><div style="font-size:11px;color:var(--muted);margin-bottom:8px;">Historial de carga · últimas ${Math.min(MAX_BARRAS, entries.length)} sesiones</div>
      <div style="display:flex;align-items:flex-end;gap:3px;height:60px;">${loads.map(l=>`<div style="flex:1;min-width:3px;background:var(--accent);border-radius:2px 2px 0 0;height:${Math.max(3,(l/maxLoad)*60)}px;opacity:0.65;"></div>`).join('')}</div></div>`;
  }
  html += `</div>`;
  html += tplMetricasEjercicio(entries);
  if(TENIS_ACTIVO) html += tplMetricasDrills(entries);
  return html;
}

// ---------- PERFIL (atleta, propio) ----------
// Orientación de recuperación tras la sesión. Deliberadamente cualitativa: las
// fórmulas que dan "X horas exactas" a partir del sRPE tienen respaldo débil y
// varían mucho entre personas, así que damos pautas, no cifras falsas.
function guiaRecuperacion(carga, rpe, minutos){
  let nivel, titulo, pautas;
  if(carga < 250 || rpe <= 4){
    nivel='suave'; titulo='Carga ligera';
    pautas = ['Puedes entrenar mañana con normalidad.','Suficiente con tu rutina habitual de sueño e hidratación.'];
  } else if(carga < 500 || rpe <= 6){
    nivel='moderada'; titulo='Carga moderada';
    pautas = ['Mañana puedes volver a entrenar, mejor si es otro patrón o grupo muscular.','Come algo con proteína en las próximas 2 horas.','Duerme tus horas habituales.'];
  } else if(carga < 800 || rpe <= 8){
    nivel='alta'; titulo='Carga alta';
    pautas = ['Deja al menos 24 h antes de repetir un estímulo similar.','Prioriza sueño: es donde de verdad se adapta el cuerpo.','Proteína e hidratación en las próximas horas.','Si mañana entrenas, que sea suave o de otro patrón.'];
  } else {
    nivel='muy alta'; titulo='Carga muy alta';
    pautas = ['Deja 48 h antes de repetir un estímulo parecido.','El sueño de esta noche es lo más determinante para recuperarte.','Cuida la comida posterior: proteína e hidratos.','Mañana, descanso activo o movilidad.','Si aparece dolor articular o el sueño empeora, coméntaselo a tu entrenador.'];
  }
  return {nivel, titulo, pautas};
}
function tplRecuperacion(carga, rpe, minutos){
  const g = guiaRecuperacion(carga, rpe, minutos);
  const color = g.nivel==='suave'||g.nivel==='moderada' ? 'var(--accent)' : 'var(--warn)';
  return `<div class="card" id="recoveryCard" style="margin-top:14px;border-left:3px solid ${color};">
    <h2>Recuperación</h2>
    <div style="font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--muted);margin-bottom:10px;">
      ${minutos} min · RPE ${rpe} · carga ${carga} — <b style="color:${color};">${g.titulo}</b>
    </div>
    <ul style="margin:0 0 0 18px;padding:0;font-size:13.5px;line-height:1.65;">
      ${g.pautas.map(p=>`<li>${p}</li>`).join('')}
    </ul>
    <p style="font-size:11px;color:var(--muted);margin-top:10px;">Orientación general a partir de tu carga y esfuerzo. No sustituye a cómo te encuentres: si sigues fatigado, díselo a tu entrenador.</p>
  </div>`;
}

// Dos orígenes: los que fija el entrenador (el atleta no puede tocarlos) y los
// que el atleta añade por su cuenta (sólo él los gestiona).
const HABIT_TYPES = {
  check:  'Sí / no',
  scale:  'Valoración 1-5',
  number: 'Cantidad'
};
const HABITS_SUGERIDOS = [
  {name:'Creatina', type:'check'},
  {name:'Horas de sueño', type:'number', unit:'h'},
  {name:'Calidad del sueño', type:'scale'},
  {name:'Pasos', type:'number', unit:'pasos'},
  {name:'Proteína objetivo', type:'check'},
  {name:'Hidratación', type:'scale'}
];
function habitId(){ return 'h'+uid(); }

async function getHabitDefs(athleteId){

  try{ cfg = raw ? JSON.parse(raw) : null; }catch(e){ cfg = null; }
  if(!cfg || !Array.isArray(cfg.coach) || !Array.isArray(cfg.athlete)) cfg = { coach:[], athlete:[] };
  return cfg;
}
async function saveHabitDefs(athleteId, cfg){

}
async function getHabitLog(athleteId){
  const raw = await safeGet('habits-'+athleteId, true);
  try{ const l = raw ? JSON.parse(raw) : {}; return (l && typeof l==='object') ? l : {}; }
  catch(e){ return {}; }
}
async function saveHabitLog(athleteId, log){
  return safeSet('habits-'+athleteId, JSON.stringify(log), true);
}
function ultimosDias(n){
  const out = [];
  for(let i=n-1;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    out.push(d.toISOString().slice(0,10));
  }
  return out;
}
// Estadística semanal por hábito: adherencia si es check, media si es escala o cantidad.
function statsHabito(def, log, dias){
  const vals = [];
  dias.forEach(f=>{ const d = log[f]; if(d && d[def.id] !== undefined && d[def.id] !== '') vals.push(d[def.id]); });
  if(!vals.length) return { texto:'sin datos', detalle:'0 de '+dias.length+' días', pct:0 };
  if(def.type === 'check'){
    const si = vals.filter(v=>v===true||v==='true').length;
    return { texto: si+'/'+dias.length+' días', detalle: Math.round(si/dias.length*100)+'% de adherencia', pct: si/dias.length*100 };
  }
  const nums = vals.map(v=>parseFloat(v)).filter(v=>!isNaN(v));
  if(!nums.length) return { texto:'sin datos', detalle:'', pct:0 };
  const media = nums.reduce((a,b)=>a+b,0)/nums.length;
  const max = def.type==='scale' ? 5 : Math.max(...nums,1);
  return {
    texto: (def.type==='scale' ? media.toFixed(1)+'/5' : (Number.isInteger(media)?media:media.toFixed(1))+(def.unit?' '+def.unit:'')),
    detalle: 'media de '+nums.length+' día'+(nums.length===1?'':'s'),
    pct: def.type==='scale' ? (media/max*100) : Math.min(100, media/max*100)
  };
}

// ¿Se cumplió ese hábito ese día? Para escalas y cantidades cuenta como
// cumplido si hay un registro con valor por encima de cero.
function habitoCumplido(def, dia){
  if(!dia) return null;
  const v = dia[def.id];
  if(v === undefined || v === '') return null;
  if(def.type === 'check') return (v === true || v === 'true');
  const n = parseFloat(v);
  return isNaN(n) ? null : n > 0;
}
// Gráfica de regularidad: la línea se corta los días sin registrar, para que
// los huecos se vean como lo que son y no como un cero.
function tplTendenciaHabitos(todos, log){
  const N = 21;
  const dias = ultimosDias(N);
  const total = todos.length || 1;
  const puntos = dias.map(f=>{
    const dia = log[f];
    if(!dia || !Object.keys(dia).length) return null;         // hueco real
    let cumplidos = 0;
    todos.forEach(h=>{ if(habitoCumplido(h, dia)) cumplidos++; });
    return cumplidos;
  });

  const w = 640, h = 150, padL = 26, padR = 12, padT = 14, padB = 26;
  const innerW = w - padL - padR, innerH = h - padT - padB;
  const x = i => padL + (N===1?innerW/2:(i/(N-1))*innerW);
  const y = v => padT + innerH - (total===0?0:(v/total)*innerH);

  // Tramos continuos: cada corte es un día sin registro
  const tramos = [];
  let actual = [];
  puntos.forEach((v,i)=>{
    if(v === null){ if(actual.length) tramos.push(actual); actual = []; }
    else actual.push({i, v});
  });
  if(actual.length) tramos.push(actual);

  let svg = `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;">`;
  [0, 0.5, 1].forEach(f=>{
    const yy = padT + innerH - f*innerH;
    svg += `<line x1="${padL}" y1="${yy.toFixed(1)}" x2="${w-padR}" y2="${yy.toFixed(1)}" stroke="var(--border)" stroke-width="1" stroke-dasharray="3 4"/>`;
    svg += `<text x="4" y="${(yy+3.5).toFixed(1)}" font-family="IBM Plex Mono, monospace" font-size="9" fill="var(--muted)">${Math.round(f*total)}</text>`;
  });
  tramos.forEach(tr=>{
    if(tr.length === 1){
      svg += `<circle cx="${x(tr[0].i).toFixed(1)}" cy="${y(tr[0].v).toFixed(1)}" r="3.5" fill="var(--accent)"/>`;
    } else {
      const pts = tr.map(p=>`${x(p.i).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
      svg += `<polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    }
    tr.forEach(p=>{ svg += `<circle cx="${x(p.i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="2.6" fill="var(--accent)"/>`; });
  });
  // Marcas de los días sin registrar
  puntos.forEach((v,i)=>{
    if(v !== null) return;
    svg += `<line x1="${x(i).toFixed(1)}" y1="${padT}" x2="${x(i).toFixed(1)}" y2="${padT+innerH}" stroke="var(--danger)" stroke-width="1" opacity="0.18"/>`;
  });
  svg += `<text x="${padL}" y="${h-8}" font-family="IBM Plex Mono, monospace" font-size="9" fill="var(--muted)">${dias[0].slice(8)}/${dias[0].slice(5,7)}</text>`;
  svg += `<text x="${w-padR}" y="${h-8}" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="9" fill="var(--muted)">hoy</text>`;
  svg += `</svg>`;

  const conDatos = puntos.filter(v=>v!==null).length;
  // Si no hay ni un solo día registrado, la gráfica saldría vacía y parecería
  // que está rota. Mejor explicar qué falta.
  if(!conDatos){
    return `<div class="card"><h2>Regularidad</h2>
      <div class="empty">Aún no has registrado ningún día. En cuanto marques tus hábitos un par de días, aquí verás tu gráfica de constancia de las últimas 3 semanas.</div></div>`;
  }
  const huecos = N - conDatos;
  const media = conDatos ? (puntos.filter(v=>v!==null).reduce((a,b)=>a+b,0)/conDatos) : 0;
  // Racha actual de días seguidos registrando
  let racha = 0;
  for(let i=puntos.length-1;i>=0;i--){ if(puntos[i]===null) break; racha++; }

  let html = `<div class="card"><h2>Regularidad</h2>
    <p style="font-size:12.5px;color:var(--muted);margin-bottom:12px;">Hábitos cumplidos cada día, últimos 21 días. La línea se corta los días que no registraste.</p>
    ${svg}
    <div class="kpi-row" style="margin-top:14px;">
      <div class="kpi"><b>${media.toFixed(1)}</b><span>Media de ${total}</span></div>
      <div class="kpi"><b>${racha}</b><span>Racha actual</span></div>
      <div class="kpi"><b>${huecos}</b><span>Días sin registrar</span></div>
    </div>`;

  // Detalle de hasta 3 hábitos elegidos
  const sel = Array.isArray(state.habitosSel) ? state.habitosSel.filter(id=>todos.some(h=>h.id===id)) : [];
  html += `<div class="block-title">Seguimiento detallado</div>
    <p style="font-size:12px;color:var(--muted);margin-bottom:10px;">Elige hasta 3 para compararlos día a día.</p>
    <div class="habit-pick">${todos.map(h=>`
      <button class="hp ${sel.includes(h.id)?'on':''}" data-habitsel="${h.id}">${escapeHtml(h.name)}</button>`).join('')}</div>`;

  if(sel.length){
    html += `<div class="hab-detalle">`;
    sel.forEach(id=>{
      const def = todos.find(h=>h.id===id);
      const celdas = dias.slice(-14).map(f=>{
        const c = habitoCumplido(def, log[f]);
        const cls = c === null ? 'na' : (c ? 'si' : 'no');
        return `<i class="${cls}" title="${f}"></i>`;
      }).join('');
      const s = statsHabito(def, log, dias);
      html += `<div class="hd-fila">
        <div class="hd-top"><span>${escapeHtml(def.name)}</span><b>${s.texto}</b></div>
        <div class="hd-celdas">${celdas}</div>
      </div>`;
    });
    html += `<div class="hd-leyenda"><span><i class="si"></i>cumplido</span><span><i class="no"></i>no</span><span><i class="na"></i>sin registrar</span></div>`;
    html += `</div>`;
  }
  html += `</div>`;
  return html;
}

async function tplHabitos(athleteId){
  const cfg = await getHabitDefs(athleteId);
  const log = await getHabitLog(athleteId);
  const hoy = todayISO();
  const deHoy = log[hoy] || {};
  const todos = [...cfg.coach.map(h=>({...h, fijo:true})), ...cfg.athlete.map(h=>({...h, fijo:false}))];

  let html = `<div class="card">
    <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:4px;">
      <h2 style="margin:0;">Check diario</h2>
      <button class="btn ghost small" id="closeHabitsBtn">← Calendario</button>
    </div>

  if(!todos.length){
    html += `<div class="empty">Aún no hay hábitos que seguir. Añade los tuyos abajo o espera a que tu entrenador te asigne alguno.</div>`;
  }
  todos.forEach(h=>{

    html += `<div class="habit-row">

        ${h.fijo?'<span class="habit-tag">de tu entrenador</span>':''}
      </div>`;
    if(h.type === 'check'){
      const si = (v===true||v==='true');
      const no = (v===false||v==='false');
      html += `<div class="row" style="gap:8px;">
        <button class="habit-check ${si?'on':''}" data-habit="${h.id}" data-type="check" data-val="si">✓ Sí</button>
        <button class="habit-check no ${no?'on':''}" data-habit="${h.id}" data-type="check" data-val="no">✕ No</button>
      </div>`;
    } else if(h.type === 'scale'){
      html += `<div class="scale" data-habitscale="${h.id}">${[1,2,3,4,5].map(n=>`<button data-val="${n}" class="${String(v)===String(n)?'sel':''}">${n}</button>`).join('')}</div>`;
    } else {
      html += `<div class="row"><input type="number" class="habit-num" data-habit="${h.id}" value="${v!==undefined?v:''}" placeholder="0" style="width:110px;">${h.unit?`<span style="font-size:12.5px;color:var(--muted);">${escapeHtml(h.unit)}</span>`:''}</div>`;
    }
    if(!h.fijo) html += `<button class="btn ghost small" data-delhabit="${h.id}" style="margin-top:8px;">Quitar</button>`;
    html += `</div>`;
  });

  html += `<div class="block-title">Añadir un hábito propio</div>
    <div class="ex-grid">
      <div class="full"><label class="field-label">Nombre</label><input type="text" id="newHabitName" placeholder="Ej. Estiramientos, Magnesio…" list="habitSuggestions" style="width:100%;"></div>
      <div><label class="field-label">Tipo</label><select id="newHabitType" style="width:100%;">${Object.keys(HABIT_TYPES).map(k=>`<option value="${k}">${HABIT_TYPES[k]}</option>`).join('')}</select></div>
      <div><label class="field-label">Unidad (opcional)</label><input type="text" id="newHabitUnit" placeholder="h, pasos, g" style="width:100%;"></div>
    </div>
    <button class="btn ghost" id="addHabitBtn" style="margin-top:10px;">+ Añadir</button>
  </div>`;

  // Estadística de constancia
  if(!todos.length){
    html += `<div class="card"><h2>Regularidad</h2>
      <div class="empty">Cuando tengas hábitos que seguir, aquí aparecerá tu gráfica de constancia. Añade los tuyos arriba o espera a que tu entrenador te asigne alguno.</div></div>`;
  }
  if(todos.length){
    const dias = ultimosDias(7);
    html += tplTendenciaHabitos(todos, log);
  }
  return html;
}

async function tplPerfilAtleta(athleteId){
  const me = state.athletes.find(a=>a.id===athleteId);
  const raw = await safeGet('intake-'+athleteId, true);
  const data = raw ? JSON.parse(raw) : null;
  const profRaw = await safeGet('profile-'+athleteId, true);
  const p = profRaw ? JSON.parse(profRaw) : {};
  const jRaw = await safeGet('journal-'+athleteId, true);
  const journal = jRaw ? JSON.parse(jRaw) : [];
  const callRaw = await safeGet('call-'+athleteId, true);
  const call = callRaw ? JSON.parse(callRaw) : {};

  // Resumen de entrenamiento
  const totalMin = Math.round(journal.reduce((a,e)=>a+(e.durationSeconds||0),0)/60);
  let firstDate = null;
  journal.forEach(e=>{ const d=new Date(e.date+'T00:00:00'); if(!firstDate||d<firstDate) firstDate=d; });

  let html = `<div class="card"><h2>${escapeHtml(me?me.name:'Tu perfil')}</h2>

  // Banner de la batería de tests: sólo aparece si hay una asignada.
  const batPerfil = await getBateria(athleteId);
  const histPerfil = await getHistorialTests(athleteId);
  if(batPerfil || histPerfil.length){
    const pend = batPerfil ? batPerfil.tests.filter(t=>!t.resultado || !Object.keys(t.resultado).length).length : 0;

      </span>
      <span class="task-arrow">${pend?'›':'✓'}</span>

  // Welcome Pack completado: su resumen vive aquí.

  // Banner de fotos de progreso: sólo si el objetivo lo justifica.

      </span>

  // Banner de Gym / Instalaciones
  const gymPerfil = await getGym(athleteId);
  const nArch = gymPerfil.carpetas.reduce((a,c)=>a+c.items.length,0);
  html += `<button class="task-banner ${nArch?'done':''}" id="abrirGymBtn" style="margin-top:10px;">

    if(p.pagado !== 'Sí'){
      if(dias < 0) vencAviso = `<div class="pending-task" style="margin-top:12px;"><span class="tag">Pago vencido</span>El plazo terminó hace ${Math.abs(dias)} día${Math.abs(dias)===1?'':'s'}.</div>`;

      ${p.alta?`<div><span>Alta</span><b>${escapeHtml(p.alta)}</b></div>`:''}
    </div>${vencAviso}

  // Ficha personal editable
  html += `<div class="card"><h2>Tus datos</h2>`;
  if(!data){

        <span class="task-arrow">›</span>

  INTAKE_FIELDS.forEach(f=>{

  html += `<div class="card"><h2>Ayuda</h2>

      <span class="task-txt"><b>Ver la guía de uso</b><span>Cómo funcionan la rutina, la sesión y el cuestionario</span></span>

}

// Reúne todas las veces que se ha hecho un test concreto, de la batería activa
// y de las archivadas, ordenadas de más antigua a más reciente.
function historicoDeTest(testId, batActiva, historial){
  const tandas = [];
  (historial||[]).forEach(h=>{
    const t = (h.tests||[]).find(x=>x.testId===testId);
    if(t && t.resultado && Object.keys(t.resultado).length) tandas.push({ fecha:h.fecha, ...t });
  });
  if(batActiva){
    const t = (batActiva.tests||[]).find(x=>x.testId===testId);
    if(t && t.resultado && Object.keys(t.resultado).length) tandas.push({ fecha:batActiva.fecha, ...t });
  }
  return tandas.sort((a,b)=>String(a.fecha).localeCompare(String(b.fecha)));
}

// Compara dos valores del mismo campo e indica si ha mejorado. `mayorMejor`
// es false en los campos donde bajar es progresar (p. ej. tiempos).
function comparaValor(antes, ahora, mayorMejor){
  const a = parseFloat(antes), b = parseFloat(ahora);
  if(isNaN(a) || isNaN(b)) return null;
  const dif = b - a;
  if(Math.abs(dif) < 0.001) return { dif:0, texto:'igual', clase:'igual' };
  const mejora = mayorMejor === false ? dif < 0 : dif > 0;
  const signo = dif > 0 ? '+' : '';
  return { dif, texto:`${signo}${Math.round(dif*10)/10}`, clase: mejora ? 'mejor' : 'peor' };
}

// Campos cuyo progreso tiene sentido comparar numéricamente, por test.
const CAMPOS_COMPARABLES = {
  dorsiflexion: [{ id:'cmDer', label:'Tobillo derecho', unidad:'cm' }, { id:'cmIzq', label:'Tobillo izquierdo', unidad:'cm' }],
  glenohumeral: [{ id:'cmDerArriba', label:'Brazo derecho arriba', unidad:'cm', mayorMejor:false },
                 { id:'cmIzqArriba', label:'Brazo izquierdo arriba', unidad:'cm', mayorMejor:false }],
  rm6_sentadilla: [{ id:'peso', label:'Peso movido', unidad:'kg' }],
  rm6_banca:      [{ id:'peso', label:'Peso movido', unidad:'kg' }],
  rm6_muerto:     [{ id:'peso', label:'Peso movido', unidad:'kg' }]
};

// Tarjeta de evolución de un test entre tandas.
function tplComparativaTest(def, tandas){
  if(tandas.length < 2) return '';
  const primera = tandas[0], ultima = tandas[tandas.length-1];
  let filas = '';

  // Campos numéricos definidos, o los del propio test si son numéricos.
  let campos = CAMPOS_COMPARABLES[def.id];
  if(!campos){
    campos = (def.campos||[]).filter(c=>c.tipo==='number').map(c=>({ id:c.id, label:c.label, unidad:'' }));
  }
  campos.forEach(c=>{
    const cmp = comparaValor(primera.resultado[c.id], ultima.resultado[c.id], c.mayorMejor);
    if(!cmp) return;
    filas += `<tr>
      <td>${escapeHtml(c.label)}</td>
      <td class="col-prev">${escapeHtml(String(primera.resultado[c.id]))}${c.unidad?' '+c.unidad:''}</td>
      <td><b>${escapeHtml(String(ultima.resultado[c.id]))}${c.unidad?' '+c.unidad:''}</b></td>
      <td class="cmp-${cmp.clase}">${cmp.texto}${c.unidad&&cmp.dif!==0?' '+c.unidad:''}</td>
    </tr>`;
  });

  // Para los tests de fuerza, comparamos también el 1RM estimado.
  if(def.lift){
    const rmA = estima1RM(primera.resultado.peso, primera.resultado.reps);
    const rmB = estima1RM(ultima.resultado.peso, ultima.resultado.reps);
    const cmp = comparaValor(rmA, rmB, true);
    if(cmp) filas += `<tr>
      <td><b>1RM estimado</b></td>
      <td class="col-prev">${rmA} kg</td>
      <td><b>${rmB} kg</b></td>
      <td class="cmp-${cmp.clase}">${cmp.texto} kg</td>
    </tr>`;
  }

  // Y la evolución de tus tres valoraciones.
  TEST_VALORACIONES.forEach(v=>{
    const a = (primera.valoracion||{})[v.id], b = (ultima.valoracion||{})[v.id];
    const cmp = comparaValor(a, b, true);
    if(!cmp) return;
    filas += `<tr>
      <td>${escapeHtml(v.label)}</td>
      <td class="col-prev">${a}/5</td>
      <td><b>${b}/5</b></td>
      <td class="cmp-${cmp.clase}">${cmp.texto}</td>
    </tr>`;
  });

  if(!filas) return '';
  return `<div class="card"><h2>${escapeHtml(def.nombre)}</h2>
    <p style="font-size:12px;color:var(--muted);margin-bottom:10px;">${tandas.length} mediciones · de ${primera.fecha} a ${ultima.fecha}</p>
    <div class="tabla-comp-wrap"><table class="tabla-comp">
      <thead><tr><th>Dato</th><th>Primera</th><th>Última</th><th>Cambio</th></tr></thead>
      <tbody>${filas}</tbody>
    </table></div>
  </div>`;
}

  // Lee el formulario al objeto en memoria, para no perder nada al repintar.
  const leer = ()=>{

    test.modo = document.getElementById('tedModo').value;
    test.patron = document.getElementById('tedPatron').value;

  function bindEditor(){
    document.getElementById('cerrarTestEd').addEventListener('click', ()=>back.remove());

    const chk = document.getElementById('tedPideVideo');

      const ok = await saveTestsPropios(lista);
      toast(ok?'Test eliminado':'No se pudo eliminar', !ok);

      if(ok) renderScrollTop();
    });
    document.getElementById('tedGuardar').addEventListener('click', async ()=>{
      leer();
      if(!test.nombre){ toast('Ponle un nombre al test', true); return; }
      const validos = test.campos.filter(c=>c.label);
      if(!validos.length){ toast('Añade al menos un dato que pedirle', true); return; }
      test.campos = validos;
      const lista = await getTestsPropios();
      const i = lista.findIndex(t=>t.id===test.id);
      if(i >= 0) lista[i] = test; else lista.push(test);
      const ok = await saveTestsPropios(lista);
      toast(ok?'Test guardado':'No se pudo guardar', !ok);
      back.remove();
      if(ok) renderScrollTop();
    });
  }
  pintar();
}

// ---------- FOTOS DE PROGRESO: PANTALLA COMPARTIDA ----------
async function tplProgresoFotos(athleteId, esCoach){
  const prog = await getProgreso(athleteId);
  const pide = objetivoPideFotos(prog.objetivo);

  let html = '';
  if(!esCoach){
    html += `<div class="row" style="margin-bottom:12px;"><button class="btn ghost small" id="volverPerfilFotosBtn">← Perfil</button></div>`;
  }

  if(!pide){
    return html + `<div class="card"><h2>Fotos de progreso</h2>
      <div class="empty">${esCoach
        ? 'No se piden fotos con el objetivo actual. Cámbialo al enviar una batería si quieres valorar composición corporal.'
        : 'Tu objetivo no requiere fotos de progreso ahora mismo.'}</div></div>`;
  }

  html += `<div class="card"><h2>Fotos de progreso</h2>
    <p style="font-size:12.5px;color:var(--muted);line-height:1.6;">${esCoach
      ? 'Comparativa de composición corporal entre tomas. Sólo aparecen porque el objetivo lo justifica.'
      : 'Tres fotos cada pocas semanas, siempre en las mismas condiciones: misma luz, misma hora (mejor en ayunas por la mañana), misma distancia y ropa ajustada. Lo que importa no es cada foto suelta, sino poder compararlas.'}</p>
    ${!esCoach ? `<p style="font-size:12px;color:var(--muted);line-height:1.6;margin-top:8px;">Postura: de pie, relajado, brazos a los lados. No aprietes ni metas tripa — una foto forzada no sirve para comparar.</p>` : ''}
  </div>`;

  // Nueva toma (sólo el atleta sube)
  if(!esCoach){
    const enCurso = state.tomaEnCurso || {};
    html += `<div class="card"><h2>Nueva toma</h2>
      <div class="ex-grid">
        <div class="full"><label class="field-label">Fecha</label>
          <input type="date" id="tomaFecha" value="${enCurso.fecha||todayISO()}" max="${todayISO()}" style="width:100%;"></div>
        <div class="full"><label class="field-label">Peso de hoy (kg, opcional)</label>
          <input type="number" id="tomaPeso" step="any" inputmode="decimal" value="${enCurso.peso||''}" style="width:100%;"></div>
      </div>`;
    PLANOS_FOTO.forEach(pl=>{
      const ya = enCurso[pl];
      html += `<div class="video-row">
        ${ya
          ? `<span class="video-tag">✓ ${escapeHtml(pl)}</span>
             <button class="btn ghost small" data-tomaquitar="${escapeHtml(pl)}">Quitar</button>`
          : `<span class="video-tag" style="background:var(--panel3);color:var(--muted);">${escapeHtml(pl)}</span>
             <input type="file" accept="image/*" class="toma-file" data-plano="${escapeHtml(pl)}" style="flex:1;min-width:0;font-size:12px;">
             <button class="btn small" data-tomasubir="${escapeHtml(pl)}">Subir</button>`}
      </div>`;
    });
    const completa = PLANOS_FOTO.every(pl=>enCurso[pl]);
    html += `<button class="btn" id="guardarTomaBtn" style="margin-top:12px;" ${completa?'':'disabled'}>
      ${completa?'Guardar esta toma':'Sube los tres planos para guardar'}</button></div>`;
  }

  // Tomas guardadas
  if(!prog.tomas.length){
    html += `<div class="card"><div class="empty">Aún no hay ninguna toma guardada.</div></div>`;
  } else {
    const tomas = prog.tomas.slice().sort((a,b)=>String(a.fecha).localeCompare(String(b.fecha)));
    const primera = tomas[0], ultima = tomas[tomas.length-1];

    // Comparativa primera vs última, que es lo que de verdad enseña el cambio
    if(tomas.length >= 2){
      html += `<div class="card"><h2>Primera vs última</h2>
        <p style="font-size:12px;color:var(--muted);margin-bottom:10px;">${primera.fecha} → ${ultima.fecha}${
          (primera.peso && ultima.peso) ? ` · ${primera.peso} kg → <b>${ultima.peso} kg</b>` : ''}</p>`;
      PLANOS_FOTO.forEach(pl=>{
        if(!primera[pl] || !ultima[pl]) return;
        html += `<div class="block-title">${escapeHtml(pl)}</div>
          <div class="comp-fotos">
            <figure><img src="${escapeHtml(primera[pl].url)}" loading="lazy" data-gymfoto="${escapeHtml(primera[pl].url)}|${escapeHtml(pl+' · '+primera.fecha)}"><figcaption>${primera.fecha}</figcaption></figure>
            <figure><img src="${escapeHtml(ultima[pl].url)}" loading="lazy" data-gymfoto="${escapeHtml(ultima[pl].url)}|${escapeHtml(pl+' · '+ultima.fecha)}"><figcaption>${ultima.fecha}</figcaption></figure>
          </div>`;
      });
      html += `</div>`;
    }

    html += `<div class="card"><h2>Todas las tomas</h2>`;
    tomas.slice().reverse().forEach(t=>{
      html += `<div class="entry">
        <div class="entry-top"><span>${t.fecha}</span><span>${t.peso?t.peso+' kg':''}</span></div>
        <div class="gym-grid" style="margin-top:8px;">
          ${PLANOS_FOTO.filter(pl=>t[pl]).map(pl=>`
            <div class="gym-item">
              <img src="${escapeHtml(t[pl].url)}" loading="lazy" data-gymfoto="${escapeHtml(t[pl].url)}|${escapeHtml(pl+' · '+t.fecha)}">
              <span class="gym-cap">${escapeHtml(pl)}</span>
            </div>`).join('')}
        </div>
        ${!esCoach?`<button class="btn ghost small" data-tomaborrar="${t.id}" style="margin-top:8px;">Eliminar toma</button>`:''}
      </div>`;
    });
    html += `</div>`;
  }
  return html;
}

// ---------- TESTS: PANTALLA DEL ATLETA ----------
async function tplTestsAtleta(athleteId){
  await getTestsPropios();          // para que reconozca tus tests propios
  const bat = await getBateria(athleteId);
  const historial = await getHistorialTests(athleteId);
  const intakeRaw = await safeGet('intake-'+athleteId, true);
  const intake = intakeRaw ? JSON.parse(intakeRaw) : {};

  // Si no hay batería activa pero sí historial, mostramos su evolución: es lo
  // que más engancha de repetir los tests pasados unos meses.
  if(!bat){
    const ids = new Set();
    historial.forEach(h=>(h.tests||[]).forEach(t=>{ if(t.resultado && Object.keys(t.resultado).length) ids.add(t.testId); }));
    let ev = '';
    ids.forEach(id=>{
      const def = testPorId(id);
      if(def) ev += tplComparativaTest(def, historicoDeTest(id, null, historial));
    });
    return `<div class="row" style="margin-bottom:12px;"><button class="btn ghost small" id="volverPerfilBtn">← Perfil</button></div>
      <div class="card"><h2>Tests</h2><div class="empty">No tienes ninguna batería pendiente ahora mismo.</div></div>
      ${ev ? `<div class="block-title">Tu evolución</div>` + ev : ''}`;
  }

  const total = bat.tests.length;
  const hechos = bat.tests.filter(t=>t.resultado && Object.keys(t.resultado).length).length;
  let html = `<div class="row" style="margin-bottom:12px;"><button class="btn ghost small" id="volverPerfilBtn">← Perfil</button></div>
    <div class="card"><h2>Tu batería de tests</h2>
    <p style="font-size:12.5px;color:var(--muted);line-height:1.6;">Tómatelos con calma: no es una prueba que aprobar, es la foto de partida para ajustar tu plan. Lee las instrucciones, grábate como se indica y anota los datos con honestidad — un dato inflado solo sirve para que te programe mal.</p>
    <div class="kpi-row" style="margin-top:12px;"><div class="kpi"><b>${hechos}/${total}</b><span>Completados</span></div></div>
  </div>`;

  bat.tests.forEach((t,i)=>{
    const def = testPorId(t.testId);
    if(!def) return;
    const r = t.resultado || {};
    const hecho = Object.keys(r).length > 0;
    const abierto = state.testAbierto === i;
    html += `<div class="acc ${abierto?'open':''}" data-testacc="${i}">
      <div class="acc-head" data-toggle-test="${i}">
        <b style="text-transform:none;">${hecho?'✓ ':''}${escapeHtml(def.nombre)}</b>
        <span class="chev"><span class="chev-arrow">▾</span></span>
        <span class="chev-count">${escapeHtml(def.modo||'')}</span>
      </div>
      <div class="acc-body">
        <div class="test-instr">${escapeHtml(def.instrucciones||'')}</div>`;

    // Vídeo de demostración que hayas adjuntado al test
    if(def.videoUrl){
      html += `<button class="btn ghost small" data-playvideo="${escapeHtml(def.videoUrl)}|${escapeHtml(def.nombre)}" style="margin-bottom:12px;">▶ Ver cómo se hace</button>`;
    }

    // Campos a rellenar
    html += `<div class="ex-grid">`;
    (def.campos||[]).forEach(c=>{
      const v = r[c.id] !== undefined ? r[c.id] : '';
      html += `<div class="full"><label class="field-label">${escapeHtml(c.label)}</label>`;
      if(c.tipo==='select'){
        html += `<select class="test-campo" data-testidx="${i}" data-campo="${c.id}" style="width:100%;">
          <option value="">Selecciona…</option>
          ${c.opciones.map(o=>`<option value="${escapeHtml(o)}" ${v===o?'selected':''}>${escapeHtml(o)}</option>`).join('')}
        </select>`;
      } else {
        html += `<input type="${c.tipo==='number'?'number':'text'}" class="test-campo" data-testidx="${i}" data-campo="${c.id}" value="${escapeHtml(String(v))}" style="width:100%;" ${c.tipo==='number'?'step="any" inputmode="decimal"':''}>`;
      }
      html += `</div>`;
    });
    html += `</div>`;

    // Subida de vídeo por plano
    if(def.pideVideo){
      html += `<div class="block-title">Vídeo (${(def.planos||['Vídeo']).join(' y ')})</div>`;
      (def.planos||['Vídeo']).forEach(plano=>{
        const ya = (t.videos||[]).find(v=>v.plano===plano);
        html += `<div class="video-row">
          ${ya
            ? `<span class="video-tag">▶ ${escapeHtml(plano)}</span>
               <button class="btn ghost small" data-playvideo="${escapeHtml(ya.url)}|${escapeHtml(plano)}">Ver</button>
               <button class="btn ghost small" data-testvidquitar="${i}|${escapeHtml(plano)}">Quitar</button>`
            : `<span class="video-tag" style="background:var(--panel3);color:var(--muted);">${escapeHtml(plano)}</span>
               <input type="file" accept="video/*" class="test-video-file" data-testidx="${i}" data-plano="${escapeHtml(plano)}" style="flex:1;min-width:0;font-size:12px;">
               <button class="btn small" data-testvidsubir="${i}|${escapeHtml(plano)}">Subir</button>`}
        </div>`;
      });
    }

    html += `<button class="btn" data-guardartest="${i}" style="margin-top:12px;">${hecho?'Actualizar resultado':'Guardar resultado'}</button>`;

    // Devolución: estimación (si el entrenador la habilitó) y sus notas
    if(hecho){
      if(bat.mostrarEstimaciones){
        const est = estimacionDeTest(def, r, intake);
        if(est){
          html += `<div class="rd-zona rd-${est.nivel==='bueno'?'verde':(est.nivel==='medio'?'ambar':'rojo')}" style="margin-top:14px;">
            <div><b>${est.titular ? escapeHtml(est.titular) : 'Qué dice tu resultado'}</b><span>${escapeHtml(est.texto)}</span></div>
          </div>`;
        }
      }
      const val = t.valoracion || {};
      if(Object.keys(val).length){
        html += `<div class="block-title">Valoración de tu entrenador</div><div class="rd-detalle">`;
        TEST_VALORACIONES.forEach(v=>{ if(val[v.id]) html += `<span>${v.label}: <b>${val[v.id]}/5</b></span>`; });
        html += `</div>`;
      }
      if(t.notaCoach){
        html += `<div class="demo-nota" style="margin-top:10px;">${escapeHtml(t.notaCoach)}</div>`;
      }
    }
    html += `</div></div>`;
  });

  // Evolución respecto a tandas anteriores del mismo test
  let evol = '';
  bat.tests.forEach(t=>{
    const def = testPorId(t.testId);
    if(!def) return;
    evol += tplComparativaTest(def, historicoDeTest(t.testId, bat, historial));
  });
  if(evol) html += `<div class="block-title">Tu evolución</div>` + evol;
  return html;
}

      </div>`;

  // Sólo tiene sentido si algún test se ha medido al menos dos veces.
  const idsMedidos = new Set();
  (historial||[]).forEach(h=>(h.tests||[]).forEach(t=>{ if(t.resultado && Object.keys(t.resultado).length) idsMedidos.add(t.testId); }));
  if(bat) (bat.tests||[]).forEach(t=>{ if(t.resultado && Object.keys(t.resultado).length) idsMedidos.add(t.testId); });
  let compHtml = '';
  idsMedidos.forEach(id=>{
    const def = testPorId(id);
    if(!def) return;
    const tandas = historicoDeTest(id, bat, historial);
    compHtml += tplComparativaTest(def, tandas);
  });
  if(compHtml){
    html += `<div class="block-title" style="margin-top:20px;">Evolución entre tandas</div>` + compHtml;
  }

  // --- Historial de baterías anteriores ---
  if(historial.length){

    html += `</div>`;

}

// ---------- PERIODIZACIÓN: VISTA ----------
function periodChartSvg(macro){
  const micros = macro.micros;
  if(!micros.length) return '<div class="empty">Añade microciclos para ver la curva.</div>';
  const w = Math.max(560, micros.length*54), h = 210;
  const padL = 40, padR = 20, padT = 30, padB = 46;
  const innerW = w - padL - padR, innerH = h - padT - padB;
  const x = i => micros.length===1 ? padL+innerW/2 : padL + (i/(micros.length-1))*innerW;
  const y = v => padT + innerH - ((v-1)/3)*innerH;
  let g = '';
  for(let lvl=1; lvl<=4; lvl++){
    g += `<line x1="${padL}" y1="${y(lvl).toFixed(1)}" x2="${w-padR}" y2="${y(lvl).toFixed(1)}" stroke="var(--border)" stroke-width="1" stroke-dasharray="3 4"/>`;
    g += `<text x="${padL-8}" y="${(y(lvl)+3.5).toFixed(1)}" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="10" fill="var(--muted)">${lvl}</text>`;
  }
  micros.forEach((m,i)=>{
    const bh = ((m.volume||1)/4)*innerH;
    const bw = Math.min(26, innerW/Math.max(micros.length,1)*0.5);
    g += `<rect x="${(x(i)-bw/2).toFixed(1)}" y="${(padT+innerH-bh).toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" fill="var(--accent)" opacity="0.13" rx="2"/>`;
  });
  (macro.competitions||[]).forEach(c=>{
    if(!c.date) return;
    const start = new Date(macro.startDate+'T00:00:00');
    const cd = new Date(c.date+'T00:00:00');
    if(isNaN(start)||isNaN(cd)) return;
    const weeks = (cd - start)/(7*86400000);
    // El rango válido llega hasta el FINAL de la última semana, no hasta su
    // lunes: una carrera en domingo cae ~0.86 semanas después del último punto.
    if(weeks < -0.5 || weeks > micros.length) return;
    const denom = Math.max(1, micros.length-1);
    let cx = padL + (weeks/denom)*innerW;
    cx = Math.max(padL, Math.min(w-padR, cx));
    g += `<line x1="${cx.toFixed(1)}" y1="${padT-6}" x2="${cx.toFixed(1)}" y2="${padT+innerH}" stroke="var(--danger)" stroke-width="1.6"/>`;
    g += `<circle cx="${cx.toFixed(1)}" cy="${padT-10}" r="4" fill="var(--danger)"/>`;
    const anchor = cx > w-padR-40 ? 'end' : (cx < padL+40 ? 'start' : 'middle');
    g += `<text x="${cx.toFixed(1)}" y="${padT-18}" text-anchor="${anchor}" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="var(--danger)">${escapeHtml((c.name||'Comp.').slice(0,14))}</text>`;
  });
  const pts = micros.map((m,i)=>`${x(i).toFixed(1)},${y(m.intensity||1).toFixed(1)}`).join(' ');
  g += `<polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>`;
  micros.forEach((m,i)=>{
    g += `<circle cx="${x(i).toFixed(1)}" cy="${y(m.intensity||1).toFixed(1)}" r="4.5" fill="var(--panel)" stroke="var(--accent)" stroke-width="2.2"/>`;
    const d = microDate(macro, i);
    g += `<text x="${x(i).toFixed(1)}" y="${h-24}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="var(--muted)">S${i+1}</text>`;
    if(d) g += `<text x="${x(i).toFixed(1)}" y="${h-11}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="8.5" fill="var(--muted)" opacity="0.75">${fmtShortDate(d)}</text>`;
  });
  return `<div class="chart-scroll"><svg viewBox="0 0 ${w} ${h}" style="width:${micros.length>9?w+'px':'100%'};height:auto;">${g}</svg></div>`;
}

// ---------- COPIA DE SEGURIDAD ----------
// Cada versión publicada del artefacto tiene su propio almacenamiento, así que
// una actualización arranca vacía. Exportar/importar permite llevarse los datos.
function derivedKeys(athletes){
  const keys = ['athletes-list','quest-config','tasks-list'];
  (athletes||[]).forEach(a=>{
    ['intake','profile','routine','routine-draft','routine-history','journal','quest','quest-config','call','plan']
      .forEach(p=>keys.push(p+'-'+a.id));
  });
  return keys;
}
async function exportAll(){
  const data = {};
  let keys = null;
  try{
    const listed = await supaList();
    if(Array.isArray(listed) && listed.length) keys = listed;
  }catch(e){ /* sin conexión: usamos las claves derivadas */ }
  if(!keys) keys = derivedKeys(state.athletes);
  for(const k of keys){
    if(k === 'seed-done-v1' || k.indexOf('__umbral') === 0) continue;
    const v = await safeGet(k, true);
    if(v !== null && v !== undefined) data[k] = v;
  }
  return JSON.stringify({ _umbral:1, exportedAt:new Date().toISOString(), data }, null, 2);
}
async function importAll(json){
  let payload;
  try{ payload = JSON.parse(json); }
  catch(e){ throw new Error('el texto no es una copia válida'); }
  const data = payload && payload.data ? payload.data : payload;
  if(!data || typeof data !== 'object') throw new Error('la copia no contiene datos');
  if(!data['athletes-list']) throw new Error('la copia no incluye la lista de atletas');
  let incomingAthletes;
  try{ incomingAthletes = JSON.parse(data['athletes-list']); }
  catch(e){ throw new Error('la lista de atletas de la copia está dañada'); }
  if(!Array.isArray(incomingAthletes)) throw new Error('la lista de atletas de la copia está dañada');
  if(!incomingAthletes.length) throw new Error('la copia no contiene ningún atleta');
  let count = 0;
  for(const k of Object.keys(data)){
    if(k === 'athletes-list'){
      // Fusionamos en vez de sobrescribir: así restaurar nunca borra atletas
      // que ya existieran en esta versión.
      const currentRaw = await safeGet('athletes-list', true);
      let current = [];
      try{ current = currentRaw ? JSON.parse(currentRaw) : []; }catch(e){ current = []; }
      if(!Array.isArray(current)) current = [];
      const merged = current.slice();
      incomingAthletes.forEach(a=>{
        if(!a || !a.id) return;
        const i = merged.findIndex(x=>x.id===a.id);
        if(i === -1) merged.push(a); else merged[i] = a;
      });
      const ok = await safeSet('athletes-list', JSON.stringify(merged), true);
      if(ok) count++;
      continue;
    }
    const ok = await safeSet(k, data[k], true);
    if(ok) count++;
  }
  await safeSet('seed-done-v1','true', true);
  return count;
}

// Archiva la planificación publicada si pertenece a una semana ya cerrada.
// Antes sólo se archivaba al pulsar "Compartir": si una semana no cambiabas el
// plan, esa semana desaparecía del histórico del atleta.
async function autoArchiveWeek(athleteId){
  const published = await getRoutine(athleteId, false, weekOfISO());
  const hasContent = DAYS.some(d => BLOCKS.some(b => published.days[d][b.key].length > 0));
  if(!hasContent) return;
  const wk = weekOfISO();
  const marcada = published.weekOf;
  if(!marcada){
    published.weekOf = wk;
    await saveRoutine(athleteId, false, published, wk);
    return;
  }
  if(marcada === wk) return;                       // seguimos en la misma semana
  const histRaw = await safeGet('routine-history-'+athleteId, true);
  let hist = histRaw ? JSON.parse(histRaw) : [];
  if(!Array.isArray(hist)) hist = [];
  if(!hist.some(h=>h.weekOf === marcada)){
    hist.push({ weekOf: marcada, days: published.days });
  }
  hist = normalizaHistorial(hist);
  await safeSet('routine-history-'+athleteId, JSON.stringify(hist), true);
  published.weekOf = wk;
  await saveRoutine(athleteId, false, published);
}

// Una entrada por semana natural, ordenadas y numeradas de forma coherente.
// Repara además historiales que quedaron duplicados por el fallo anterior.
function normalizaHistorial(hist){
  if(!Array.isArray(hist)) return [];
  const porSemana = new Map();
  hist.forEach(h=>{
    if(!h || !h.weekOf) return;
    // Si ya había una entrada para esa semana, nos quedamos con la que tenga
    // contenido; entre dos con contenido, la última guardada.
    const previa = porSemana.get(h.weekOf);
    const cuenta = o => DAYS.reduce((a,d)=>a + BLOCKS.reduce((x,b)=>x + ((o.days&&o.days[d]&&o.days[d][b.key])||[]).length, 0), 0);
    if(!previa || cuenta(h) >= cuenta(previa)) porSemana.set(h.weekOf, h);
  });
  return [...porSemana.values()]
    .sort((a,b)=>String(a.weekOf).localeCompare(String(b.weekOf)))
    .map((h,i)=>({ weekNumber: i+1, weekOf: h.weekOf, days: h.days }));
}

function cuerpoDia(d, draft, athleteId, esTenisOMixto){
  let html = '';
    const open = state.openDays[d] ? 'open':'';
    const esPistaHoy = esTenisOMixto && (draft.days[d].lugar||'gym')==='pista';
    const numDrills = Array.isArray(draft.days[d].drills) ? draft.days[d].drills.length : 0;
    const totalEx = esPistaHoy ? numDrills : BLOCKS.reduce((acc,b)=>acc+draft.days[d][b.key].length,0);
    const lugarIcoCoach = esPistaHoy ? '🎾 ' : '';
    const etiquetaCantCoach = esPistaHoy ? `${totalEx} drill${totalEx===1?'':'s'}` : `${totalEx} ejerc.`;
    html += `<div class="acc ${open}" data-day="${d}"><div class="acc-head" data-toggle="${d}"><b>${lugarIcoCoach}${d}</b><span class="chev"><span class="chev-arrow">▾</span></span><span class="chev-count">${etiquetaCantCoach}</span></div><div class="acc-body">`;
    // El tipo de sesión se rellena a diario, así que queda a la vista. Todo lo
    // demás (copiar, mover, vaciar) va tras el menú de tres puntos para no
    // llenar la pantalla de opciones que se usan de vez en cuando.
    const otrosDias = DAYS.filter(x=>x!==d);
    const menuAbierto = false; // el menú ya no depende del render: se abre/cierra por CSS
    html += `<div class="dia-cabecera">
      <input type="text" class="dia-tipo" data-dia="${d}" value="${escapeHtml(draft.days[d].tipo||'')}"
        placeholder="Tipo de sesión (Fuerza, Carrera…)" list="tipoSuggestions">
      <button class="dia-menu-btn ${menuAbierto?'on':''}" data-diamenu="${d}" title="Más opciones">⋮</button>
    </div>`;
    {
      html += `<div class="dia-menu">`;
      if(esTenisOMixto){
        const lugar = draft.days[d].lugar || 'gym';
        html += `<div class="dm-seccion">
          <span class="dm-label">Dónde se entrena</span>
          <div class="row" style="gap:7px;">
            <button class="btn ${lugar==='gym'?'':'ghost'} small" data-lugar="${d}" data-val="gym">🏋️ En gym</button>
            <button class="btn ${lugar==='pista'?'':'ghost'} small" data-lugar="${d}" data-val="pista">🎾 En pista</button>
          </div>
        </div>`;
      }
      html += `<div class="dm-seccion">
        <span class="dm-label">Mover o copiar a otro día</span>
        <div class="row" style="gap:7px;flex-wrap:wrap;">
          <select class="copy-target" data-from="${d}">
            ${otrosDias.map(x=>`<option value="${x}">${x.charAt(0).toUpperCase()+x.slice(1)}</option>`).join('')}
          </select>
          <button class="btn ghost small" data-copyday="${d}" data-mode="replace">Sustituir</button>
          <button class="btn ghost small" data-copyday="${d}" data-mode="append">Añadir</button>
          ${totalEx?`<button class="btn ghost small" data-swapday="${d}">Intercambiar</button>`:''}
        </div>
      </div>`;
      if(totalEx){
        html += `<div class="dm-seccion">
          <span class="dm-label">Copiar a otra semana</span>
          <div class="row" style="gap:7px;flex-wrap:wrap;">
            <select class="wxfer-week" data-from="${d}">
              ${[-2,-1,1,2,3,4].map(o=>{
                const w = semanaDesplazada((state.planOffset||0)+o);
                const iniW = new Date(w+'T00:00:00');
                const et = o===1?'La siguiente':(o===-1?'La anterior':(o>0?`+${o} sem.`:`${o} sem.`));
                return `<option value="${w}">${et} · ${fmtShortDate(iniW)}</option>`;
              }).join('')}
            </select>
            <select class="wxfer-day" data-from="${d}">
              ${DAYS.map(x=>`<option value="${x}" ${x===d?'selected':''}>${x.charAt(0).toUpperCase()+x.slice(1)}</option>`).join('')}
            </select>
            <button class="btn ghost small" data-wxferday="${d}" data-mode="replace">Sustituir</button>
            <button class="btn ghost small" data-wxferday="${d}" data-mode="append">Añadir</button>
          </div>
        </div>`;
      }
      if(totalEx && state.athletes.length > 1){
        const otros = state.athletes.filter(a=>a.id !== athleteId);
        html += `<div class="dm-seccion">
          <span class="dm-label">Copiar a otro atleta</span>
          <div class="row" style="gap:7px;flex-wrap:wrap;">
            <select class="xfer-athlete" data-from="${d}">
              ${otros.map(a=>`<option value="${a.id}">${escapeHtml(a.name)}</option>`).join('')}
            </select>
            <select class="xfer-day" data-from="${d}">
              ${DAYS.map(x=>`<option value="${x}" ${x===d?'selected':''}>${x.charAt(0).toUpperCase()+x.slice(1)}</option>`).join('')}
            </select>
            <button class="btn ghost small" data-xferday="${d}" data-mode="replace">Sustituir</button>
            <button class="btn ghost small" data-xferday="${d}" data-mode="append">Añadir</button>
          </div>
        </div>`;
      }
      if(totalEx){
        html += `<div class="dm-seccion dm-peligro">
          <button class="btn ghost small" data-clearday="${d}">Vaciar día</button>
        </div>`;
      }
      html += `</div>`;
    }
    if(esTenisOMixto && (draft.days[d].lugar||'gym')==='pista'){
      // Día en pista: drills en vez de ejercicios de gimnasio.
      const drills = Array.isArray(draft.days[d].drills) ? draft.days[d].drills : [];
      if(!drills.length) html += `<div class="empty">Sin drills todavía. Añade el primero abajo.</div>`;
      drills.forEach(dr=>{ html += drillCardHtml(dr, d); });
      html += `<div class="row" style="margin-top:8px;"><button class="btn ghost small" data-adddrill="${d}">+ Añadir drill</button></div>`;
    } else {
      BLOCKS.forEach(b=>{
        html += `<div class="block-title">${b.label}</div>`;
        draft.days[d][b.key].forEach(ex=>{
          html += exCardHtml(ex, b.key, d, draft.days[d][b.key]);
        });
        html += `<div class="row" style="gap:8px;flex-wrap:wrap;">
          <button class="btn ghost small" data-addex="${d}|${b.key}">+ Añadir a ${b.label.toLowerCase()}</button>
          <button class="btn ghost small" data-fromlib="${d}|${b.key}">Desde galería</button>
          ${draft.days[d][b.key].length?`<button class="btn ghost small" data-saveblock="${d}|${b.key}">Guardar bloque</button>`:''}
        </div>`;
      });
    }
    html += `</div></div>`;
  return html;
}

async function tplPlanificacionCoach(athleteId){
  const atleta = state.athletes.find(a=>a.id===athleteId);
  const esTenisOMixto = TENIS_ACTIVO && atleta && (atleta.modalidad==='tenis' || atleta.modalidad==='mixto');
  // La semana se fija antes de archivar: al revés, el archivado usaba la semana
  // que hubiera quedado de otro atleta y escribía en la clave equivocada.
  const off = state.planOffset || 0;
  state.planWeek = semanaDesplazada(off);
  await autoArchiveWeek(athleteId);
  const draft = await getRoutine(athleteId, true, state.planWeek);
  const published = await getRoutine(athleteId, false, state.planWeek);
  const sameAsPublished = JSON.stringify(draft.days) === JSON.stringify(published.days);

  // Selector de semana: se pueden preparar semanas futuras sin tocar la actual.
  const ini = new Date(state.planWeek+'T00:00:00');
  const fin = new Date(ini); fin.setDate(fin.getDate()+6);
  const etiqueta = off===0 ? 'Semana actual' : (off===1 ? 'Semana que viene' : (off>0 ? `Dentro de ${off} semanas` : `Hace ${Math.abs(off)} semanas`));
  let html = `<div class="week-nav">
    <button class="btn ghost small" data-planmove="-1">←</button>
    <div class="week-nav-mid">
      <b>${etiqueta}</b>
      <span>${fmtShortDate(ini)} – ${fmtShortDate(fin)}</span>
    </div>
    <button class="btn ghost small" data-planmove="1">→</button>
    ${off!==0?'<button class="btn ghost small" data-planmove="hoy">Hoy</button>':''}
  </div>`;
  const vacia = DAYS.every(d=>
    BLOCKS.every(b=>draft.days[d][b.key].length===0) &&
    (!Array.isArray(draft.days[d].drills) || draft.days[d].drills.length===0)
  );
  if(vacia && off>0){
    html += `<div class="day-tools" style="margin-bottom:14px;">
      <span class="day-tools-label">Semana en blanco</span>
      <button class="btn ghost small" id="copyPrevWeekBtn">Partir de la semana anterior</button>
    </div>`;
  }
  html += `<div class="draft-banner"><span>${sameAsPublished ? 'El borrador coincide con lo que ve el atleta.' : '<b style="color:var(--accent);">Tienes cambios sin compartir.</b> El atleta sigue viendo la versión anterior.'}</span>
    <span class="row" style="gap:8px;">
      ${sameAsPublished ? '' : '<button class="btn ghost small" id="discardDraftBtn">Descartar cambios</button>'}
      <button class="btn small" id="shareRoutineBtn">Compartir planificación</button>
    </span></div>`;
  if(state.athletes.length > 1){
    const otros = state.athletes.filter(a=>a.id !== athleteId);
    html += `<div class="day-tools" style="margin-bottom:14px;">
      <span class="day-tools-label">Copiar la semana entera a</span>
      <select id="xferWeekAthlete">${otros.map(a=>`<option value="${a.id}">${escapeHtml(a.name)}</option>`).join('')}</select>
      <button class="btn ghost small" id="xferWeekBtn">Copiar semana</button>
    </div>`;
  }
  DAYS.forEach(d=>{ html += cuerpoDia(d, draft, athleteId, esTenisOMixto); });
  return html;
}
async function tplDiarioLectura(athleteId){
  const raw = await safeGet('journal-'+athleteId, true);
  const entries = raw ? JSON.parse(raw) : [];
  let html = `<div class="card"><h2>Diario de entrenamiento</h2>`;
  if(!entries.length) html += `<div class="empty">Sin sesiones registradas todavía.</div>`;
  else entries.slice().reverse().forEach((e, revIdx)=>{
    const idx = entries.length - 1 - revIdx;   // índice real en el array
    const editando = state.editEntry === idx;
    const abierto = state.diarioAbierto === idx;
    const tieneDetalle = (e.exercises && e.exercises.length) || (e.drills && e.drills.length);
    html += `<div class="entry"><div class="entry-top diario-cab" data-diario="${idx}" style="cursor:pointer;">
