        <span class="pill" style="background:${rpeColor(e.overallRPE)};color:#FFFFFF;">RPE ${e.overallRPE}</span></div>
      <div style="font-size:12.5px;color:var(--muted);margin-top:6px;">Duración ${fmtTime(e.durationSeconds)} · carga ${e.fatigueScore}${e.fatiga?` · fatiga ${e.fatiga}/5`:''}${e.calidad?` · calidad ${e.calidad}/5`:''}</div>`;
    if(abierto && tieneDetalle){
      html += `<div class="diario-detalle">`;
      if(e.exercises && e.exercises.length){
        html += `<table class="tabla-comp"><thead><tr><th>Ejercicio</th><th>Previsto</th><th>Hecho</th><th>RPE</th><th>RIR</th></tr></thead><tbody>`;
        e.exercises.forEach(x=>{
          const prev = x.loadPlanned || '—';
          const hecho = x.loadApplied || '—';
          const difiere = x.loadPlanned && x.loadApplied && x.loadPlanned !== x.loadApplied;
          // Si anotó varias series o un rango ("8-9", "7,8,9") mostramos lo que
          // escribió y la media debajo: el detalle dice más que el promedio.
          const esf = (texto, media)=>{
            if(texto && String(texto).trim() && String(texto).trim() !== String(media)){
              return `${escapeHtml(texto)}<br><span class="esf-media">media ${media}</span>`;
            }
            return (media!==null && media!==undefined) ? media : '—';
          };
          html += `<tr>
            <td>${escapeHtml(x.name||'—')}</td>
            <td class="col-prev">${escapeHtml(prev)}</td>
            <td class="${difiere?'col-dif':''}">${escapeHtml(hecho)}</td>
            <td>${esf(x.rpeTexto, x.rpeApplied)}</td>
            <td>${esf(x.rirTexto, x.rirApplied)}</td>
          </tr>`;
          if(Array.isArray(x.setsData) && x.setsData.length){
            const filas = x.setsData.map((sd,si)=>`S${si+1}: ${sd.reps||'—'} reps${sd.rpe?` · RPE ${escapeHtml(sd.rpe)}`:''}${sd.rir?` · RIR ${escapeHtml(sd.rir)}`:''}`).join('  ·  ');
            html += `<tr class="fila-nota"><td colspan="5">📋 ${filas}</td></tr>`;
          }
          if(x.noteApplied) html += `<tr class="fila-nota"><td colspan="5">💬 ${escapeHtml(x.noteApplied)}</td></tr>`;
        });
        html += `</tbody></table>`;
      }
      if(e.drills && e.drills.length){
        html += `<table class="tabla-comp"><thead><tr><th>Drill</th><th>Intentos</th><th>Acierto</th><th>Sens.</th></tr></thead><tbody>`;
        e.drills.forEach(x=>{
          html += `<tr>
            <td>${escapeHtml(x.name||'—')}</td>
            <td>${(x.acertados!==null&&x.intentos)?`${x.acertados}/${x.intentos}`:'—'}</td>
            <td class="${x.aciertoPct>=70?'col-bien':''}">${x.aciertoPct!==null&&x.aciertoPct!==undefined?x.aciertoPct+'%':'—'}</td>
            <td>${x.sensacion||'—'}</td>
          </tr>`;
          if(x.nota) html += `<tr class="fila-nota"><td colspan="4">💬 ${escapeHtml(x.nota)}</td></tr>`;
        });
        html += `</tbody></table>`;
      }
      html += `</div>`;
    }
    html += `${e.notes?`<div style="font-size:12.5px;color:var(--muted);margin-top:6px;">"${escapeHtml(e.notes)}"</div>`:''}`;
    if(editando){
      html += `<div class="ex-grid" style="margin-top:10px;">
        <div><label class="field-label">Fecha</label><input type="date" class="ed-date" value="${e.date}"></div>
        <div><label class="field-label">Día de rutina</label><select class="ed-day">${DAYS.map(x=>`<option value="${x}" ${x===e.day?'selected':''}>${x.charAt(0).toUpperCase()+x.slice(1)}</option>`).join('')}</select></div>
        <div><label class="field-label">Duración (min)</label><input type="number" class="ed-min" value="${Math.round((e.durationSeconds||0)/60)}"></div>
        <div><label class="field-label">RPE general</label><input type="number" class="ed-rpe" min="1" max="10" value="${e.overallRPE||''}"></div>
        <div><label class="field-label">Fatiga (1-5)</label><input type="number" class="ed-fat" min="1" max="5" value="${e.fatiga||''}"></div>
        <div><label class="field-label">Calidad (1-5)</label><input type="number" class="ed-cal" min="1" max="5" value="${e.calidad||''}"></div>
        <div><label class="field-label">Hidratación (1-5)</label><input type="number" class="ed-hid" min="1" max="5" value="${e.hidratacion||''}"></div>
        <div class="full"><label class="field-label">Satisfacción (1-5)</label><input type="number" class="ed-sat" min="1" max="5" value="${e.satisfaccion||''}"></div>
        <div class="full"><label class="field-label">Notas</label><textarea class="ed-notes" style="min-height:44px;">${escapeHtml(e.notes||'')}</textarea></div>
      </div>
      <p style="font-size:11.5px;color:var(--muted);margin-top:6px;">Al guardar se recalcula la carga (sRPE) con la duración y el RPE.</p>
      <div class="row" style="margin-top:8px;">
        <button class="btn small" data-saveentry="${idx}">Guardar cambios</button>
        <button class="btn ghost small" data-cancelentry="1">Cancelar</button>
      </div>`;
    } else {
      html += `<div class="row" style="margin-top:8px;">
        <button class="btn ghost small" data-editentry="${idx}">Corregir</button>
        <button class="btn ghost small" data-delentry="${idx}">Eliminar</button>
      </div>`;
    }
    html += `</div>`;
  });
  html += `</div>`;
  return html;
}
async function tplQuestConfigAndRead(athleteId){
  const active = await getQuestConfig(athleteId);
  const raw = await safeGet('quest-'+athleteId, true);
  const responses = raw ? JSON.parse(raw) : [];
  const a = state.athletes.find(x=>x.id===athleteId);
  let html = `<div class="card"><h2>Preguntas del cuestionario</h2><p style="font-size:12.5px;color:var(--muted);margin-bottom:10px;">Selección propia de ${escapeHtml(a?a.name:'este atleta')}. Un tenista y un cliente de Hyrox no necesitan las mismas preguntas.</p>`;
  let lastCat = '';
  QUESTION_BANK.forEach(q=>{
    if(q.cat!==lastCat){ html += `<div class="q-cat">${q.cat}</div>`; lastCat=q.cat; }
    html += `<label class="q-config-item"><input type="checkbox" data-qid="${q.id}" ${active.includes(q.id)?'checked':''}> ${q.text}</label>`;
  });
  html += `<label class="q-config-item" style="margin-top:12px;"><input type="checkbox" id="questApplyAll"> Aplicar también como plantilla para nuevos atletas</label>
    <button class="btn" id="saveQuestConfig" style="margin-top:8px;">Guardar selección</button></div>`;
  html += `<div class="card"><h2>Respuestas recibidas</h2>`;
  if(!responses.length) html += `<div class="empty">Sin respuestas todavía.</div>`;
  else responses.slice().reverse().forEach(r=>{
    html += `<div class="entry"><div class="entry-top"><span>${r.date||r.weekOf}</span></div>`;
    active.forEach(qid=>{
      const q = QUESTION_BANK.find(x=>x.id===qid); if(!q) return;
      const val = r.answers ? r.answers[qid] : undefined; if(val===undefined || val==='') return;
      if(q.type==='text') html += `<div style="font-size:12.5px;color:var(--muted);margin-top:6px;">${q.text}: "${escapeHtml(val)}"</div>`;
      else {
        // Mostramos la respuesta en palabras: "Fatal, me despertaba roto" dice
        // mucho más que "1/5" y ahorra tener que interpretar la escala.
        let mostrado;
        if(q.type==='numero') mostrado = `${val} ${escapeHtml(q.unidad||'')}`;
        else if(q.type==='opciones' && q.opciones && q.opciones[val-1]) mostrado = `${escapeHtml(q.opciones[val-1])} <span class="q-num-mini">(${val}/5)</span>`;
        else mostrado = `${val}/5`;
        html += `<div style="font-size:13px;margin-top:6px;"><span style="color:var(--muted);">${q.text}</span> — <b style="color:var(--accent);">${mostrado}</b></div>`;
        const note = r.notes ? r.notes[qid] : '';
        if(note) html += `<div style="font-size:12px;color:var(--muted);margin-left:8px;">"${escapeHtml(note)}"</div>`;
      }
    });
    html += `</div>`;
  });
  html += `</div>`;
  return html;
}

// Eventos del formulario público. Vive aparte de bindDynamicEvents porque en
// modo filtro no se carga el resto de la app.
function bindFormularioFiltro(){
  const setResp = (id, val)=>{
    if(!state.filtroResp) state.filtroResp = {};
    state.filtroResp[id] = val;
  };
  document.querySelectorAll('.f-campo').forEach(el=>{
    el.addEventListener('input', ()=>setResp(el.dataset.fid, el.value));
  });
  document.querySelectorAll('.f-otro').forEach(el=>{
    el.addEventListener('input', ()=>setResp(el.dataset.fid+'__otro', el.value));
  });
  document.querySelectorAll('.f-notas').forEach(el=>{
    el.addEventListener('input', ()=>setResp(el.dataset.fid+'__notas', el.value));
  });
  document.querySelectorAll('[data-fescala]').forEach(sc=>{
    sc.querySelectorAll('button').forEach(b=>b.addEventListener('click', ()=>{
      sc.querySelectorAll('button').forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel');
      setResp(sc.dataset.fescala, parseInt(b.dataset.val,10));
    }));
  });
  document.querySelectorAll('[data-fop]').forEach(b=>b.addEventListener('click', ()=>{
    const [id, op] = b.dataset.fop.split('|');
    setResp(id, op);
    if(state.filtroResp) delete state.filtroResp[id+'__otro'];
    renderFiltro();
  }));
  document.querySelectorAll('[data-fmulti]').forEach(b=>b.addEventListener('click', ()=>{
    const [id, op] = b.dataset.fmulti.split('|');
    const actual = Array.isArray(state.filtroResp && state.filtroResp[id]) ? state.filtroResp[id].slice() : [];
    const i = actual.indexOf(op);
    if(i>=0) actual.splice(i,1); else actual.push(op);
    setResp(id, actual);
    b.classList.toggle('on', actual.includes(op));
  }));
  document.querySelectorAll('[data-fotro]').forEach(b=>b.addEventListener('click', ()=>{
    const id = b.dataset.fotro;
    if(!state.filtroResp) state.filtroResp = {};
    if(state.filtroResp[id+'__otro'] !== undefined) delete state.filtroResp[id+'__otro'];
    else state.filtroResp[id+'__otro'] = '';
    renderFiltro();
  }));
  const enviar = document.getElementById('enviarFiltroBtn');
  if(enviar) enviar.addEventListener('click', async ()=>{
    const preguntas = await getFiltroPreguntas();
    const r = state.filtroResp || {};
    // Comprobamos lo obligatorio antes de enviar
    const faltan = preguntas.filter(q=>{
      if(!q.obligatoria) return false;
      const v = r[q.id], otro = r[q.id+'__otro'];
      if(otro) return false;
      if(Array.isArray(v)) return v.length === 0;
      return v === undefined || v === '' || v === null;
    });
    if(faltan.length){
      toast(`Falta responder: ${faltan[0].label.slice(0,45)}${faltan[0].label.length>45?'…':''}`, true);
      return;
    }
    enviar.textContent = 'Enviando…'; enviar.disabled = true;
    try{
      const leads = await getLeads();
      leads.push({ id: uid(), fecha: todayISO(), estado:'nuevo', nota:'', respuestas: r });
      const ok = await saveLeads(leads);
      if(!ok) throw new Error('no se pudo guardar');
      state.filtroEnviado = true;
      state.filtroResp = null;
      renderFiltro();
    }catch(e){
      toast('No se pudo enviar. Revisa tu conexión e inténtalo de nuevo.', true);
      enviar.textContent = 'Enviar respuestas'; enviar.disabled = false;
    }
  });
}
function renderFiltro(){
  const main = document.getElementById('main');
  const y = getScrollPos();
  tplFormularioFiltro().then(h=>{
    main.innerHTML = h;
    bindFormularioFiltro();
    setScrollPos(y);
  });
}

      <p style="font-size:12.5px;color:var(--muted);line-height:1.6;margin-top:12px;">Si tras leerlo veo que no soy la mejor opción para ti, te lo diré igualmente — prefiero eso a que pierdas tiempo y dinero.</p>
    </div>`;
  }

  const r = state.filtroResp || {};
  let html = `<div class="card">
    <svg viewBox="0 0 100 100" style="width:44px;height:44px;margin-bottom:14px;display:block;">
      <path d="M26 18 L26 62 L50 82 L50 64 L40 56 L40 18 Z" fill="var(--accent)"/>
      <path d="M74 18 L74 62 L50 82 L50 64 L60 56 L60 18 Z" fill="var(--gold)"/>
    </svg>
    <h2>¿Encajamos?</h2>
    <p style="font-size:13px;color:var(--muted);line-height:1.65;">Tres o cuatro minutos. Con esto sabré si puedo ayudarte de verdad y, si es que sí, llegaré a la llamada sabiendo ya de qué hablamos.</p>
    <p style="font-size:12.5px;color:var(--muted);line-height:1.6;margin-top:10px;">Contesta con sinceridad, incluso en lo que creas que "queda mal". Un dato maquillado solo sirve para que te programe peor.</p>
  </div>`;

  let seccionActual = '';
  preguntas.forEach(q=>{
    if(q.seccion && q.seccion !== seccionActual){
      seccionActual = q.seccion;
      html += `<div class="block-title" style="margin-top:18px;">${escapeHtml(seccionActual)}</div>`;
    }
    const v = r[q.id];
    const otroV = r[q.id+'__otro'];
    html += `<div class="card" style="margin-bottom:10px;">
      <p style="font-size:14px;font-weight:600;line-height:1.5;margin-bottom:${q.ayuda?'4px':'10px'};">${escapeHtml(q.label)}${q.obligatoria?'':' <span style="font-weight:400;color:var(--muted);font-size:12px;">(opcional)</span>'}</p>
      ${q.ayuda?`<p style="font-size:12px;color:var(--muted);margin-bottom:10px;">${escapeHtml(q.ayuda)}</p>`:''}`;

    if(q.tipo==='texto'){
      html += q.largo
        ? `<textarea class="f-campo" data-fid="${q.id}" style="min-height:76px;">${escapeHtml(v||'')}</textarea>`
        : `<input type="text" class="f-campo" data-fid="${q.id}" value="${escapeHtml(v||'')}" style="width:100%;">`;
    } else if(q.tipo==='numero'){
      html += `<input type="number" class="f-campo" data-fid="${q.id}" value="${escapeHtml(v||'')}" style="width:100%;" inputmode="numeric">`;
    } else if(q.tipo==='escala'){
      html += `<div class="scale" data-fescala="${q.id}">${Array.from({length:q.max-q.min+1},(_,i)=>i+q.min).map(n=>`<button data-val="${n}" class="${String(v)===String(n)?'sel':''}">${n}</button>`).join('')}</div>
        <div class="scale-labels"><span>${q.min} · nada</span><span>${q.max} · del todo</span></div>`;
    } else if(q.tipo==='opcion'){
      html += `<div class="f-opciones">${q.opciones.map(o=>
        `<button class="f-op ${v===o?'on':''}" data-fop="${q.id}|${escapeHtml(o)}">${escapeHtml(o)}</button>`).join('')}
        ${q.permiteOtro?`<button class="f-op ${otroV!==undefined?'on':''}" data-fotro="${q.id}">Otro</button>`:''}</div>`;
      if(otroV !== undefined){
        html += `<input type="text" class="f-otro" data-fid="${q.id}" value="${escapeHtml(otroV||'')}" placeholder="Cuéntamelo con tus palabras" style="width:100%;margin-top:8px;">`;
      }
    } else if(q.tipo==='multi'){
      const sel = Array.isArray(v) ? v : [];
      html += `<div class="f-opciones">${q.opciones.map(o=>
        `<button class="f-op ${sel.includes(o)?'on':''}" data-fmulti="${q.id}|${escapeHtml(o)}">${escapeHtml(o)}</button>`).join('')}
        ${q.permiteOtro?`<button class="f-op ${otroV!==undefined?'on':''}" data-fotro="${q.id}">Otro</button>`:''}</div>`;
      if(otroV !== undefined){
        html += `<input type="text" class="f-otro" data-fid="${q.id}" value="${escapeHtml(otroV||'')}" placeholder="Cuéntamelo con tus palabras" style="width:100%;margin-top:8px;">`;
      }
      if(q.pideNotas){
        html += `<input type="text" class="f-notas" data-fid="${q.id}" value="${escapeHtml(r[q.id+'__notas']||'')}" placeholder="${escapeHtml(q.notasLabel||'Añade detalles')}" style="width:100%;margin-top:8px;">`;
      }
    }
    html += `</div>`;
  });

  html += `<div class="card">
    <button class="btn" id="enviarFiltroBtn" style="width:100%;">Enviar respuestas</button>
    <p style="font-size:11.5px;color:var(--muted);margin-top:10px;text-align:center;">Tus datos solo los uso para valorar si puedo ayudarte. No se comparten con nadie.</p>
  </div>`;
  return html;
}

// ---------- CAPTACIÓN: PANTALLA DEL ENTRENADOR ----------
async function tplCaptacion(){
  const leads = await getLeads();
  const preguntas = await getFiltroPreguntas();

  // Enlace público: el mismo que la app, con un parámetro que abre sólo el
  // formulario. No da acceso a ningún perfil ni a la app.
  const enlace = (typeof location !== 'undefined' ? location.origin + location.pathname : '') + '?filtro=1';

  const evaluados = leads.map(l=>{
    const ev = evaluaRespuesta(l.respuestas, preguntas);
    return { ...l, ev, prio: prioridadLead(ev) };
  });
  const orden = { alta:0, media:1, baja:2, incompleto:3 };
  evaluados.sort((a,b)=>{
    if(a.estado !== b.estado){
      // Los pendientes primero; descartados y convertidos al final.
      const e = { nuevo:0, contactado:1, convertido:2, descartado:3 };
      return (e[a.estado]??0) - (e[b.estado]??0);
    }
    const d = orden[a.prio.nivel] - orden[b.prio.nivel];
    if(d !== 0) return d;
    return (b.ev.potencial||0) - (a.ev.potencial||0);
  });

  const nuevos = evaluados.filter(l=>l.estado==='nuevo').length;

  let html = `<div class="card"><h2>Captación</h2>
    <p style="font-size:12.5px;color:var(--muted);line-height:1.6;">Comparte este enlace por DM. Quien lo rellene aparecerá aquí con dos puntuaciones: <b>potencial</b> (si encaja como cliente) y <b>alineación</b> (si encaja con tu forma de trabajar). No da acceso a la app.</p>
    <div class="day-tools" style="margin-top:12px;">
      <input type="text" id="enlaceFiltro" value="${escapeHtml(enlace)}" readonly style="flex:1;min-width:0;font-size:12px;font-family:'IBM Plex Mono',monospace;">
      <button class="btn small" id="copiarEnlaceBtn">Copiar</button>
    </div>
    <div class="kpi-row" style="margin-top:14px;">
      <div class="kpi"><b>${nuevos}</b><span>Sin revisar</span></div>
      <div class="kpi"><b>${leads.length}</b><span>Total</span></div>
      <div class="kpi"><b>${evaluados.filter(l=>l.prio.nivel==='alta'&&l.estado==='nuevo').length}</b><span>Prioritarios</span></div>
    </div>
    <div class="row" style="gap:8px;margin-top:12px;flex-wrap:wrap;">
      <button class="btn ghost small" id="editarFiltroBtn">Editar cuestionario</button>
      <button class="btn ghost small" id="verFiltroBtn">Ver como lo ve el cliente</button>
    </div>
  </div>`;

  if(!evaluados.length){
    html += `<div class="card"><div class="empty">Aún no ha respondido nadie. Comparte el enlace y las respuestas aparecerán aquí.</div></div>`;
    return html;
  }

  evaluados.forEach((l,i)=>{
    const abierto = state.leadAbierto === l.id;
    const r = l.respuestas || {};
    const badge = { alta:'lead-alta', media:'lead-media', baja:'lead-baja', incompleto:'lead-baja' }[l.prio.nivel];
    const estadoEtq = { nuevo:'Sin revisar', contactado:'Contactado', convertido:'Convertido', descartado:'Descartado' }[l.estado||'nuevo'];
    html += `<div class="acc ${abierto?'open':''} lead-card ${l.estado==='descartado'?'lead-off':''}" data-leadacc="${l.id}">
      <div class="acc-head" data-toggle-lead="${l.id}">
        <b style="text-transform:none;">${escapeHtml(r.nombre||'Sin nombre')}</b>
        <span class="chev"><span class="chev-arrow">▾</span></span>
        <span class="lead-nums">
          <span class="lead-num ${badge}">${l.ev.potencial ?? '—'}</span>
          <span class="lead-num ${badge}">${l.ev.alineacion ?? '—'}</span>
        </span>
      </div>
      <div class="acc-body">
        <div class="lead-meta">
          <span>Potencial <b>${l.ev.potencial ?? '—'}/10</b></span>
          <span>Alineación <b>${l.ev.alineacion ?? '—'}/10</b></span>
          <span>${l.fecha}</span>
          <span class="lead-estado">${estadoEtq}</span>
        </div>
        <div class="rd-zona rd-${l.prio.nivel==='alta'?'verde':(l.prio.nivel==='media'?'ambar':'rojo')}" style="margin-bottom:12px;">
          <div><b>Prioridad ${l.prio.nivel}</b><span>${escapeHtml(l.prio.texto)}</span></div>
        </div>`;

    if(l.ev.revisar.length){
      html += `<div class="lead-revisar">
        <b>Necesita que lo leas tú</b>
        ${l.ev.revisar.map(x=>`<div class="lr-item"><span>${escapeHtml(x.label)}</span><p>${escapeHtml(String(x.valor))}</p></div>`).join('')}
      </div>`;
    }

    html += `<div class="block-title">Todas las respuestas</div><div class="tabla-comp-wrap"><table class="tabla-comp"><tbody>`;
    preguntas.forEach(q=>{
      let v = r[q.id];
      const otro = r[q.id+'__otro'];
      if(Array.isArray(v)) v = v.join(', ');
      if(otro) v = (v ? v+' · ' : '') + 'Otro: ' + otro;
      const notas = r[q.id+'__notas'];
      if(notas) v = (v||'') + ' — ' + notas;
      if(v === undefined || v === '' || v === null) return;
      html += `<tr><td style="max-width:45%;">${escapeHtml(q.label)}</td><td><b>${escapeHtml(String(v))}</b></td></tr>`;
    });
    html += `</tbody></table></div>`;

    html += `<div class="block-title">Tus notas</div>
      <textarea class="lead-nota" data-leadid="${l.id}" style="min-height:52px;" placeholder="Qué te ha llamado la atención, qué preguntar en la llamada…">${escapeHtml(l.nota||'')}</textarea>
      <div class="row" style="gap:7px;flex-wrap:wrap;margin-top:10px;">
        ${['nuevo','contactado','convertido','descartado'].map(e=>
          `<button class="btn ${l.estado===e?'':'ghost'} small" data-leadestado="${l.id}|${e}">${({nuevo:'Sin revisar',contactado:'Contactado',convertido:'Convertido',descartado:'Descartado'})[e]}</button>`).join('')}
      </div>
      <button class="btn ghost small" data-leadborrar="${l.id}" style="margin-top:10px;">Eliminar</button>
      </div></div>`;
  });
  return html;
}

// ---------- GALERÍA (pantalla propia del entrenador) ----------
// A diferencia del selector que se abre desde un día concreto (para insertar
// en una sesión), esta es la pantalla de gestión: editar nombre y sección,
// asignar o quitar vídeo, mover de sección, crear secciones nuevas, y borrar
// ejercicios de la galería. Insertar en una sesión sigue haciéndose desde
// "Desde galería" dentro de cada día, como hasta ahora.
async function tplGaleriaCoach(){
  const lib = await getExLib();
  const secciones = await getSecciones();
  const q = (state.galFiltro||'').toLowerCase().trim();
  const filtrados = lib.filter(e=>!q || (e.name+' '+(e.section||'')).toLowerCase().includes(q));

  // Agrupar por sección maestra, en su orden; lo sin encajar va al final.
  const grupos = new Map();
  secciones.forEach(sec=>grupos.set(sec, []));
  const sinSeccion = [];
  filtrados.forEach(e=>{
    const sec = e.section && secciones.includes(e.section) ? e.section : null;
    if(sec) grupos.get(sec).push(e); else sinSeccion.push(e);
  });
  grupos.forEach(arr=>arr.sort((a,b)=>a.name.localeCompare(b.name,'es')));
  sinSeccion.sort((a,b)=>a.name.localeCompare(b.name,'es'));

  let html = `<div class="card"><h2>Galería de ejercicios</h2>
    <p style="font-size:12.5px;color:var(--muted);margin-bottom:14px;">Guarda un ejercicio una vez y reutilízalo en cualquier atleta, semana o día. Los cambios que hagas aquí no afectan a los que ya insertaste en una rutina.</p>
    <input type="text" id="galBuscador" placeholder="Buscar ejercicio…" value="${escapeHtml(state.galFiltro||'')}" style="width:100%;margin-bottom:14px;">
    <div class="row" style="gap:8px;flex-wrap:wrap;margin-bottom:6px;">
      <button class="btn ghost small" id="galNuevoBtn">+ Nuevo ejercicio</button>
      <button class="btn ghost small" id="galNuevaSeccionBtn">+ Nueva sección</button>
    </div>
  </div>`;

  secciones.forEach(sec=>{
    const items = grupos.get(sec) || [];
    if(q && !items.length) return;   // buscando: no mostrar secciones vacías
    const abierta = state.galSeccionAbierta === sec;
    html += tplGalSeccionAcc(sec, items, secciones, abierta);
  });
  if(sinSeccion.length || (!q && !secciones.length)){
    const abierta = state.galSeccionAbierta === '__sin__';
    html += `<div class="acc ${abierta?'open':''}" data-galsec="__sin__">
      <div class="acc-head" data-toggle-gal="__sin__"><b>Sin sección</b><span class="chev"><span class="chev-arrow">▾</span></span><span class="chev-count">${sinSeccion.length}</span></div>
      <div class="acc-body"><div class="gal-lista">${sinSeccion.map(e=>tplGalItem(e, secciones)).join('') || '<div class="empty">Nada aquí.</div>'}</div></div>
    </div>`;
  }
  return html;
}

    <div class="acc-head" data-toggle-gal="${escapeHtml(sec)}"><b>${escapeHtml(sec)}</b><span class="chev"><span class="chev-arrow">▾</span></span><span class="chev-count">${items.length}</span></div>

// Agenda: Resumen, Tareas y Calendario en una sola pantalla con subpestañas.
// Arranca en Resumen, que es la vista de "qué requiere mi atención hoy".
async function tplAgenda(){
  const sub = state.agendaSub || 'resumen';
  let html = `<div class="sub-tabs">
    <button data-agendasub="resumen" class="${sub==='resumen'?'active':''}">Resumen</button>
    <button data-agendasub="tareas" class="${sub==='tareas'?'active':''}">Tareas</button>
    <button data-agendasub="calendario" class="${sub==='calendario'?'active':''}">Calendario</button>
  </div>`;
  if(sub==='tareas') html += await tplTareas();
  else if(sub==='calendario') html += await tplCalendarioCoach();
  else html += await tplResumen();
  return html;
}

async function tplResumen(){
  const now = new Date();
  const upcomingList = [], unpaidList = [], riskList = [];
  for(const a of state.athletes){
    const callRaw = await safeGet('call-'+a.id, true);
    if(callRaw){ const c = JSON.parse(callRaw); if(c.nextDate){ const days=(new Date(c.nextDate)-now)/86400000; if(days>=0 && days<=14) upcomingList.push({id:a.id, name:a.name, date:c.nextDate}); } }
    const profRaw = await safeGet('profile-'+a.id, true);
    if(profRaw){ const p = JSON.parse(profRaw); if(p.pagado==='No' || p.pagado==='Pendiente') unpaidList.push({id:a.id, name:a.name, estado:p.pagado}); }
    const jRaw = await safeGet('journal-'+a.id, true);
    if(jRaw){
      const entries = JSON.parse(jRaw);
      if(entries.length>=2){
        const sum7 = entries.filter(e=>(now-new Date(e.date))/86400000<=7).reduce((acc,e)=>acc+e.fatigueScore,0);
        const sum28 = entries.filter(e=>(now-new Date(e.date))/86400000<=28).reduce((acc,e)=>acc+e.fatigueScore,0);
        const chronicWeekly = sum28/4;
        if(chronicWeekly>0 && (sum7/chronicWeekly)>1.3) riskList.push({id:a.id, name:a.name, acwr:(sum7/chronicWeekly).toFixed(2)});
      }
    }
  }
  upcomingList.sort((x,y)=>x.date.localeCompare(y.date));
  const sections = [
    { key:'calls', title:'Próximas videollamadas', count:upcomingList.length, rows: upcomingList.map(u=>`<div class="entry"><div class="entry-top"><span>${escapeHtml(u.name)}</span><span>${u.date}</span></div></div>`).join('') },
    { key:'unpaid', title:'Pagos pendientes', count:unpaidList.length, rows: unpaidList.map(u=>`<div class="entry"><div class="entry-top"><span>${escapeHtml(u.name)}</span><span>${escapeHtml(u.estado)}</span></div></div>`).join('') },
    { key:'risk', title:'Riesgo por ACWR', count:riskList.length, rows: riskList.map(u=>`<div class="entry"><div class="entry-top"><span>${escapeHtml(u.name)}</span><span>ACWR ${u.acwr}</span></div></div>`).join('') },
    { key:'all', title:'Todos los atletas', count:state.athletes.length, rows: state.athletes.map(a=>`<div class="entry"><div class="entry-top"><span>${escapeHtml(a.name)}</span></div></div>`).join('') }
  ];
  let html = `<div class="card"><h2>Resumen</h2>`;
  sections.forEach(s=>{
    const open = state.openDays['resumen-'+s.key] ? 'open':'';
    html += `<div class="acc ${open}" data-day="resumen-${s.key}"><div class="acc-head" data-toggle="resumen-${s.key}"><b style="text-transform:none;">${s.title}</b><span class="chev"><span class="chev-arrow">▾</span></span><span class="chev-count">${s.count}</span></div>
      <div class="acc-body">${s.rows || '<div class="empty">Nada que mostrar.</div>'}</div></div>`;
  });
  html += `</div>`;
  return html;
}

// ---------- BIND DYNAMIC EVENTS ----------
// Enlaza el autoguardado de UNA tarjeta. Separado para poder aplicarlo a una
// tarjeta recién insertada sin volver a recorrer toda la pantalla.
// Enlaza el botón de eliminar de UNA tarjeta, para que también funcione en las
// insertadas sobre la marcha.
function bindRemoveEx(btn, athleteId){
  btn.addEventListener('click', async ()=>{
    const exId = btn.dataset.removeex; const card = btn.closest('.ex-card');
    if(!card) return;
    const blockKey = card.dataset.block, d = card.dataset.day;
    const draft = await getRoutine(athleteId, true);
    draft.days[d][blockKey] = draft.days[d][blockKey].filter(x=>x.id!==exId);
    draft.updatedAt = new Date().toISOString();
    const ok = await saveRoutine(athleteId, true, draft);
    if(!ok){ toast('No se pudo guardar. Comprueba la conexión.', true); return; }
    card.remove();
    actualizaContadorDia(d);
  });
}

// Reordenar ejercicios dentro de su bloque, sin reconstruir la pantalla.
function bindMoveEx(btn, athleteId){
  btn.addEventListener('click', async ()=>{
    const card = btn.closest('.ex-card');
    if(!card) return;
    const d = card.dataset.day, blockKey = card.dataset.block, exId = card.dataset.exid;
    const dir = btn.dataset.dir;
    const draft = await getRoutine(athleteId, true);
    const lista = draft.days[d][blockKey];
    const i = lista.findIndex(x=>x.id===exId);
    if(i === -1) return;
    const j = dir==='up' ? i-1 : i+1;
    if(j < 0 || j >= lista.length){ toast(dir==='up'?'Ya es el primero':'Ya es el último'); return; }
    [lista[i], lista[j]] = [lista[j], lista[i]];
    draft.updatedAt = new Date().toISOString();
    const ok = await saveRoutine(athleteId, true, draft);
    if(!ok){ toast('No se pudo guardar el orden', true); return; }
    // Movemos la tarjeta en el DOM en vez de re-renderizar
    const hermana = dir==='up' ? card.previousElementSibling : card.nextElementSibling;
    if(hermana && hermana.classList.contains('ex-card')){
      if(dir==='up') card.parentNode.insertBefore(card, hermana);
      else card.parentNode.insertBefore(hermana, card);
    }
    if(typeof card.scrollIntoView === 'function') card.scrollIntoView({block:'nearest'});
  });
}

function bindExerciseCard(card, athleteId){

    const fields = card.querySelectorAll('input, textarea, select');
    const commit = async ()=>{
      const athleteId = state.selectedId;
      const d = card.dataset.day, blockKey = card.dataset.block, exId = card.dataset.exid;
      const draft = await getRoutine(athleteId, true);
      const ex = draft.days[d][blockKey].find(x=>x.id===exId);
      if(ex){
        const grupoPrevio = ex.grupoId || '';
        ex.name = card.querySelector('.ex-name').value.trim();
        ex.desc = card.querySelector('.ex-desc').value.trim();
        ex.section = card.querySelector('.ex-section').value.trim();
        const turnoEl = card.querySelector('.ex-turno');
        // videoUrl/videoName se asignan desde el selector de vídeo, no desde un campo
        if(turnoEl) ex.turno = turnoEl.value;
        const grabEl = card.querySelector('.ex-grabacion');
        if(grabEl) ex.pideGrabacion = grabEl.checked;
        const grupoEl = card.querySelector('.ex-grupo');
        if(grupoEl){
          const v = grupoEl.value;
          if(!v){ ex.grupoId = ''; ex.grupoTipo = ''; }
          else if(v.indexOf('new:') === 0){ ex.grupoId = 'g'+uid(); ex.grupoTipo = v.slice(4); }
          else {
            ex.grupoId = v;
            const hermano = draft.days[d][blockKey].find(x=>x.grupoId===v && x.id!==exId);
            ex.grupoTipo = hermano ? (hermano.grupoTipo||'superserie') : 'superserie';
          }
        }
        ex.load = card.querySelector('.ex-load').value.trim();
        ex.series = card.querySelector('.ex-series').value.trim();
        ex.reps = card.querySelector('.ex-reps').value.trim();
        ex.rest = card.querySelector('.ex-rest').value.trim();
        ex.rir = card.querySelector('.ex-rir').value.trim();
        ex.rpeTarget = card.querySelector('.ex-rpetarget').value.trim();
        const prevType = exTimer(ex).type;
        const t = exTimer(ex);
        const typeEl = card.querySelector('.ex-timer-type');
        if(typeEl) t.type = typeEl.value;
        const num = (sel, fallback)=>{ const el=card.querySelector(sel); return el ? (parseInt(el.value,10)||fallback) : fallback; };
        t.work = num('.tm-work', t.work);
        t.rest = num('.tm-rest', t.rest);
        t.rounds = num('.tm-rounds', t.rounds);
        t.sets = num('.tm-sets', t.sets);
        t.setRest = num('.tm-setrest', t.setRest);
        t.emomLen = num('.tm-emomlen', t.emomLen);
        t.emomRounds = num('.tm-emomrounds', t.emomRounds);
        t.amrapMin = num('.tm-amrapmin', t.amrapMin);
        t.seriesRestSec = num('.tm-seriesrest', t.seriesRestSec);
        t.seriesCount = num('.tm-seriescount', t.seriesCount);
        ex.timer = t;
        draft.updatedAt = new Date().toISOString();
        await saveRoutine(athleteId, true, draft);
        const flag = card.querySelector('.save-flag'); if(flag){ flag.classList.add('show'); setTimeout(()=>flag.classList.remove('show'),1200); }
        // Al cambiar el tipo de temporizador cambian sus campos: redibujamos
        // sólo esta tarjeta, no la pantalla entera (eso hacía saltar el scroll).
        const grupoCambiado = (grupoPrevio !== (ex.grupoId||''));
        if(grupoCambiado){
          // Combinar en superserie/triserie/circuito cambia qué grupos puede
          // ver CADA ejercicio del bloque en su desplegable. Antes esto forzaba
          // a redibujar la pantalla entera (el salto que se quejaba el
          // usuario); ahora sólo se actualizan los <select> de combinación de
          // los ejercicios de este mismo bloque, sin tocar el resto del DOM.
          actualizaSelectsGrupo(card, draft.days[d][blockKey]);
          return;
        }
        if(t.type !== prevType){
          const nuevaHtml = exCardHtml(ex, blockKey, d);
          card.insertAdjacentHTML('afterend', nuevaHtml);
          const reemplazo = card.nextElementSibling;
          card.remove();
          if(reemplazo) bindExerciseCard(reemplazo, athleteId);
        }
      }
    };
    let debounce = null;
    card.querySelectorAll('[data-moveex]').forEach(mb=>{
      if(!mb.dataset.bound){ mb.dataset.bound='1'; bindMoveEx(mb, athleteId); }
    });
    const delBtn = card.querySelector('[data-removeex]');
    if(delBtn && !delBtn.dataset.bound){ delBtn.dataset.bound='1'; bindRemoveEx(delBtn, athleteId); }
    fields.forEach(f=>{
      // `change` sólo salta al perder el foco, lo que en móvil es frágil: si el
      // usuario escribe y navega sin tocar fuera del campo, la edición se perdía.
      // Guardamos también mientras escribe, con una pequeña espera.
      f.addEventListener('input', ()=>{ clearTimeout(debounce); debounce = setTimeout(commit, 600); });
      f.addEventListener('change', ()=>{ clearTimeout(debounce); commit(); });
    });

    // Esta tarjeta se insertó directamente en el DOM (sin redibujar la
    // pantalla), así que sus botones de acción no pasaron por
    // bindDynamicEvents. Los conectamos aquí para que funcionen desde el
    // primer momento, sin esperar a la siguiente actualización de pantalla.
    const pick = card.querySelector('[data-pickvideo]');
    if(pick) pick.addEventListener('click', ()=>{
      abrirGaleria(pick.dataset.pickvideo, athleteId);
    });
    const unlink = card.querySelector('[data-unlinkvideo]');
    if(unlink) unlink.addEventListener('click', async ()=>{
      const exId = unlink.dataset.unlinkvideo;
      const d2 = card.dataset.day;
      const draft = await getRoutine(athleteId, true);
      const ex = draft.days[d2][card.dataset.block].find(x=>x.id===exId);
      if(ex){ ex.videoUrl=''; ex.videoName=''; }
      const ok = await saveRoutine(athleteId, true, draft);
      toast(ok?'Vídeo quitado':'No se pudo guardar', !ok);
      if(ok) renderKeepScroll();
    });
    const play = card.querySelector('[data-playvideo]');
    if(play) play.addEventListener('click', ()=>{
      const [url, nombre] = play.dataset.playvideo.split('|');
      abrirVideo(url, nombre);
    });
    const tolib = card.querySelector('[data-tolib]');
    if(tolib) tolib.addEventListener('click', async ()=>{
      const draft = await getRoutine(athleteId, true);
      let encontrado = null;
      DAYS.forEach(dd2=>BLOCKS.forEach(bl=>{
        const ex = draft.days[dd2][bl.key].find(x=>x.id===tolib.dataset.tolib);
        if(ex) encontrado = ex;
      }));
      if(!encontrado || !encontrado.name.trim()){ toast('Ponle nombre al ejercicio primero', true); return; }
      const lib = await getExLib();
      if(lib.some(x=>x.name.toLowerCase() === encontrado.name.trim().toLowerCase())){
        if(!confirm(`Ya tienes "${encontrado.name}" en la galería.\n\n¿Guardar otra versión?`)) return;
      }
      lib.push({ id: uid(), ...plantillaDe(encontrado) });
      const ok = await saveExLib(lib);
      toast(ok ? `"${encontrado.name}" guardado en la galería` : 'No se pudo guardar', !ok);
    });
    card.querySelectorAll('.ex-move').forEach(mv=>mv.addEventListener('click', async ()=>{
      const exId = mv.dataset.moveex, dir = mv.dataset.dir;
      const d2 = card.dataset.day, blockKey = card.dataset.block;
      const draft = await getRoutine(athleteId, true);
      const lista = draft.days[d2][blockKey];
      const i = lista.findIndex(x=>x.id===exId);
      const j = dir==='up' ? i-1 : i+1;
      if(i===-1 || j<0 || j>=lista.length) return;
      [lista[i], lista[j]] = [lista[j], lista[i]];
      const ok = await saveRoutine(athleteId, true, draft);
      if(ok){ state.openDays[d2]=true; renderKeepScroll(); }
    }));
    const removeBtn = card.querySelector('[data-removeex]');
    if(removeBtn) removeBtn.addEventListener('click', async ()=>{
      const exId = removeBtn.dataset.removeex;
      const d2 = card.dataset.day, blockKey = card.dataset.block;
      const draft = await getRoutine(athleteId, true);
      draft.days[d2][blockKey] = draft.days[d2][blockKey].filter(x=>x.id!==exId);
      const ok = await saveRoutine(athleteId, true, draft);
      if(ok){ card.remove(); actualizaContadorDia(d2); }
      else toast('No se pudo eliminar', true);
    });
}
// Refresca el "N ejerc." de la cabecera del día sin re-renderizar.
function actualizaContadorDia(d){
  const acc = [...document.querySelectorAll('.acc')].find(a=>a.dataset.day===d);
  if(!acc) return;
  const n = acc.querySelectorAll('.ex-card').length;
  const cnt = acc.querySelector('.chev-count');
  const tipoEl = acc.querySelector('.dia-tipo');

// Anima las flechas del drill en orden y remata con el «OPEN» de cómic.
function reproducirRecorrido(wrap){
  const svg = wrap.querySelector('.pista-svg');
  if(!svg) return;
  const flechas = [...svg.querySelectorAll('.pista-arrow')].sort((a,b)=>+a.dataset.order-+b.dataset.order);
  const open = svg.querySelector('.pista-open');
  if(open) open.style.opacity = '0';
  const PASO = 550;
  flechas.forEach((f,i)=>{
    const largo = f.getTotalLength ? f.getTotalLength() : 300;
    f.style.transition = 'none';
    f.setAttribute('stroke-dasharray', largo);
    f.setAttribute('stroke-dashoffset', largo);
    setTimeout(()=>{
      f.style.transition = `stroke-dashoffset ${PASO*0.85}ms ease`;
      f.setAttribute('stroke-dashoffset', '0');
    }, 30 + i*PASO);
  });
  const totalTiempo = flechas.length ? 30 + flechas.length*PASO : 0;
  if(open){
    setTimeout(()=>{
      open.style.transition = 'opacity .25s ease, transform .25s cubic-bezier(.3,1.6,.4,1)';
      open.style.transformOrigin = '130px 270px';
      open.style.transform = 'scale(1)';
      open.style.opacity = '1';
    }, totalTiempo + 150);
  }
}

// Galería: subir uno nuevo o reutilizar uno ya subido
// Igual que abrirGaleria, pero para asignar el vídeo a un ítem de la GALERÍA
// de ejercicios (no a un ejercicio ya insertado en la rutina de un atleta).
// Recalcula el número que muestra cada acordeón de sección, tras mover o
// borrar ejercicios directamente en el DOM (sin volver a pintar la pantalla).
function actualizaContadoresGal(){
  document.querySelectorAll('[data-galsec]').forEach(acc=>{
    const badge = acc.querySelector('.chev-count');

// Inserta un ejercicio recién creado directamente en el DOM de su sección
// (abriéndola si estaba cerrada), sin volver a pintar el resto de la pantalla.
async function insertaGalItemEnDOM(ex, sec){
  const secciones = await getSecciones();
  let acc = document.querySelector(`[data-galsec="${CSS.escape(sec)}"]`);
  if(!acc){
    // La sección aún no existe en el DOM (poco probable, red de seguridad).
    const sinSecAcc = document.querySelector('[data-galsec="__sin__"]');
    const html = tplGalSeccionAcc(sec, [], secciones, true);
    if(sinSecAcc) sinSecAcc.insertAdjacentHTML('beforebegin', html);
    acc = document.querySelector(`[data-galsec="${CSS.escape(sec)}"]`);
    if(acc) bindGalSeccionAcc(acc);
  }
  if(!acc) return;
  if(!acc.classList.contains('open')){
    document.querySelectorAll(':scope > .acc.open', acc.parentElement).forEach(el=>{ if(el!==acc) el.classList.remove('open'); });
    acc.classList.add('open');
  }
  const lista = acc.querySelector('.gal-lista');
  if(!lista) return;
  const vacio = lista.querySelector('.empty'); if(vacio) vacio.remove();
  lista.insertAdjacentHTML('beforeend', tplGalItem(ex, secciones));
  const nuevo = lista.querySelector(`.gal-item[data-galid="${CSS.escape(ex.id)}"]`);
  if(nuevo){
    bindGalItem(nuevo);
    const nombre = nuevo.querySelector('.gal-name');
    if(nombre) nombre.focus();
    if(typeof nuevo.scrollIntoView === 'function') nuevo.scrollIntoView({block:'nearest', behavior:'smooth'});
  }
  actualizaContadoresGal();
}

// Conecta abrir/cerrar y los botones de una tarjeta de sección recién
// insertada en el DOM (al crear una sección nueva).
function bindGalSeccionAcc(acc){
  const head = acc.querySelector('[data-toggle-gal]');
  if(head) head.addEventListener('click', ()=>{
    const wasOpen = acc.classList.contains('open');
    acc.parentElement.querySelectorAll(':scope > .acc.open').forEach(el=>{ if(el!==acc) el.classList.remove('open'); });
    acc.classList.toggle('open', !wasOpen);
  });
  const addBtn = acc.querySelector('[data-galnuevoen]');
  if(addBtn) addBtn.addEventListener('click', async ()=>{
    const sec = addBtn.dataset.galnuevoen;
    const nuevo = { id: uid(), name:'', desc:'', section:sec, load:'', series:'', reps:'', rest:'', rir:'', rpeTarget:'',
      timer:{type:'none'}, videoUrl:'', videoName:'' };
    const lib = await getExLib();
    lib.push(nuevo);
    const ok = await saveExLib(lib);
    if(!ok){ toast('No se pudo crear', true); return; }
    insertaGalItemEnDOM(nuevo, sec);
  });
  const delBtn = acc.querySelector('[data-galborrarseccion]');
  if(delBtn) delBtn.addEventListener('click', async ()=>{
    const sec = delBtn.dataset.galborrarseccion;
    const dentro = acc.querySelectorAll('.gal-item').length;
    if(!confirm(`¿Eliminar la sección "${sec}"?${dentro?`\n\nLos ${dentro} ejercicios que tiene pasarán a "Sin sección", no se borran.`:''}`)) return;
    const secciones = (await getSecciones()).filter(s=>s!==sec);
    const ok = await saveSecciones(secciones);
    if(!ok){ toast('No se pudo eliminar', true); return; }
    (async ()=>{ const lib = await getExLib(); lib.forEach(e=>{ if(e.section===sec) e.section=''; }); await saveExLib(lib); })();
    const sinSecBody = document.querySelector('[data-galsec="__sin__"] .gal-lista');
    acc.querySelectorAll('.gal-item').forEach(item=>{
      const sel = item.querySelector('.gal-section'); if(sel) sel.value = '';
      if(sinSecBody) sinSecBody.appendChild(item);
    });
    acc.remove();
    toast('Sección eliminada');
    actualizaContadoresGal();
  });
}

// Autoguardado de una ficha de la galería. Si el cambio fue de sección, el
// propio nodo se muda de acordeón en vez de esperar a una nueva pintada.
function bindGalItem(item){
  const guardar = async ()=>{
    const lib = await getExLib();
    const ex = lib.find(x=>x.id===item.dataset.galid);
    if(!ex) return;
    const seccionAntes = ex.section || '';
    ex.name = item.querySelector('.gal-name').value.trim();
    const descEl = item.querySelector('.gal-desc');
    if(descEl) ex.desc = descEl.value;     // sin trim: respetamos los saltos de línea
    ex.series = item.querySelector('.gal-series').value.trim();
    ex.reps = item.querySelector('.gal-reps').value.trim();
    ex.load = item.querySelector('.gal-load').value.trim();
    ex.section = item.querySelector('.gal-section').value;
    const ok = await saveExLib(lib);
    const flag = item.querySelector('.save-flag');
    if(ok && flag){ flag.classList.add('show'); setTimeout(()=>flag.classList.remove('show'),1200); }
    if(!ok){ toast('No se pudo guardar', true); return; }
    if(ex.section !== seccionAntes){
      const claveDestino = ex.section || '__sin__';
      const destino = document.querySelector(`[data-galsec="${CSS.escape(claveDestino)}"] .gal-lista`);
      if(destino){
        const vacio = destino.querySelector('.empty'); if(vacio) vacio.remove();
        destino.appendChild(item);
      }
      actualizaContadoresGal();
    }
  };
  let deb=null;
  item.querySelectorAll('input, select, textarea').forEach(f=>{
    f.addEventListener('input', ()=>{ clearTimeout(deb); deb=setTimeout(guardar, 600); });
    f.addEventListener('change', ()=>{ clearTimeout(deb); guardar(); });
  });
  const pick = item.querySelector('[data-galpickvideo]');
  if(pick) pick.addEventListener('click', ()=>abrirGaleriaVideoParaItem(pick.dataset.galpickvideo));
  const play = item.querySelector('[data-galplayvideo]');
  if(play) play.addEventListener('click', ()=>{ const [url,nombre]=play.dataset.galplayvideo.split('|'); abrirVideo(url,nombre); });
  const unlink = item.querySelector('[data-galunlinkvideo]');
  if(unlink) unlink.addEventListener('click', async ()=>{
    const lib = await getExLib();
    const ex = lib.find(x=>x.id===unlink.dataset.galunlinkvideo);
    if(ex){ ex.videoUrl=''; ex.videoName=''; }
    const ok = await saveExLib(lib);
    if(!ok){ toast('No se pudo guardar', true); return; }
    const secciones = await getSecciones();
    item.outerHTML = tplGalItem(ex, secciones);
    const nuevo = document.querySelector(`.gal-item[data-galid="${CSS.escape(ex.id)}"]`);
    if(nuevo) bindGalItem(nuevo);
  });
  const del = item.querySelector('[data-galexdel]');
  if(del) del.addEventListener('click', async ()=>{
    const lib = await getExLib();
    const ex = lib.find(x=>x.id===del.dataset.galexdel);
    if(!ex) return;
    if(!confirm(`¿Eliminar "${ex.name||'este ejercicio'}" de la galería?\n\nLas rutinas donde ya lo hayas usado no se ven afectadas.`)) return;
    const ok = await saveExLib(lib.filter(x=>x.id!==del.dataset.galexdel));
    toast(ok?'Eliminado':'No se pudo eliminar', !ok);
    if(ok){ item.remove(); actualizaContadoresGal(); }
  });
}

      <button class="btn ghost small" id="closeGalBtn">Cerrar</button>
    </div>
    <p style="font-size:12px;color:var(--muted);margin-bottom:14px;">Sube un vídeo corto (5-10 s, 720p basta) o reutiliza uno que ya tengas. Máximo ${MAX_VIDEO_MB} MB.</p>
    <div class="day-tools" style="margin-bottom:14px;">
      <input type="file" id="galFile" accept="video/*" style="flex:1;min-width:0;font-size:12.5px;">
      <button class="btn small" id="galUploadBtn">Subir</button>
    </div>
    <div id="galList">${lib.length ? lib.slice().reverse().map(v=>`
      <div class="vid-item">
        <span class="vi-name">${escapeHtml(v.name)}</span>
        <span class="vi-size">${v.size>1024?(v.size/1024).toFixed(1)+' MB':v.size+' KB'}</span>
        <button class="btn ghost small" data-galplay="${v.id}">Ver</button>
        <button class="btn small" data-galuse="${v.id}">Usar</button>
        <button class="btn ghost small" data-galdel="${v.id}">✕</button>
      </div>`).join('') : '<div class="empty">Todavía no has subido ningún vídeo.</div>'}</div>
  </div>`;

  const cerrar = ()=>{ back.remove(); };
  document.getElementById('closeGalBtn').addEventListener('click', cerrar);
  back.addEventListener('click', e=>{ if(e.target===back) cerrar(); });

  const asignar = async (v)=>{
    const draft = await getRoutine(athleteId, true);
    let encontrado = false;
    DAYS.forEach(d=>BLOCKS.forEach(b=>{
      const ex = draft.days[d][b.key].find(x=>x.id===exId);
      if(ex){ ex.videoUrl = v ? v.url : ''; ex.videoName = v ? v.name : ''; encontrado = true; }
    }));
    if(!encontrado) return;
    const ok = await saveRoutine(athleteId, true, draft);
    toast(ok ? (v?'Vídeo asignado':'Vídeo quitado') : 'No se pudo guardar', !ok);
    cerrar();
    renderKeepScroll();
  };

  document.getElementById('galUploadBtn').addEventListener('click', async ()=>{
    const f = document.getElementById('galFile').files[0];
    if(!f){ toast('Elige un archivo primero', true); return; }
    const btn = document.getElementById('galUploadBtn');
    btn.textContent = 'Subiendo…'; btn.disabled = true;
    try{
      const item = await subirVideo(f);
      toast('Vídeo subido');
      await asignar(item);
    }catch(e){
      toast('No se pudo subir: ' + e.message, true);
      btn.textContent = 'Subir'; btn.disabled = false;
    }
  });
  back.querySelectorAll('[data-galuse]').forEach(b=>b.addEventListener('click', async ()=>{
    const v = (await getVideoLib()).find(x=>x.id===b.dataset.galuse);
    if(v) await asignar(v);
  }));
  back.querySelectorAll('[data-galplay]').forEach(b=>b.addEventListener('click', async ()=>{
    const v = (await getVideoLib()).find(x=>x.id===b.dataset.galplay);
    if(v) abrirVideo(v.url, v.name);
  }));
  back.querySelectorAll('[data-galdel]').forEach(b=>b.addEventListener('click', async ()=>{
    const v = (await getVideoLib()).find(x=>x.id===b.dataset.galdel);
    if(!v) return;
    if(!confirm(`¿Eliminar "${v.name}" de la galería?\n\nLos ejercicios que lo usen dejarán de mostrarlo.`)) return;
    await borrarVideo(v);
    toast('Vídeo eliminado');
    abrirGaleria(exId, athleteId);
  }));
}

// Cambiar de mes sustituye sólo la tarjeta del calendario: reconstruir la
// pantalla entera provocaba el parpadeo en cada toque de las flechas.
async function refrescarCalendario(athleteId){
  const card = document.getElementById('calCard');
  if(!card){ renderKeepScroll(); return; }
  const raw = await safeGet('call-'+athleteId, true);
  const call = raw ? JSON.parse(raw) : {};
  const jRaw = await safeGet('journal-'+athleteId, true);
  const journal = jRaw ? JSON.parse(jRaw) : [];
  const plan = await getPlan(athleteId);
  card.innerHTML = `<h2>Calendario</h2>` + monthGridHtml(call.nextDate, journal, state.calOffset||0, plan);
  bindDynamicEvents();
}

// Galería: elegir varios ejercicios o un bloque entero y pegarlos en un día.
async function abrirGaleriaEjercicios(dia, bloque, athleteId){
  // Recreamos el modal siempre desde cero: reutilizar uno que hubiera quedado
  // a medio cerrar arrastraba listeners duplicados y selección de otra sesión.
  const viejo = document.getElementById('exLibBack');
  if(viejo) viejo.remove();
  const back = document.createElement('div');
  back.id = 'exLibBack'; back.className = 'modal-back';
  document.body.appendChild(back);
  state.libSel = [];
  state.libFiltro = '';
  state.libSeccion = null;
  state.libTab = 'ejercicios';
  let cargando = false;

  const pintar = async ()=>{
    let lib = [], blocks = [];
    try{
      lib = await getExLib();
      blocks = await getBlockLib();
    }catch(e){
      back.innerHTML = `<div class="modal"><div class="empty">No se pudo cargar la galería. Comprueba la conexión e inténtalo de nuevo.</div>
        <button class="btn ghost small" id="closeLibBtn" style="margin-top:10px;">Cerrar</button></div>`;
      document.getElementById('closeLibBtn').addEventListener('click', ()=>back.remove());
      return;
    }
    const q = (state.libFiltro||'').toLowerCase().trim();
    const secciones = await getSecciones();
    const filtrados = lib
      .filter(e=>!q || (e.name+' '+(e.section||'')).toLowerCase().includes(q))
      .filter(e=>!state.libSeccion || e.section===state.libSeccion)
      .sort((a,b)=>a.name.localeCompare(b.name,'es'));
    // Agrupadas por inicial, como una agenda
    const porLetra = new Map();
    filtrados.forEach(e=>{
      const L = (e.name[0]||'?').toUpperCase();
      if(!porLetra.has(L)) porLetra.set(L, []);
      porLetra.get(L).push(e);
    });

    let html = `<div class="modal">
      <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:10px;">
        <h2 style="font-family:'Fraunces',serif;font-size:17px;">Galería</h2>
        <button class="btn ghost small" id="closeLibBtn">Cerrar</button>
      </div>
      <div class="mode-tabs">
        <button class="${state.libTab==='ejercicios'?'active':''}" data-libtab="ejercicios">Ejercicios (${lib.length})</button>
        <button class="${state.libTab==='bloques'?'active':''}" data-libtab="bloques">Bloques (${blocks.length})</button>
      </div>`;

    if(state.libTab === 'ejercicios'){
      html += `<input type="text" id="libSearch" placeholder="Buscar ejercicio…" value="${escapeHtml(state.libFiltro||'')}" style="width:100%;margin-bottom:10px;">`;
      if(secciones.length){
        html += `<div class="habit-pick" style="margin-bottom:12px;">
          <button class="hp ${!state.libSeccion?'on':''}" data-libsec="">Todas</button>
          ${secciones.map(sec=>`<button class="hp ${state.libSeccion===sec?'on':''}" data-libsec="${escapeHtml(sec)}">${escapeHtml(sec)}</button>`).join('')}
        </div>`;
      }
      if(!filtrados.length){
        html += `<div class="empty">${lib.length ? 'Ningún ejercicio coincide con la búsqueda.' : 'La galería está vacía. Guarda ejercicios desde la planificación con el botón «Guardar en galería».'}</div>`;
      }
      [...porLetra.keys()].sort((a,b)=>a.localeCompare(b,'es')).forEach(L=>{
        html += `<div class="lib-letra">${L}</div>`;
        porLetra.get(L).forEach(e=>{
          const sel = state.libSel.includes(e.id);
          html += `<div class="lib-item ${sel?'sel':''}" data-libpick="${e.id}">
            <span class="li-check">${sel?'✓':''}</span>
            <span class="li-txt"><b>${escapeHtml(e.name)}</b>
              <span>${[e.section, e.series&&e.reps?`${e.series}x${e.reps}`:'', e.load].filter(Boolean).map(escapeHtml).join(' · ')||'sin detalles'}</span>
            </span>
            <button class="btn ghost small" data-libdel="${e.id}">✕</button>
          </div>`;
        });
      });
      html += `<div class="lib-pie">
        <span>${state.libSel.length} seleccionado${state.libSel.length===1?'':'s'}</span>
        <button class="btn" id="libInsertBtn" ${state.libSel.length?'':'disabled'}>Añadir al día</button>
      </div>`;
    } else {
      if(!blocks.length) html += `<div class="empty">Aún no has guardado ningún bloque. Desde un día con ejercicios, pulsa «Guardar bloque» para reutilizarlo entero.</div>`;
      blocks.slice().sort((a,b)=>a.name.localeCompare(b.name,'es')).forEach(b=>{
        html += `<div class="lib-item">
          <span class="li-txt"><b>${escapeHtml(b.name)}</b><span>${b.exercises.length} ejercicios · ${escapeHtml(b.section||'sin sección')}</span></span>
          <button class="btn small" data-blockuse="${b.id}">Añadir</button>
          <button class="btn ghost small" data-blockdel="${b.id}">✕</button>
        </div>`;
      });
    }
    html += `</div>`;
    back.innerHTML = html;

    const cerrar = ()=>{ back.remove(); state.libSel=[]; };
    document.getElementById('closeLibBtn').addEventListener('click', cerrar);
    back.addEventListener('click', e=>{ if(e.target===back) cerrar(); });
    back.querySelectorAll('[data-libtab]').forEach(b=>b.addEventListener('click', ()=>{ state.libTab=b.dataset.libtab; pintar(); }));
    back.querySelectorAll('[data-libsec]').forEach(b=>b.addEventListener('click', ()=>{ state.libSeccion=b.dataset.libsec||null; pintar(); }));
    const buscador = document.getElementById('libSearch');
    if(buscador){
      let deb=null;
      buscador.addEventListener('input', ()=>{
        clearTimeout(deb);
        deb=setTimeout(()=>{ state.libFiltro=buscador.value; pintar(); }, 250);
      });
    }
    back.querySelectorAll('[data-libpick]').forEach(el=>el.addEventListener('click', ev=>{
      if(ev.target.closest('[data-libdel]')) return;
      const id = el.dataset.libpick;
      state.libSel = state.libSel.includes(id) ? state.libSel.filter(x=>x!==id) : state.libSel.concat(id);
      pintar();
    }));
    back.querySelectorAll('[data-libdel]').forEach(b=>b.addEventListener('click', async (ev)=>{
      ev.stopPropagation();
      const lib2 = await getExLib();
      const e = lib2.find(x=>x.id===b.dataset.libdel);
      if(!e) return;
      if(!confirm(`¿Quitar "${e.name}" de la galería?\n\nNo afecta a las rutinas donde ya lo hayas usado.`)) return;
      await saveExLib(lib2.filter(x=>x.id!==b.dataset.libdel));
      state.libSel = state.libSel.filter(x=>x!==b.dataset.libdel);
      pintar();
    }));

    const insertar = async (plantillas)=>{
      if(!plantillas.length){ toast('Nada que añadir', true); return; }
      const draft = await getRoutine(athleteId, true, state.planWeek);
      if(!draft.days[dia] || !draft.days[dia][bloque]){
        toast('No se encontró ese día en la rutina. Cierra y ábrela de nuevo.', true);
        return;
      }
      plantillas.forEach(pl=>{ draft.days[dia][bloque].push(desdePlantilla(pl)); });
      const ok = await saveRoutine(athleteId, true, draft, state.planWeek);
      toast(ok ? `${plantillas.length} ejercicio${plantillas.length===1?'':'s'} añadido${plantillas.length===1?'':'s'}` : 'No se pudo guardar: revisa la conexión', !ok);
      cerrar();
      if(ok){ state.openDays[dia]=true; renderKeepScroll(); }
    };
    const insBtn = document.getElementById('libInsertBtn');
    if(insBtn) insBtn.addEventListener('click', async ()=>{
      if(cargando) return;
      cargando = true; insBtn.disabled = true; insBtn.textContent = 'Añadiendo…';
      try{
        const lib2 = await getExLib();
        await insertar(state.libSel.map(id=>lib2.find(x=>x.id===id)).filter(Boolean));
      }catch(e){
        toast('No se pudo añadir: '+e.message, true);
        cargando = false; insBtn.disabled = false; insBtn.textContent = 'Añadir al día';
      }
    });
    back.querySelectorAll('[data-blockuse]').forEach(b=>b.addEventListener('click', async ()=>{
      const blocks2 = await getBlockLib();
      const bl = blocks2.find(x=>x.id===b.dataset.blockuse);
      if(bl) await insertar(bl.exercises);
    }));
    back.querySelectorAll('[data-blockdel]').forEach(b=>b.addEventListener('click', async ()=>{
      const blocks2 = await getBlockLib();
      const bl = blocks2.find(x=>x.id===b.dataset.blockdel);
      if(!bl) return;
      if(!confirm(`¿Eliminar el bloque "${bl.name}"?`)) return;
      await saveBlockLib(blocks2.filter(x=>x.id!==b.dataset.blockdel));
      pintar();
    }));
  };
  await pintar();
}

async function bindDynamicEvents(){
  // Quién es el atleta en contexto: el que ha iniciado sesión (modo atleta) o
  // el seleccionado en el panel (modo entrenador).
  const athleteId = state.role === 'atleta' ? state.athleteAsId : state.selectedId;
  const backToAthletes = document.getElementById('backToAthletes');
  if(backToAthletes) backToAthletes.addEventListener('click', ()=>{ state._inAthleteDetail=false; renderScrollTop(); });
  document.querySelectorAll('[data-subtab]').forEach(b=>b.addEventListener('click', ()=>{ state.athleteSubTab=b.dataset.subtab; renderScrollTop(); }));

  // ---------- PERIODIZACIÓN: eventos ----------
  const periodSave = async (mutate)=>{
    const athleteId = state.selectedId;
    const plan = await getPlan(athleteId);
    mutate(plan);
    const ok = await savePlan(athleteId, plan);
    if(!ok) toast('No se pudo guardar la periodización', true);
    return ok;
  };
  const addMacroBtn = document.getElementById('addMacroBtn');
  if(addMacroBtn) addMacroBtn.addEventListener('click', async ()=>{
    await periodSave(p=>p.macros.push(blankMacro()));
    toast('Macrociclo creado');
    renderKeepScroll();
  });
  document.querySelectorAll('[data-delmacro]').forEach(b=>b.addEventListener('click', async ()=>{
    await periodSave(p=>{ p.macros = p.macros.filter(m=>m.id!==b.dataset.delmacro); });
    renderKeepScroll();
  }));
  document.querySelectorAll('.macro-name').forEach(inp=>inp.addEventListener('change', async ()=>{
    await periodSave(p=>{ const m=p.macros.find(x=>x.id===inp.dataset.macro); if(m) m.name=inp.value.trim()||'Macrociclo'; });
    toast('Guardado');
  }));
  document.querySelectorAll('.macro-start').forEach(inp=>inp.addEventListener('change', async ()=>{
    await periodSave(p=>{ const m=p.macros.find(x=>x.id===inp.dataset.macro); if(m) m.startDate=inp.value; });
    renderKeepScroll();
  }));
  document.querySelectorAll('.macro-weeks').forEach(inp=>inp.addEventListener('change', async ()=>{
    const n = Math.max(1, Math.min(52, parseInt(inp.value,10)||1));
    await periodSave(p=>{
      const m=p.macros.find(x=>x.id===inp.dataset.macro); if(!m) return;
      while(m.micros.length < n) m.micros.push({ id:uid(), intensity:2, volume:3, type:'Acumulación', note:'' });
      while(m.micros.length > n) m.micros.pop();
    });
    renderKeepScroll();
  }));
  document.querySelectorAll('[data-usecomp]').forEach(b=>b.addEventListener('click', async ()=>{
    const [mid, nombre, fecha] = b.dataset.usecomp.split('|');
    await periodSave(p=>{
      const m = p.macros.find(x=>x.id===mid); if(!m) return;
      if(!Array.isArray(m.competitions)) m.competitions = [];
      m.competitions.push({ id:uid(), name:nombre, date:fecha });
    });
    toast('Competición vinculada a este macrociclo');
    renderKeepScroll();
  }));
  document.querySelectorAll('[data-addcomp]').forEach(b=>b.addEventListener('click', async ()=>{
    await periodSave(p=>{
      const m=p.macros.find(x=>x.id===b.dataset.addcomp); if(!m) return;
      if(!Array.isArray(m.competitions)) m.competitions=[];
      m.competitions.push({ id:uid(), name:'', date:'' });
    });
    renderKeepScroll();
  }));
  document.querySelectorAll('[data-delcomp]').forEach(b=>b.addEventListener('click', async ()=>{
    const [mid,cid] = b.dataset.delcomp.split('|');
    await periodSave(p=>{ const m=p.macros.find(x=>x.id===mid); if(m) m.competitions=(m.competitions||[]).filter(c=>c.id!==cid); });
    renderKeepScroll();
  }));
  // Redibuja SÓLO el gráfico afectado: reconstruir la pantalla entera hacía
  // que la vista saltara al principio al tocar cualquier control.
  const refreshChart = async (macroId)=>{
    const box = document.getElementById('chart-'+macroId);
    if(!box) return;
    const plan = await getPlan(state.selectedId);
    const macro = plan.macros.find(m=>m.id===macroId);
    if(macro) box.innerHTML = periodChartSvg(macro);
  };
  const compField = (cls, key)=>{
    document.querySelectorAll('.'+cls).forEach(inp=>inp.addEventListener('change', async ()=>{
      await periodSave(p=>{
        const m=p.macros.find(x=>x.id===inp.dataset.macro); if(!m) return;
        const c=(m.competitions||[]).find(y=>y.id===inp.dataset.comp); if(c) c[key]=inp.value;
      });
      await refreshChart(inp.dataset.macro);
      toast('Guardado');
    }));
  };
  compField('comp-name','name');
  compField('comp-date','date');
  const microField = (cls, key, numeric)=>{
    document.querySelectorAll('.'+cls).forEach(inp=>inp.addEventListener('change', async ()=>{
      await periodSave(p=>{
        const m=p.macros.find(x=>x.id===inp.dataset.macro); if(!m) return;
        const mc=m.micros.find(y=>y.id===inp.dataset.micro); if(!mc) return;
        mc[key] = numeric ? (parseInt(inp.value,10)||1) : inp.value;
      });
      await refreshChart(inp.dataset.macro);
    }));
  };
  microField('micro-int','intensity', true);
  microField('micro-vol','volume', true);
  microField('micro-type','type', false);
  microField('micro-note','note', false);

  const addTaskBtn = document.getElementById('addTaskBtn');
  if(addTaskBtn) addTaskBtn.addEventListener('click', async ()=>{
    try{
      const name = document.getElementById('taskName').value.trim();
      if(!name){ toast('Ponle un nombre a la tarea', true); return; }
      const tasks = await getTasks();
      tasks.push({ id:uid(), name, desc:document.getElementById('taskDesc').value.trim(), dueDate:document.getElementById('taskDue').value, athleteId:document.getElementById('taskAthlete').value, done:false });
      const ok = await safeSet('tasks-list', JSON.stringify(tasks), true);
      toast(ok?'Tarea añadida':'No se pudo guardar', !ok);
      renderKeepScroll();
    }catch(e){ toast('Error al guardar: '+e.message, true); }
  });
  document.querySelectorAll('[data-edittask]').forEach(b=>b.addEventListener('click', ()=>{
    state.editTask = b.dataset.edittask; renderKeepScroll();
  }));
  document.querySelectorAll('[data-canceltask]').forEach(b=>b.addEventListener('click', ()=>{
    state.editTask = null; renderKeepScroll();
  }));
  document.querySelectorAll('[data-savetask]').forEach(b=>b.addEventListener('click', async ()=>{
    const id = b.dataset.savetask;
    const card = document.querySelector(`[data-taskcard="${id}"]`);
    if(!card) return;
    const nombre = card.querySelector('.tk-name').value.trim();
    if(!nombre){ toast('La tarea necesita un nombre', true); return; }
    const tasks = await getTasks();
    const t = tasks.find(x=>x.id===id);
    if(t){
      t.name = nombre;
      t.desc = card.querySelector('.tk-desc').value.trim();
      t.dueDate = card.querySelector('.tk-due').value;
      t.athleteId = card.querySelector('.tk-ath').value;
      const ok = await safeSet('tasks-list', JSON.stringify(tasks), true);
      toast(ok?'Tarea actualizada':'No se pudo guardar', !ok);
    }
    state.editTask = null; renderKeepScroll();
  }));
  document.querySelectorAll('[data-donetask]').forEach(b=>b.addEventListener('click', async ()=>{
    const tasks = await getTasks();
    const t = tasks.find(x=>x.id===b.dataset.donetask); if(t) t.done=true;
    await safeSet('tasks-list', JSON.stringify(tasks), true);
    renderKeepScroll();
  }));
  document.querySelectorAll('[data-deltask]').forEach(b=>b.addEventListener('click', async ()=>{
    let tasks = await getTasks();
    tasks = tasks.filter(x=>x.id!==b.dataset.deltask);
    await safeSet('tasks-list', JSON.stringify(tasks), true);
    renderKeepScroll();
  }));

  const callAthleteSelect = document.getElementById('callAthleteSelect');
  if(callAthleteSelect) callAthleteSelect.addEventListener('change', ()=>{ state.selectedId = callAthleteSelect.value; renderKeepScroll(); });
  const saveCallBtn = document.getElementById('saveCallBtn');
  if(saveCallBtn) saveCallBtn.addEventListener('click', async ()=>{
    const athleteId = saveCallBtn.dataset.athleteid;
    const call = { nextDate: document.getElementById('callDate').value, duration: document.getElementById('callDuration').value, notes: document.getElementById('callNotes').value };
    try{
      const ok = await safeSet('call-'+athleteId, JSON.stringify(call), true);
      toast(ok ? 'Videollamada guardada' : 'No se pudo guardar', !ok);
      saveCallBtn.textContent = ok?'Guardado ✓':'Error'; setTimeout(()=>{ saveCallBtn.textContent='Guardar'; },1400);
    }catch(e){ toast('Error al guardar: '+e.message, true); }
  });

  const saveProfileBtn = document.getElementById('saveProfileBtn');
  if(saveProfileBtn) saveProfileBtn.addEventListener('click', async ()=>{
    const athleteId = saveProfileBtn.dataset.athleteid;
    const p = { estado:document.getElementById('profEstado').value, tarifa:document.getElementById('profTarifa').value, pagado:document.getElementById('profPagado').value,
      vence:document.getElementById('profVence').value, plaza:document.getElementById('profPlaza').value, alta:document.getElementById('profAlta').value,
      notas:document.getElementById('profNotas').value };
    try{
      const ok = await safeSet('profile-'+athleteId, JSON.stringify(p), true);
      toast(ok ? 'Perfil guardado' : 'No se pudo guardar — revisa la conexión', !ok);
      saveProfileBtn.textContent = ok?'Guardado ✓':'Error'; setTimeout(()=>{ saveProfileBtn.textContent='Guardar'; },1400);
    }catch(e){ toast('Error al guardar: '+e.message, true); }
  });

  const submitIntake = document.getElementById('submitIntake');
  if(submitIntake) submitIntake.addEventListener('click', async ()=>{
    try{
      const data = {}; INTAKE_FIELDS.forEach(f=>{ const el=document.querySelector(`[data-intake="${f.id}"]`); data[f.id]=el?el.value.trim():''; });
      const ok = await safeSet('intake-'+state.athleteAsId, JSON.stringify(data), true);
      if(!ok){ toast('No se pudo guardar — revisa la conexión e inténtalo de nuevo', true); return; }
      toast('Datos guardados');
      state.tab='rutina'; renderScrollTop();
    }catch(e){ toast('Error al guardar: '+e.message, true); }
  });

  document.querySelectorAll('[data-toggle]').forEach(h=>h.addEventListener('click', ()=>{
    const d = h.dataset.toggle;
    const acc = h.closest('.acc');
    if(!acc) return;
    const wasOpen = acc.classList.contains('open');
    const container = acc.parentElement;
    container.querySelectorAll(':scope > .acc.open').forEach(el=>{ if(el!==acc) el.classList.remove('open'); });
    acc.classList.toggle('open', !wasOpen);
    if(!wasOpen){
      acc.classList.add('just-opened');
      setTimeout(()=>acc.classList.remove('just-opened'), 400);
    }
    Object.keys(state.openDays).forEach(k=>{ state.openDays[k] = false; });
    state.openDays[d] = !wasOpen;
  }));

  // --- Copiar / intercambiar / vaciar días de la planificación ---

  const clonaBloques = (dias)=>{
    const copia = {};
    BLOCKS.forEach(b=>{
      copia[b.key] = (dias[b.key]||[]).map(ex=>({ ...ex, id: uid(), timer: {...exTimer(ex)} }));
    });

    const draft = await getRoutine(athleteId, true);
    if(totalDe(draft.days[origen]) === 0){ toast(`${origen} no tiene ejercicios que copiar`, true); return; }
    const yaHay = totalDe(draft.days[destino]);
    if(modo === 'replace' && yaHay){
      if(!confirm(`${destino.charAt(0).toUpperCase()+destino.slice(1)} ya tiene ${yaHay} ejercicio${yaHay===1?'':'s'}.\n\n¿Sustituirlos por los de ${origen}?`)) return;
    }
    const clon = clonaBloques(draft.days[origen]);
    if(modo === 'replace'){
      draft.days[destino] = clon;
    } else {
      BLOCKS.forEach(b=>{ draft.days[destino][b.key] = (draft.days[destino][b.key]||[]).concat(clon[b.key]); });

      const overallRPE = val('overallRPE');

      const fecha = card.querySelector('#drDate').value || todayISO();
      const mins = Math.max(1, parseInt(card.querySelector('#drMin').value,10) || 60);

      // Leemos la rutina aquí: 'source' vive en el ámbito de la plantilla, no aquí.

      const tipoDelDia = (rutinaHoy.days[dia] && rutinaHoy.days[dia].tipo) || '';

    const num = (sel, min, max, fallback)=>{
      const el = card.querySelector(sel); if(!el) return fallback;
      const v = parseInt(el.value,10);
      return (isNaN(v) || v<min || v>max) ? fallback : v;
    };

    if(nuevoDia) e.day = nuevoDia.value;
    e.durationSeconds = mins*60;
